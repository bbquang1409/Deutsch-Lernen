<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lückentext-Training B1–C1</title>
<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --ink:#1E293B; --muted:#64748B; --border:#E2E8F0;
  --navy:#2C3E5C; --navy-dark:#20304A; --teal:#2C7A7B; --teal-light:#E6F4F3;
  --amber:#C9973E; --amber-light:#FBF3E3; --sage:#6B8E7F;
  --correct:#2F855A; --correct-bg:#F0FDF4; --correct-border:#B7E4C7;
  --wrong:#C0392B; --wrong-bg:#FDF2F1; --wrong-border:#F1B9B2;
  --radius:14px; --radius-sm:9px;
}
*{box-sizing:border-box;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; padding-bottom:40px;}
h1,h2,h3,h4{font-family:"Georgia",serif; font-weight:700; margin:0 0 8px;}
p{margin:0 0 10px;}
header{position:sticky; top:0; z-index:50; background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%); color:#fff; padding:14px 16px 10px; box-shadow:0 4px 14px rgba(0,0,0,.15);}
.header-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.header-title{font-size:1.05rem; font-weight:700;}
.header-title small{display:block; font-weight:400; font-size:.72rem; color:#C9D6E8; margin-top:2px;}
.header-controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
main{max-width:760px; margin:0 auto; padding:16px;}
.panel{display:none;}
.panel.active{display:block;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(20,30,50,.04);}
.level-select{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.level-btn{flex:1; min-width:60px; padding:10px 4px; border-radius:10px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; text-align:center; font-size:.74rem; font-weight:700; color:var(--muted);}
.level-btn .sub{display:block; font-weight:400; font-size:.68rem; margin-top:1px;}
.level-btn .dots{display:block; letter-spacing:1px; color:var(--amber); font-size:.7rem; margin-top:2px;}
.level-btn.active{border-color:var(--teal); background:var(--teal-light); color:var(--teal);}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
.btn-primary{background:var(--teal); color:#fff; border:none; border-radius:10px; padding:10px 16px; font-size:.86rem; font-weight:700; cursor:pointer;}
.btn-primary:hover{background:#236263;}
.score-badge{background:var(--navy); color:#fff; border-radius:20px; padding:6px 14px; font-size:.8rem; font-weight:700;}

.text-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px;}
.text-meta{font-size:.72rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:8px;}
.text-header{font-size:.9rem; color:var(--navy); margin-bottom:4px;}
.text-header b{color:var(--ink);}
.text-body{font-size:.96rem; margin:12px 0;}
.text-body p{margin:0 0 10px;}
.gap-badge{display:inline-block; background:var(--muted); color:#fff; font-size:.68rem; font-weight:700; border-radius:5px 0 0 5px; padding:5px 6px; vertical-align:middle;}
.gap-input{
  border:1.5px solid var(--border); border-left:none; border-radius:0 6px 6px 0; padding:5px 8px;
  font-size:.9rem; font-family:inherit; vertical-align:middle; min-width:90px; max-width:170px;
  background:var(--bg); color:var(--ink);
}
.gap-input:focus{outline:none; border-color:var(--teal); background:#fff;}
.gap-input.correct{background:var(--correct-bg); border-color:var(--correct-border); color:var(--correct); font-weight:700;}
.gap-input.wrong{background:var(--wrong-bg); border-color:var(--wrong-border); color:var(--wrong); font-weight:700;}
.gap-input.solution{background:var(--amber-light); border-color:var(--amber); color:#7A5C17; font-weight:700;}
.gap-wrap{display:inline-block; margin:2px 1px;}

.btn-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
.check-btn{background:var(--amber); color:#2b2107; border:none; border-radius:10px; padding:9px 16px; font-size:.85rem; font-weight:700; cursor:pointer;}
.check-btn:hover{opacity:.9;}
.check-btn:disabled{opacity:.5; cursor:default;}
.hint-btn{background:var(--surface); color:var(--teal); border:1.5px solid var(--teal); border-radius:10px; padding:9px 16px; font-size:.85rem; font-weight:700; cursor:pointer;}
.hint-btn:hover{background:var(--teal-light);}
.solution-btn{background:var(--surface); color:var(--muted); border:1.5px solid var(--border); border-radius:10px; padding:9px 16px; font-size:.85rem; font-weight:700; cursor:pointer;}
.solution-btn:hover{border-color:var(--muted);}

.explain-list{margin-top:12px; display:none;}
.explain-list.show{display:block;}
.explain-item{background:var(--teal-light); border-left:4px solid var(--teal); border-radius:0 8px 8px 0; padding:8px 12px; margin-bottom:7px; font-size:.85rem;}
.explain-item .num{display:inline-block; background:var(--navy); color:#fff; font-size:.68rem; font-weight:700; border-radius:20px; padding:1px 8px; margin-right:6px;}
.explain-item .w{color:var(--teal); font-weight:700;}
.explain-item.wrong-item{background:var(--wrong-bg); border-left-color:var(--wrong);}
.explain-item.solution-item{background:var(--amber-light); border-left-color:var(--amber);}

.text-score{font-size:.85rem; font-weight:700; color:var(--navy); margin-top:8px;}
.result-box{text-align:center; padding:22px;}
.result-score{font-size:2.4rem; font-weight:800; color:var(--navy); font-family:Georgia,serif;}
.result-label{color:var(--muted); font-size:.9rem;}
footer{text-align:center; color:var(--muted); font-size:.75rem; margin-top:22px;}
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="header-title">Lückentext-Training<small>Text rekonstruieren — B1.1 bis C1</small></div>
  </div>
</header>

<main>

<p style="color:var(--muted); font-size:.85rem; margin:2px 0 14px;">Ergänzen Sie die fehlenden Wörter im Text. Danach auf „Auswerten" klicken — bei Bedarf helfen „Hinweis" und „Lösung zeigen".</p>

<section class="panel active" id="panel-uebungen">

  <div class="card">
    <h2 style="margin-bottom:10px;">Stufe wählen</h2>
    <div class="level-select" id="levelSelect"></div>
    <div class="toolbar">
      <button class="btn-primary" onclick="startUebung()">🔄 Neue Textauswahl (3 Texte)</button>
      <span class="score-badge" id="uebungScore">0 / 0</span>
    </div>
  </div>
  <div id="uebungContainer"></div>
</section>

</main>
<footer>Lückentext-Trainer · für den Deutschunterricht</footer>

<script>
/* ============================================================
   DATENBANK: 5 Stufen x 13 Texte x 5 Lücken
   body: Text mit Platzhaltern {1}..{5}
   blanks: [{w:Lösungswort, de:Erklärung DE, vi:Erklärung VI}, ...]
   ============================================================ */
const LEVELS_META = {
  1:{label:"Stufe 1", sub:"B1.1", dots:"●"},
  2:{label:"Stufe 2", sub:"B1.2", dots:"●●"},
  3:{label:"Stufe 3", sub:"B2.1", dots:"●●●"},
  4:{label:"Stufe 4", sub:"B2.2", dots:"●●●●"},
  5:{label:"Stufe 5", sub:"C1", dots:"●●●●●"}
};

const TEXTS = {

1:[
{an:"Herrn Kim, Ausbilder", betreff:"Entschuldigung für die Verspätung",
body:"Sehr geehrter Herr Kim,\n\nes tut mir leid, dass ich heute Morgen zu spät zur Arbeit {1} bin. Der Bus hatte eine Panne, und ich musste 20 Minuten {2} der nächsten Haltestelle warten. Ich weiß, dass Pünktlichkeit in unserem Betrieb sehr wichtig ist, und {3} tut mir die Verspätung besonders leid. Morgen werde ich früher {4} Hause losfahren, {5} so etwas nicht noch einmal passiert.\n\nMit freundlichen Grüßen\nMinh",
blanks:[
{w:"gekommen",de:"Perfekt von „kommen“: bin + Partizip II (gekommen). Trennbares Verb „ankommen“ wäre auch möglich, hier reicht das einfache Partizip.",vi:"Thì hoàn thành của „kommen“: bin + Partizip II (gekommen)."},
{w:"an",de:"„warten an + Dativ“ – hier: an der Haltestelle warten (Ort).",vi:"„warten an“ (chờ ở) + Dativ, chỉ vị trí."},
{w:"deshalb",de:"Konnektor für die Folge/den Grund: deshalb = aus diesem Grund.",vi:"„deshalb“ (vì vậy) diễn tả kết quả/hệ quả của điều vừa nói."},
{w:"von",de:"„von zu Hause losfahren“ – feste Wendung mit „von“.",vi:"„von zu Hause losfahren“ (xuất phát từ nhà) là cụm cố định."},
{w:"damit",de:"Konnektor für den Zweck mit gleichem/anderem Subjekt: damit + Nebensatz.",vi:"„damit“ diễn tả mục đích, theo sau là mệnh đề phụ."}
]},

{an:"Team Werkstatt", betreff:"Einladung zur Weihnachtsfeier",
body:"Liebe Kolleginnen und Kollegen,\n\nwie jedes Jahr {1} wir am 15. Dezember unsere Weihnachtsfeier. Wir treffen uns um 18 Uhr {2} Restaurant „Zur Post“. Bitte {3} Sie mir bis Freitag Bescheid, ob Sie {4} können. Wer eine Begleitung mitbringen möchte, ist herzlich {5}.\n\nViele Grüße\nFrau Schulz",
blanks:[
{w:"feiern",de:"Präsens von „feiern“ (Verb 1. Person Plural): wir feiern.",vi:"Thì hiện tại của „feiern“ (tổ chức lễ)."},
{w:"im",de:"„im Restaurant“ = in + dem Restaurant (Wechselpräposition, Ort → Dativ).",vi:"„im“ = in + dem (giới từ chỉ vị trí, cách Dativ)."},
{w:"geben",de:"„jemandem Bescheid geben“ = jemanden informieren – feste Wendung.",vi:"„jemandem Bescheid geben“ (báo cho ai biết) là cụm cố định."},
{w:"teilnehmen",de:"Trennbares Verb „teilnehmen“ nach Modalverb „können“ steht im Infinitiv am Satzende.",vi:"Động từ tách „teilnehmen“ (tham gia) đứng nguyên mẫu ở cuối câu sau động từ khiếm khuyết."},
{w:"willkommen",de:"Feste Wendung: „herzlich willkommen“ = eine freundliche Einladung.",vi:"Cụm cố định „herzlich willkommen“ (rất hoan nghênh)."}
]},

{an:"—", betreff:"Kurznachricht an einen Freund",
body:"Hallo Long,\n\nwie geht's dir? Ich {1} seit zwei Wochen ein Praktikum in einer Autowerkstatt {2}. Es macht mir viel Spaß, aber ich bin abends immer sehr müde. Am Wochenende {3} ich mich meistens nur aus. Hast du Lust, {4} Samstag zusammen Fußball zu spielen? Ich {5} mich schon darauf!\n\nBis bald\nDuc",
blanks:[
{w:"mache",de:"„ein Praktikum machen“ = an einem Praktikum teilnehmen; Präsens.",vi:"„ein Praktikum machen“ (đi thực tập) — thì hiện tại."},
{w:"in",de:"„ein Praktikum in einer Werkstatt machen“ – Präposition „in“ für den Ort der Tätigkeit.",vi:"„in“ chỉ nơi diễn ra việc thực tập."},
{w:"ruhe",de:"Reflexivverb „sich ausruhen“, Präsens 1. Person: ich ruhe mich aus (trennbar).",vi:"Động từ phản thân „sich ausruhen“ (nghỉ ngơi), thì hiện tại, dạng tách."},
{w:"am",de:"„am Samstag“ = an + dem Samstag (Zeitangabe mit Wochentag).",vi:"„am“ = an + dem, dùng trước thứ trong tuần."},
{w:"freue",de:"„sich freuen auf + Akkusativ“ – Präsens: ich freue mich darauf.",vi:"„sich freuen auf“ (mong chờ) — thì hiện tại."}
]},

{an:"—", betreff:"Notiz für die Nachbarin", 
body:"Liebe Frau Ana,\n\nich {1} am Montag für zwei Tage nach Berlin. Könnten Sie bitte in dieser Zeit meine Blumen {2}? Der Schlüssel liegt {3} der Fußmatte. Wenn etwas {4} sein sollte, erreichen Sie mich {5} Telefon.\n\nVielen Dank!\nFrau Nguyen",
blanks:[
{w:"fahre",de:"Präsens mit Zukunftsbedeutung (Zeitangabe „am Montag“ macht die Zukunft klar).",vi:"Thì hiện tại mang nghĩa tương lai (nhờ có mốc thời gian „am Montag“)."},
{w:"gießen",de:"Trennbares/einfaches Verb „gießen“ nach Modalverb „könnten“ im Infinitiv am Satzende.",vi:"Động từ „gießen“ (tưới) ở dạng nguyên mẫu, đứng cuối câu sau động từ khiếm khuyết."},
{w:"unter",de:"Wechselpräposition „unter“ + Dativ, weil keine Bewegung, sondern Position (liegt unter der Matte).",vi:"Giới từ hai cách „unter“ + Dativ vì diễn tả vị trí, không phải chuyển động."},
{w:"unklar",de:"Adjektiv nach „etwas“ + Konjunktiv II Höflichkeitsform „sein sollte“.",vi:"Tính từ sau „etwas“, kết hợp Konjunktiv II lịch sự „sein sollte“."},
{w:"per",de:"„per Telefon“ = mit Hilfe von Telefon – feste Wendung, oft in formellen Texten.",vi:"„per Telefon“ (qua điện thoại) là cụm cố định, thường dùng trong văn bản trang trọng."}
]},

{an:"Frau Weber, Personalabteilung", betreff:"Anfrage zur Gehaltsabrechnung",
body:"Sehr geehrte Frau Weber,\n\nich habe eine Frage {1} meine letzte Gehaltsabrechnung. Der Betrag {2} niedriger als sonst. Könnten Sie das bitte {3} prüfen? Ich habe die Abrechnung als Anhang {4} diese E-Mail gelegt. Ich {5} mich über eine Rückmeldung bis Ende der Woche.",
blanks:[
{w:"zu",de:"„eine Frage zu etwas haben“ – feste Präposition „zu“.",vi:"„eine Frage zu etwas haben“ (có câu hỏi về việc gì) — giới từ cố định „zu“."},
{w:"war",de:"Präteritum von „sein“ in formellen/schriftlichen Texten (statt Perfekt).",vi:"Thì quá khứ đơn của „sein“, hay dùng trong văn bản trang trọng thay vì Perfekt."},
{w:"kurz",de:"Adverb, das die Bitte modifiziert: kurz prüfen = schnell nachsehen.",vi:"Trạng từ bổ nghĩa cho lời yêu cầu: „kurz prüfen“ (kiểm tra nhanh)."},
{w:"an",de:"„etwas an eine E-Mail legen/anhängen“ – Präposition „an“ für den Anhang.",vi:"„an“ dùng khi nói về việc đính kèm vào email."},
{w:"freue",de:"„sich freuen über + Akkusativ“ – hier im Sinn von „ich wäre dankbar für“.",vi:"„sich freuen über“ ở đây mang nghĩa „tôi sẽ rất biết ơn nếu…“."}
]},

{an:"—", betreff:"Beschwerde über laute Musik", 
body:"Liebe Nachbarn,\n\nich möchte Sie höflich {1}, abends etwas leiser Musik zu hören. Gestern {2} die Musik bis Mitternacht so laut, dass ich nicht schlafen konnte. Ich verstehe, dass man auch mal feiern {3}, aber vielleicht {4} wir uns auf eine Uhrzeit einigen. Vielen Dank {5} Ihr Verständnis.",
blanks:[
{w:"bitten",de:"„jemanden bitten, etwas zu tun“ – Infinitiv nach „bitten“.",vi:"„jemanden bitten, ... zu tun“ (nhờ ai làm gì) — dạng nguyên mẫu sau „bitten“."},
{w:"war",de:"Präteritum von „sein“: die Musik war laut.",vi:"Thì quá khứ đơn của „sein“."},
{w:"möchte",de:"Modalverb „möchten“ drückt einen Wunsch/eine Erlaubnis aus.",vi:"Động từ khiếm khuyết „möchten“ diễn tả mong muốn."},
{w:"könnten",de:"Konjunktiv II von „können“ für einen höflichen Vorschlag.",vi:"Konjunktiv II của „können“ dùng để đề nghị lịch sự."},
{w:"für",de:"„danken für + Akkusativ“ – feste Präposition.",vi:"„danken für“ (cảm ơn vì) — giới từ cố định."}
]},

{an:"—", betreff:"Terminverschiebung beim Arzt", 
body:"Guten Tag,\n\nich habe {1} Dienstag um 9 Uhr einen Termin bei Ihnen. Leider {2} ich an diesem Tag arbeiten und kann nicht kommen. Könnten Sie mir bitte einen anderen Termin {3} nächste Woche geben? Am liebsten {4} ich vormittags, da ich nachmittags in der Werkstatt {5} muss.\n\nVielen Dank!",
blanks:[
{w:"am",de:"„am Dienstag“ = an + dem Dienstag, Zeitangabe mit Wochentag.",vi:"„am“ = an + dem, dùng trước thứ trong tuần."},
{w:"muss",de:"Modalverb „müssen“, Präsens: ich muss arbeiten.",vi:"Động từ khiếm khuyết „müssen“ (phải), thì hiện tại."},
{w:"für",de:"„einen Termin für nächste Woche geben“ – Präposition „für“ + Zeitangabe.",vi:"„für“ + mốc thời gian, chỉ thời điểm dự kiến."},
{w:"hätte",de:"Konjunktiv II von „haben“ für eine höfliche Präferenz: „am liebsten hätte ich…“.",vi:"Konjunktiv II của „haben“ để diễn đạt sự ưu tiên một cách lịch sự."},
{w:"arbeiten",de:"Infinitiv nach Modalverb „muss“, am Satzende.",vi:"Dạng nguyên mẫu sau động từ khiếm khuyết „muss“, đứng cuối câu."}
]},

{an:"—", betreff:"Glückwunsch zur bestandenen Prüfung",
body:"Liebe Hoa,\n\nherzlichen Glückwunsch {1} deiner bestandenen Prüfung! Ich weiß, wie viel du {2} das Bestehen gelernt hast. Du hast es dir wirklich {3}. Lass uns {4} feiern, wenn du Zeit hast. Ich bin sehr {5} auf dich!\n\nLiebe Grüße\nMai",
blanks:[
{w:"zu",de:"„jemandem zu etwas gratulieren“ – feste Präposition „zu“.",vi:"„zu etwas gratulieren“ (chúc mừng về việc gì) — giới từ cố định „zu“."},
{w:"für",de:"„für das Bestehen lernen“ – Präposition „für“ (Zweck).",vi:"„für“ chỉ mục đích của việc học."},
{w:"verdient",de:"Feste Wendung: „sich etwas verdient haben“ = etwas zu Recht bekommen.",vi:"Cụm cố định „sich etwas verdient haben“ (xứng đáng có được điều gì)."},
{w:"zusammen",de:"Adverb: gemeinsam, miteinander.",vi:"Trạng từ „zusammen“ (cùng nhau)."},
{w:"stolz",de:"„stolz sein auf + Akkusativ“ – hier: stolz auf dich.",vi:"„stolz sein auf“ (tự hào về) — ở đây: tự hào về bạn."}
]},

{an:"Frau Al-Amin", betreff:"Bitte um Urlaub",
body:"Sehr geehrte Frau Al-Amin,\n\nich möchte Sie {1} bitten, mir vom 3. bis 10. August Urlaub {2} genehmigen. In dieser Zeit findet die Hochzeit meiner Schwester {3} Vietnam statt. Meine Aufgaben habe ich bereits {4} meinen Kollegen Herrn Park übergeben. Ich bedanke mich {5} Ihr Verständnis.",
blanks:[
{w:"hiermit",de:"Formelle Wendung: „hiermit bitten“ = mit diesem Schreiben bitten.",vi:"Cụm trang trọng „hiermit“ (bằng thư này) — hay dùng trong văn bản chính thức."},
{w:"zu",de:"„jemandem etwas genehmigen“ nach „bitten“ steht mit „zu + Infinitiv“.",vi:"Sau „bitten“ là cấu trúc „zu + động từ nguyên mẫu“."},
{w:"in",de:"„in Vietnam“ – Präposition „in“ + Land (ohne Artikel).",vi:"„in“ + tên quốc gia (không có mạo từ)."},
{w:"an",de:"„etwas an jemanden übergeben“ – feste Präposition „an“.",vi:"„an jemanden übergeben“ (bàn giao cho ai) — giới từ cố định „an“."},
{w:"für",de:"„sich bedanken für + Akkusativ“ – feste Präposition.",vi:"„sich bedanken für“ (cảm ơn vì) — giới từ cố định."}
]},

{an:"—", betreff:"Info zum Umzug", 
body:"Liebe Nachbarn,\n\nwie Sie vielleicht schon {1} haben, ziehen wir am 1. Juli aus. Der Umzugswagen {2} gegen 8 Uhr morgens vor dem Haus stehen. Es {3} sicher etwas lauter sein als sonst. Wir {4} uns schon jetzt für die Unannehmlichkeiten und wünschen Ihnen alles Gute {5} die Zukunft.",
blanks:[
{w:"bemerkt",de:"Partizip II von „bemerken“ nach Perfekt-Hilfsverb „haben“.",vi:"Partizip II của „bemerken“ (nhận thấy), dùng với „haben“ trong thì hoàn thành."},
{w:"wird",de:"Futur I (werden + Infinitiv) für eine Vorhersage: der Wagen wird stehen.",vi:"Thì tương lai (werden + động từ nguyên mẫu) để dự đoán."},
{w:"wird",de:"Futur I für eine Vermutung über die Zukunft: es wird lauter sein.",vi:"Thì tương lai để phỏng đoán."},
{w:"entschuldigen",de:"„sich entschuldigen für + Akkusativ“ – Präsens 1. Person Plural.",vi:"„sich entschuldigen für“ (xin lỗi vì) — thì hiện tại, ngôi „chúng tôi“."},
{w:"für",de:"„alles Gute für die Zukunft wünschen“ – feste Präposition „für“.",vi:"„für die Zukunft“ (cho tương lai) — cụm cố định."}
]},

{an:"Essay", betreff:"Arbeitsmarktintegration von Zugewanderten",
body:"Die erfolgreiche Integration Zugewanderter {1} den deutschen Arbeitsmarkt hängt maßgeblich {2} der Anerkennung ausländischer Qualifikationen ab. Zwar wurden in den letzten Jahren zahlreiche Verfahren vereinfacht, dennoch klagen Betroffene weiterhin {3} langwierige Bürokratie. Sollte es gelingen, {4} Anerkennungsverfahren spürbar zu beschleunigen, {5} sich mittelfristig ein positiver Effekt auf den Fachkräftemangel erwarten.",

{w:"in",de:"„die Integration in etwas“ – feste Präposition „in“ (Nominalisierung).",vi:"„die Integration in etwas“ (hòa nhập vào) — giới từ cố định."},

{an:"Stellungnahme", betreff:"Zu den laufenden Tarifverhandlungen",
body:"Die Gewerkschaft weist darauf hin, {1} die Reallöhne in der Branche seit Jahren hinter der allgemeinen Preisentwicklung zurückbleiben. Die Arbeitgeberseite hingegen macht geltend, {2} eine deutliche Lohnerhöhung angesichts der wirtschaftlichen Rahmenbedingungen kaum {3} vertreten sei. Beide Seiten zeigen sich grundsätzlich verhandlungsbereit, wenngleich ein Kompromiss {4} jetzigem Stand noch {5} erzielt werden konnte.",
blanks:[
{w:"dass",de:"Konjunktion, leitet die Aussage der Gewerkschaft als Nebensatz ein.",vi:"Liên từ „dass“, mở đầu phát biểu của công đoàn."},
{w:"dass",de:"Konjunktion für die Gegenposition der Arbeitgeberseite.",vi:"Liên từ cho quan điểm đối lập của bên sử dụng lao động."},
{w:"zu",de:"„zu vertreten sein“ – Passiversatzform mit „sein + zu + Infinitiv“.",vi:"Cấu trúc thay thế bị động „sein + zu + Infinitiv“."},

]},

{an:"Kommentar", betreff:"Demografischer Wandel und Ausbildungsmarkt",
body:"Angesichts des demografischen Wandels sehen sich immer mehr Betriebe {1} der Situation konfrontiert, Ausbildungsplätze nicht {2} besetzen zu können. Während vor zwei Jahrzehnten noch ein Überangebot {3} Bewerbern herrschte, hat sich das Verhältnis mittlerweile umgekehrt. Wer {4} als Ausbildungsbetrieb attraktiv bleiben will, kommt {5} einer Investition in Ausbildungsqualität und Arbeitsbedingungen kaum umhin.",

{w:"mit",de:"„sich mit einer Situation konfrontiert sehen“ – feste Präposition „mit“.",vi:"„sich mit einer Situation konfrontiert sehen“ (đối mặt với tình huống) — giới từ cố định."},
{w:"mehr",de:"Adverb: nicht mehr besetzen können = es geht nicht mehr wie früher.",vi:"Trạng từ „mehr“ trong cụm phủ định „nicht mehr“ (không còn nữa)."},

{an:"Fachartikel", betreff:"Zukunft der dualen Ausbildung",
body:"Ob das duale Ausbildungssystem seine internationale Vorbildfunktion {1} Zukunft behaupten kann, hängt entscheidend {2} seiner Anpassungsfähigkeit ab. Kritiker bemängeln, das System reagiere {3} langsam auf neue Berufsbilder im digitalen Bereich. Befürworter hingegen betonen, gerade die enge Verzahnung {4} Theorie und betrieblicher Praxis mache das Modell auch künftig {5} zukunftsfähig.",

{w:"von",de:"„abhängen von + Dativ“ – feste Präposition.",vi:"„abhängen von“ (phụ thuộc vào) — giới từ cố định."},

]},

{an:"Redebeitrag", betreff:"Redebeitrag zur Betriebsversammlung",
body:"Liebe Kolleginnen und Kollegen,\n\nwie Sie sicher wissen, steht unser Unternehmen derzeit {1} einem grundlegenden Wandel. Anstatt {2} auf Bewährtes zu verlassen, sind wir gefordert, neue Wege zu gehen. Nur {3} wir gemeinsam an einem Strang ziehen, wird es uns gelingen, diese Phase erfolgreich {4} meistern. Ich möchte Sie daher bitten, den anstehenden Veränderungen mit Offenheit {5} begegnen.",

{an:"Kritischer Kommentar", betreff:"Bürokratie als Ausbildungshindernis",
body:"Kaum ein Thema wird {1} Ausbildungsbetrieben so häufig kritisiert wie der bürokratische Aufwand, der {2} der Einstellung von Auszubildenden entsteht. Anstatt die Verfahren zu vereinfachen, {3} in den letzten Jahren zusätzliche Nachweispflichten eingeführt worden, die insbesondere kleinere Betriebe {4} überfordern drohen. Eine spürbare Entlastung, {5} von der Politik wiederholt angekündigt wurde, steht bislang aus.",
blanks:[

{w:"bei",de:"„bei der Einstellung entstehen“ – feste Präposition „bei“ (Anlass).",vi:"„bei der Einstellung“ (khi tuyển dụng) — giới từ chỉ dịp/thời điểm."},

{an:"Analyse", betreff:"Fachkräftezuwanderung nach Deutschland",
body:"Um dem wachsenden Fachkräftemangel {1} begegnen, hat die Bundesregierung die Einwanderungsbestimmungen {2} qualifizierte Arbeitskräfte in den vergangenen Jahren deutlich gelockert. Dennoch zeigt sich, {3} allein gesetzliche Erleichterungen nicht ausreichen: Ohne eine spürbare Verbesserung der Anerkennungspraxis {4} viele hochqualifizierte Zuwanderer weiterhin unterhalb ihres Qualifikationsniveaus beschäftigt bleiben, {5} dem Arbeitsmarkt wertvolles Potenzial entgeht.",

{an:"Kommentar", betreff:"Digitalisierung der Verwaltung",
body:"Die schleppende Digitalisierung deutscher Behörden wird von Wirtschaftsvertretern seit Langem {1} zentrales Hemmnis für die Wettbewerbsfähigkeit des Standorts betrachtet. Während Nachbarländer ihre Verwaltungsprozesse bereits weitgehend digitalisiert haben, hinkt Deutschland {2} hinterher, obwohl entsprechende Gesetze {3} formulieren längst vorliegen. Ohne eine konsequentere Umsetzung dürfte sich dieser Rückstand {4} weiter vergrößern, was letztlich {5} Nachteil für Unternehmen wie Auszubildende gleichermaßen wäre.",
blanks:[
{w:"als",de:"„etwas als etwas betrachten“ – feste Präposition „als“.",vi:"„etwas als etwas betrachten“ (coi cái gì là) — giới từ cố định."},

{an:"Diskussionsbeitrag", betreff:"Work-Life-Balance in der Ausbildung",
body:"In der Diskussion {1} eine bessere Work-Life-Balance für Auszubildende wird häufig übersehen, {2} bereits während der Ausbildungszeit wichtige Weichen für spätere Arbeitsgewohnheiten gestellt werden. Wer {3} Beginn seiner beruflichen Laufbahn ständige Überlastung als normal erlebt, wird diese Haltung mit hoher Wahrscheinlichkeit auch später {4} beibehalten. Ausbildungsbetriebe sollten sich dieser Vorbildfunktion {5} bewusst sein.",
blanks:[
{w:"um",de:"„die Diskussion um etwas“ – feste Präposition „um“ (Thema).",vi:"„die Diskussion um etwas“ (cuộc thảo luận về) — giới từ cố định."},

{w:"stärker",de:"Komparativ von „stark“: sich stärker bewusst sein = mehr bewusst sein.",vi:"So sánh hơn của „stark“: „sich stärker bewusst sein“ (ý thức rõ hơn)."}

{an:"Fachlicher Bericht", betreff:"Nachhaltigkeit als Unternehmensstrategie",
body:"Immer mehr mittelständische Unternehmen integrieren Nachhaltigkeitsziele {1} ihre strategische Ausrichtung, nicht zuletzt, {2} sich hieraus auch wirtschaftliche Vorteile ergeben können. Studien zufolge gewinnen ökologisch verantwortungsvoll agierende Betriebe zunehmend {3} Attraktivität bei jungen Fachkräften, {4} bei der Berufswahl verstärkt auf die Werte ihres künftigen Arbeitgebers achten. Wer diesen Wandel verschläft, riskiert {5}, langfristig an Wettbewerbsfähigkeit einzubüßen.",
blanks:[
{w:"in",de:"„etwas in die Ausrichtung integrieren“ – feste Präposition „in“.",vi:"„etwas in etwas integrieren“ (lồng ghép vào) — giới từ cố định."},

{w:"die",de:"Relativpronomen Nominativ Plural, bezogen auf „Fachkräfte“: die achten.",vi:"Đại từ quan hệ, cách Nominativ, số nhiều: „die“."},
{w:"es",de:"Vorläufiges „es“ vor zu-Infinitiv-Konstruktion: riskiert es, einzubüßen.",vi:"„es“ tạm thời đứng trước cụm zu-Infinitiv."}
]},

{an:"Kommentar", betreff:"Künstliche Intelligenz am Arbeitsplatz",
body:"Der Einsatz künstlicher Intelligenz {1} Arbeitsalltag wirft zunehmend Fragen {2} Qualifikationsanforderungen und Arbeitsplatzsicherheit auf. Während einige Berufsbilder {3} absehbarer Zeit grundlegend verändert werden dürften, entstehen gleichzeitig neue Tätigkeitsfelder, deren Anforderungsprofile heute vielfach noch unklar sind. Bildungseinrichtungen stehen damit {4} der Herausforderung, Ausbildungsinhalte kontinuierlich anzupassen, {5} den Anschluss an die technologische Entwicklung nicht zu verlieren.",
blanks:[
{w:"im",de:"„im Arbeitsalltag“ = in + dem, feste Wendung.",vi:"Cụm cố định „im Arbeitsalltag“ (trong công việc hàng ngày)."},
{w:"nach",de:"„Fragen nach + Dativ“ – feste Präposition.",vi:"„Fragen nach etwas“ (câu hỏi về) — giới từ cố định."},

]},

{an:"Stellungnahme", betreff:"Zur geplanten Gesetzesänderung im Einwanderungsrecht",
body:"Der vorliegende Gesetzentwurf sieht vor, {1} Fachkräften aus Drittstaaten künftig ein erleichterter Zugang {2} deutschen Arbeitsmarkt ermöglicht wird. Verbände begrüßen diesen Schritt grundsätzlich, weisen jedoch darauf hin, {3} die praktische Umsetzung maßgeblich von einer beschleunigten Bearbeitung {4} den Ausländerbehörden abhängen wird. Ohne ausreichende personelle Ressourcen dürften die neuen Regelungen ihre beabsichtigte Wirkung {5} verfehlen.",
blanks:[
{w:"dass",de:"Konjunktion, leitet den Inhalt des Gesetzentwurfs als Nebensatz ein.",vi:"Liên từ „dass“, mở đầu nội dung của dự luật."},
{w:"zum",de:"„Zugang zum Arbeitsmarkt“ = zu + dem, feste Wendung.",vi:"Cụm cố định „Zugang zum Arbeitsmarkt“ (khả năng tiếp cận thị trường lao động)."},
{w:"dass",de:"Konjunktion, leitet den zweiten Nebensatz nach „darauf hinweisen“ ein.",vi:"Liên từ „dass“, mở đầu mệnh đề phụ thứ hai sau „darauf hinweisen“."},
{w:"bei",de:"„bei den Ausländerbehörden“ – feste Präposition „bei“ (Institution).",vi:"„bei den Behörden“ (tại cơ quan) — giới từ chỉ nơi chốn/cơ quan."},
{w:"nicht",de:"Verneinung: die Wirkung nicht verfehlen = das Ziel doch noch erreichen (hier: negiert im Kontext „dürften…verfehlen“ = wahrscheinlich verfehlen).",vi:"Phủ định trong ngữ cảnh dự đoán khả năng thất bại của quy định."}

,

{an:"—", betreff:"Erkenntnisse aus der Schlafforschung",
body:"Lange Zeit galt Schlafmangel in vielen Berufsfeldern als Ausdruck von Leistungsbereitschaft. Neuere Untersuchungen zeichnen jedoch ein anderes Bild: Wer regelmäßig zu wenig schläft, {1} nicht nur an Konzentrationsfähigkeit ein, sondern erhöht auch nachweislich {2} Risiko für zahlreiche Erkrankungen. Ein Forschungsteam der Universität Zürich {3} zeigen, dass bereits eine einzige durchwachte Nacht messbare Veränderungen im Immunsystem {4} Folge hat. Ungeachtet {5} Erkenntnisse gilt Schlaf in der Arbeitswelt vielerorts nach wie vor als verzichtbare Größe.",

{w:"das",de:"bestimmter Artikel, Akk. Neutrum — das Risiko erhöhen."},

{w:"dieser",de:"Demonstrativpronomen, Gen. Plural — ungeachtet dieser Erkenntnisse."}
]},

{an:"—", betreff:"Der Wandel der Arbeitswelt (C1)",
body:"Dass sich die Arbeitswelt in einem beispiellosen Tempo wandelt, {1} mittlerweile unbestritten sein. Wovon dieser Wandel jedoch konkret abhängt, {2} gehen die Meinungen innerhalb der Forschung deutlich auseinander. Während die einen den technologischen Fortschritt als treibende Kraft {3}, betonen andere die Bedeutung gesellschaftlicher Wertevorstellungen. Mithin {4} sich der Wandel kaum auf eine einzige Ursache zurückführen. Fest steht lediglich, dass Unternehmen, die sich diesem Prozess {5}, langfristig an Wettbewerbsfähigkeit einbüßen werden.",
blanks:[
{w:"dürfte",de:"Konjunktiv II (Vermutung) — dürfte … sein — vorsichtige Vermutung."},
{w:"darüber",de:"Pronominaladverb — korrespondiert mit wovon → darüber."},

]},

{an:"—", betreff:"Beschwerdebrief an eine Fluggesellschaft (C1)",
body:"Sehr geehrte Damen und Herren, mit diesem Schreiben {1} ich mich mit Nachdruck über den Verlauf meines Fluges vom 14. Juni beschweren. Nicht nur wurde der Abflug ohne jegliche Erklärung um mehrere Stunden verschoben, {2} auch die Kommunikation seitens Ihres Personals ließ erheblich zu wünschen übrig. Es {3} dahingestellt, ob eine derartige Vorgehensweise den eigenen Qualitätsansprüchen genügt, die Sie öffentlich stets betonen. Ich {4} mich daher gezwungen, eine angemessene Entschädigung einzufordern, sollte sich das Unternehmen nicht binnen zwei Wochen {5} einer Stellungnahme bereitfinden.",
blanks:[
{w:"möchte",de:"Modalverb (Höflichkeitsform) — möchte mich beschweren."},
{w:"sondern",de:"Konjunktion (nicht nur…sondern auch) — nicht nur X, sondern auch Y."},

/* ============================================================
   ENGINE
   ============================================================ */
let currentLevel = 1;
let usedIdx = {1:[],2:[],3:[],4:[],5:[]};

function norm(s){
  return s.trim().toLowerCase()
    .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildLevelSelect(){
  const wrap = document.getElementById('levelSelect');
  wrap.innerHTML = '';
  for(let lv=1; lv<=5; lv++){
    const meta = LEVELS_META[lv];
    const b = document.createElement('button');
    b.className = 'level-btn' + (lv===currentLevel ? ' active':'');
    b.innerHTML = meta.label+'<span class="sub">'+meta.sub+'</span><span class="dots">'+meta.dots+'</span>';
    b.onclick = ()=>{ currentLevel = lv; buildLevelSelect(); startUebung(); };
    wrap.appendChild(b);
  }
}
buildLevelSelect();

function pickTexts(level, count){
  const pool = TEXTS[level];
  let avail = pool.map((t,i)=>i).filter(i=>!usedIdx[level].includes(i));
  if(avail.length < count){ usedIdx[level] = []; avail = pool.map((t,i)=>i); }
  const chosen = shuffle(avail).slice(0, Math.min(count, avail.length));
  usedIdx[level].push(...chosen);
  return chosen.map(i=>pool[i]);
}

let globalStats = {correctGaps:0, totalGaps:0};

function updateScore(){
  document.getElementById('uebungScore').textContent = globalStats.correctGaps+' / '+globalStats.totalGaps;
}

const TYPE_META = {
  email:{icon:"✉️", label:"E-Mail / Brief"},
  dialog:{icon:"💬", label:"Dialog"},
  tagebuch:{icon:"📔", label:"Tagebucheintrag"},
  anzeige:{icon:"📢", label:"Anzeige"},
  artikel:{icon:"📰", label:"Zeitungsartikel"},
  forum:{icon:"💻", label:"Forumsbeitrag"},
  interview:{icon:"🎙️", label:"Interview"},
  blog:{icon:"✍️", label:"Blogbeitrag"}
};

function renderText(container, textObj, textIdx){
  const card = document.createElement('div');
  card.className = 'text-card';
  const typ = TYPE_META[textObj.type] || TYPE_META.email;
  card.innerHTML = '<div class="text-meta">Text '+(textIdx+1)+' · '+LEVELS_META[currentLevel].label+' ('+LEVELS_META[currentLevel].sub+') · '+typ.icon+' '+typ.label+'</div>'
    + (!textObj.type || textObj.type === 'email' ? (textObj.an && textObj.an !== '—' ? '<div class="text-header"><b>An:</b> '+textObj.an+'</div>' : '') + '<div class="text-header"><b>Betreff:</b> '+textObj.betreff+'</div>' : '<div class="text-header"><b>'+textObj.betreff+'</b></div>');

  const bodyDiv = document.createElement('div');
  bodyDiv.className = 'text-body';
  const paragraphs = textObj.body.split('\n\n');
  const inputs = [];
  paragraphs.forEach(para=>{
    const p = document.createElement('p');
    const lines = para.split('\n');
    lines.forEach((line, li)=>{
      const segments = line.split(/(\{\d\})/g);
      segments.forEach(seg=>{
        const m = seg.match(/^\{(\d)\}$/);
        if(m){
          const gapNum = parseInt(m[1],10);
          const wrap = document.createElement('span');
          wrap.className = 'gap-wrap';
          const badge = document.createElement('span');
          badge.className = 'gap-badge';
          badge.textContent = gapNum;
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'gap-input';
          input.setAttribute('autocomplete','off');
          input.setAttribute('autocapitalize','off');
          input.setAttribute('spellcheck','false');
          input.dataset.gap = gapNum;
          wrap.appendChild(badge);
          wrap.appendChild(input);
          p.appendChild(wrap);
          inputs.push({num:gapNum, el:input});
        } else if(seg.length){
          p.appendChild(document.createTextNode(seg));
        }
      });
      if(li < lines.length-1) p.appendChild(document.createElement('br'));
    });
    bodyDiv.appendChild(p);
  });
  card.appendChild(bodyDiv);

  const checkBtn = document.createElement('button');
  checkBtn.className = 'check-btn';
  checkBtn.textContent = '✓ Auswerten';

  const hintBtn = document.createElement('button');
  hintBtn.className = 'hint-btn';
  hintBtn.textContent = '💡 Hinweis';

  const solutionBtn = document.createElement('button');
  solutionBtn.className = 'solution-btn';
  solutionBtn.textContent = '👁 Lösung zeigen';

  const speakBtn = document.createElement('button');
  speakBtn.className = 'solution-btn';
  speakBtn.textContent = '🔊 Vorlesen';
  speakBtn.onclick = ()=>{
    if(!('speechSynthesis' in window)){ return; }
    let spoken = textObj.body.replace(/\n+/g,' ');
    textObj.blanks.forEach((b,i)=>{ spoken = spoken.replace('{'+(i+1)+'}', b.w); });
    const utter = new SpeechSynthesisUtterance(spoken);
    utter.lang = 'de-DE';
    utter.rate = 0.92;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  };

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  btnRow.appendChild(checkBtn);
  btnRow.appendChild(hintBtn);
  btnRow.appendChild(solutionBtn);
  btnRow.appendChild(speakBtn);
  card.appendChild(btnRow);

  const scoreLine = document.createElement('div');
  scoreLine.className = 'text-score';
  card.appendChild(scoreLine);

  const explainList = document.createElement('div');
  explainList.className = 'explain-list';
  textObj.blanks.forEach((b,i)=>{
    const item = document.createElement('div');
    item.className = 'explain-item';
    item.dataset.gap = i+1;
    item.innerHTML = '<span class="num">'+(i+1)+'</span><span class="w">'+b.w+'</span> — '+b.de;
    explainList.appendChild(item);
  });
  card.appendChild(explainList);

  let hintsOn = false;
  hintBtn.onclick = ()=>{
    hintsOn = !hintsOn;
    hintBtn.textContent = hintsOn ? '💡 Hinweis ausblenden' : '💡 Hinweis';
    inputs.forEach(inp=>{
      if(inp.el.disabled) return;
      const solution = textObj.blanks[inp.num-1].w;
      if(hintsOn){
        const pattern = solution[0] + '_'.repeat(Math.max(solution.length-1,0));
        inp.el.placeholder = pattern + ' (' + solution.length + ')';
      } else {
        inp.el.placeholder = '';
      }
    });
  };

  checkBtn.onclick = ()=>{
    let correct = 0;
    inputs.forEach(inp=>{
      const idx = inp.num - 1;
      const b = textObj.blanks[idx];
      const accepted = [b.w].concat(b.alt || []);
      const val = norm(inp.el.value);
      const isCorrect = accepted.some(a=>norm(a)===val);
      inp.el.classList.remove('correct','wrong','solution');
      inp.el.classList.add(isCorrect ? 'correct' : 'wrong');
      inp.el.disabled = true;
      if(isCorrect) correct++;
      const item = explainList.querySelector('.explain-item[data-gap="'+inp.num+'"]');
      if(!isCorrect) item.classList.add('wrong-item');
    });
    scoreLine.textContent = 'Ergebnis: '+correct+' / '+textObj.blanks.length+' richtig';
    explainList.classList.add('show');
    checkBtn.disabled = true;
    hintBtn.disabled = true;
    solutionBtn.disabled = true;
    globalStats.correctGaps += correct;
    globalStats.totalGaps += textObj.blanks.length;
    updateScore();
  };

  solutionBtn.onclick = ()=>{
    inputs.forEach(inp=>{
      const solution = textObj.blanks[inp.num-1].w;
      inp.el.value = solution;
      inp.el.classList.remove('correct','wrong');
      inp.el.classList.add('solution');
      inp.el.disabled = true;
      const item = explainList.querySelector('.explain-item[data-gap="'+inp.num+'"]');
      item.classList.add('solution-item');
    });
    scoreLine.textContent = 'Lösung angezeigt (zählt nicht zur Punktzahl)';
    explainList.classList.add('show');
    checkBtn.disabled = true;
    hintBtn.disabled = true;
    solutionBtn.disabled = true;
  };

  container.appendChild(card);
}

function startUebung(){
  const container = document.getElementById('uebungContainer');
  container.innerHTML = '';
  globalStats = {correctGaps:0, totalGaps:0};
  updateScore();
  const texts = pickTexts(currentLevel, 3);
  texts.forEach((t,i)=> renderText(container, t, i));
}

startUebung();
</script>
