<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Training Wortschatz B2 · Kapitel J</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16233f; --ink2:#233457; --gold:#b8863b; --gold-l:#f7ecd9;
  --bg:#f4f5fa; --card:#ffffff; --line:#e4e7f0;
  --ok:#15803d; --ok-bg:#eefbf1; --ok-bd:#a7e3bb;
  --er:#b91c1c; --er-bg:#fef2f2; --er-bd:#f3b4b4;
  --tx:#1c2536; --tx2:#5b6478; --mu:#98a0b3;
}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:60px}

.hdr{background:linear-gradient(180deg,#fdf9f1 0%,var(--bg) 100%);padding:26px 20px 38px;color:var(--ink);position:relative;overflow:hidden;text-align:center;border-bottom:1px solid var(--line)}
.hdr::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 18% 25%,rgba(184,134,59,.08),transparent 45%),radial-gradient(circle at 88% 70%,rgba(184,134,59,.07),transparent 40%);pointer-events:none}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.hdr h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(24px,6.5vw,32px);letter-spacing:-.3px;margin-bottom:0;line-height:1.3}
.hdr h1 .ltr-big{display:inline-flex;align-items:center;justify-content:center;padding:0 16px;height:38px;background:var(--gold);color:#fff;border-radius:99px;font-size:18px;vertical-align:middle;margin-right:6px}
.hdr-badge{position:absolute;top:20px;right:20px;background:var(--gold-l);border:1px solid #ecd9b3;color:#8a6420;font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 12px;border-radius:99px}

.subnav{max-width:760px;margin:16px auto 14px;padding:0 16px;position:relative;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tab-sq{flex:none;width:46px;height:46px;background:var(--card);border:1.5px solid var(--line);color:var(--tx2);font-weight:800;font-size:11.5px;border-radius:11px;cursor:pointer;box-shadow:0 2px 6px rgba(22,35,63,.05);display:flex;align-items:center;justify-content:center;transition:.15s}
.tab-sq.on{background:var(--gold);border-color:var(--gold);color:#fff}

.wrap{max-width:680px;margin:0 auto;padding:14px 16px 0}
.lesson-group{display:none}
.lesson-group.on{display:block}
.lesson-group .card:not(:last-of-type){margin-bottom:28px;border-bottom:3px dashed var(--line);padding-bottom:30px}

.card{background:var(--card);border-radius:20px;padding:26px 24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(22,35,63,.05),0 10px 28px rgba(22,35,63,.05);border:1px solid var(--line)}
.card-eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.card h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px}
.instr{font-size:13px;color:var(--tx2);font-style:italic;margin-bottom:16px}

.opt-bubbles{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:0}
.bubble{border:1.5px solid var(--line);cursor:pointer;text-align:left;font-family:'Outfit',sans-serif;font-size:11.5px;line-height:1.55;padding:11px 15px;border-radius:16px;max-width:56%;color:var(--tx2);background:#fff;transition:.15s}
.bubble b{display:block;font-size:11px;font-weight:800;margin-bottom:3px;color:var(--tx2)}
.bubble-left{border-bottom-left-radius:3px}
.bubble-right{border-bottom-right-radius:3px;margin-left:auto}
.bubble.on{background:var(--gold-l);border-color:var(--gold);color:#8a6420}
.bubble.on b{color:#8a6420}
.wortliste{display:flex;flex-wrap:wrap;gap:7px;margin-top:0;border:1.5px solid var(--gold);border-top:none;border-radius:0 12px 12px 12px;padding:14px 16px;background:#faf8f3}
.saved-badge{display:block;font-size:11px;color:var(--mu);font-style:italic;margin:8px 0 16px}

.chip{font-size:12.5px;font-weight:600;color:var(--ink2);padding:4px 10px;background:#fff;border-radius:99px;border:1px solid var(--line)}
.chip.used{text-decoration:line-through;color:var(--mu);background:transparent;border-color:transparent}

.passage{font-size:15px;line-height:2.15;color:var(--tx)}
.passage h3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:'Playfair Display',serif;font-size:16px;color:var(--ink2);margin:20px 0 8px;font-weight:600}
.passage h3:first-child{margin-top:0}
.gap-num{font-size:9px;vertical-align:super;color:var(--gold);font-weight:800;margin-right:1px}
.blank{width:112px;border:none;border-bottom:2px solid var(--gold);background:var(--gold-l);border-radius:4px 4px 0 0;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--ink);text-align:center;padding:2px 4px;margin:0 2px}
.blank:focus{outline:none;border-bottom-color:var(--ink);background:#fff}
.blank.given{background:transparent;border-bottom-color:var(--ok);color:var(--ok);font-weight:700;width:auto;text-decoration:none}
.blank.ok{background:var(--ok-bg);border-bottom-color:var(--ok);color:var(--ok)}
.blank.no{background:var(--er-bg);border-bottom-color:var(--er);color:var(--er)}
.head-listen{display:none;align-items:center;gap:6px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;color:var(--gold);background:#faf8f3;border:1px solid var(--gold);padding:5px 12px;border-radius:99px;cursor:pointer;transition:.12s}
.head-listen.show{display:inline-flex}
.head-listen:hover{background:var(--gold);color:#fff}

.actions{display:flex;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.btn{background:var(--gold);color:#fff;font-weight:700;font-size:13.5px;padding:12px 24px;border-radius:99px;border:none;cursor:pointer;letter-spacing:.02em;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.score{font-size:13px;font-weight:700;color:var(--tx2)}
.score b{color:var(--ok)}

.ans-table{margin-top:18px;border-radius:14px;overflow:hidden;border:1px solid var(--line);display:none}
.ans-table.show{display:block}
.ans-table table{width:100%;border-collapse:collapse;font-size:12.5px}
.ans-table th{background:var(--gold);color:#fff;font-weight:700;text-align:left;padding:9px 12px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.ans-table td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.5}
.ans-table tr:nth-child(even){background:#faf9fc}
.ans-table .lk{font-weight:800;color:var(--gold);width:30px}
.ans-table .dap{font-weight:700;color:var(--ink);white-space:nowrap}

.hint{display:block;font-size:11.5px;line-height:1.5;color:var(--er);margin:2px 0 10px 2px;max-width:340px}
.hint b{color:var(--er)}
.hint i{color:#c53030;font-style:italic}

.wpn-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.wpn-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.wpn-q{font-size:14.5px;font-weight:600;color:var(--ink2);margin-bottom:9px}
.wpn-opts{display:flex;flex-wrap:wrap;gap:8px}
.wopt{font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;color:var(--tx2);cursor:pointer;transition:.15s}
.wopt.sel{border-color:var(--gold);background:var(--gold);color:#fff;text-decoration:line-through}
.wopt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);text-decoration:line-through}
.wopt.wrong-sel{border-color:var(--er);background:var(--er-bg);color:var(--er);text-decoration:line-through}
.wpn-note{font-size:11.5px;color:var(--tx2);font-style:italic;margin-top:6px;display:none}
.wpn-note.show{display:block}

/* ZUORDNUNG (matching, 2 Spalten, klicken zum Verbinden) */
.zu2-solved{margin-bottom:4px}
.zu2-solved:empty{margin-bottom:0}
.zu2-solved-row{background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:10px;padding:9px 12px;margin-bottom:8px;font-size:12.5px;color:var(--ok);line-height:1.4;animation:zuPop .25s ease}
.zu2-solved-row.wrong{background:var(--er-bg);border-color:var(--er-bd);color:var(--er)}
.zu2-solved-top{display:flex;align-items:center;gap:8px}
.zu2-solved-top span:first-child{flex:1}
.zu2-exp{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(0,0,0,.08);font-size:11.5px;color:var(--tx2);font-style:italic}
.zu2-solved-row.wrong .zu2-exp{color:var(--er)}
.zu2-x{flex:none;cursor:pointer;color:var(--mu);font-weight:800;padding:2px 4px}
@keyframes zuPop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.zu2-cols{display:flex;gap:10px}
.zu2-col{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.zu2-col-lbl{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;padding-left:2px}
.zu2-col-lbl.left{color:#3b5bdb}
.zu2-col-lbl.right{color:var(--gold)}
.zu2-item{display:flex;align-items:center;gap:9px;background:#fff;border:1.5px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 11px;font-size:12.5px;line-height:1.4;cursor:pointer;transition:.12s;color:var(--tx)}
.zu2-item.left{border-left-color:#3b5bdb}
.zu2-item.right{border-left-color:var(--gold)}
.zu2-badge{flex:none;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff}
.zu2-item.left .zu2-badge{background:#3b5bdb}
.zu2-item.right .zu2-badge{background:var(--gold)}
.zu2-item:hover{border-color:var(--gold)}
.zu2-item.active{background:var(--gold-l);box-shadow:0 0 0 3px rgba(184,134,59,.18)}
@media (max-width:420px){.zu2-cols{gap:7px}.zu2-item{font-size:11.5px;padding:8px 9px}}

/* FREITEXT + Musterlösung */
.ft-item{margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.ft-item:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.ft-prompt{font-size:13.5px;color:var(--tx);margin-bottom:8px;line-height:1.5}
.ft-input{width:100%;font-family:'Outfit',sans-serif;font-size:13.5px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;margin-bottom:8px}
.ft-input:focus{outline:none;border-color:var(--gold)}
.btn.small{padding:8px 16px;font-size:11.5px}
.ft-sample{display:none;margin-top:8px;font-size:12.5px;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:10px;padding:9px 12px;line-height:1.5}
.ft-sample.show{display:block}

/* EMAIL CARD */
.email-window{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(22,35,63,.06)}
.email-dots{display:flex;gap:6px;padding:12px 14px;background:#f4f5fa;border-bottom:1px solid var(--line)}
.email-dots span{width:10px;height:10px;border-radius:50%}
.email-dots .red{background:#f45f5f}.email-dots .yellow{background:#f5c451}.email-dots .green{background:#5fca6b}
.email-meta{padding:12px 16px;background:#faf9fc;border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2);line-height:1.8}
.email-meta b{color:var(--tx);font-weight:700;margin-right:4px}
.email-body{padding:20px 18px}
.email-body p:first-child{margin-top:0}

.geg-item-wrap{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.geg-item-wrap:last-child{border:none;margin-bottom:0;padding-bottom:0}
.geg-item{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:14.5px}
.geg-item.given{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:14.5px}
.geg-orig{color:var(--tx2)}
.geg-arrow{color:var(--gold);font-weight:800}
.geg-scr{font-size:11px;color:var(--mu);font-style:italic;background:#f4f5fa;padding:2px 8px;border-radius:99px}
.geg-input{width:150px;border:none;border-bottom:2px solid var(--gold);background:var(--gold-l);border-radius:4px 4px 0 0;font-family:'Outfit',sans-serif;font-size:14px;font-weight:600;color:var(--ink);text-align:center;padding:4px}
.geg-input.ok{background:var(--ok-bg);border-bottom-color:var(--ok);color:var(--ok)}
.geg-input.no{background:var(--er-bg);border-bottom-color:var(--er);color:var(--er)}
.geg-exp{font-size:11.5px;color:var(--tx2);font-style:italic;display:none;margin-top:6px}
.geg-exp.show{display:block}
.geg-exp.wrong{color:var(--er)}
.geg-exp.wrong b{color:var(--er)}

/* MEHRFACHAUSWAHL */
.ms-opts{display:flex;flex-direction:column;gap:8px}
.ms-opt{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tx);background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.ms-opt input{width:16px;height:16px;accent-color:var(--gold)}
.ms-opt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.ms-opt.wrong-sel{border-color:var(--er);background:var(--er-bg);color:var(--er)}

.vocab{background:var(--gold-l);border:1px solid #ecd9b3;border-radius:16px;padding:18px 20px;margin-top:6px}
.vocab summary{font-weight:800;font-size:13px;color:#8a6420;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.vocab summary::-webkit-details-marker{display:none}
.vocab summary::before{content:'▸';transition:.2s}
.vocab[open] summary::before{transform:rotate(90deg)}
.vgrid{margin-top:14px;display:grid;grid-template-columns:1fr;gap:9px}
.vrow{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:1.5;padding-bottom:9px;border-bottom:1px solid #ecd9b3}
.vrow:last-child{border-bottom:none;padding-bottom:0}
.vde{font-weight:700;color:var(--ink)}
.vdd{color:#7a5a1e;font-size:12.5px}
.vvi{color:#a3762a;font-size:12.5px;font-style:italic;display:none}
.vocab-toolbar{margin-top:12px}
.btn-vi{background:#fff;border:1.5px solid #ecd9b3;color:#8a6420;font-weight:700;font-size:12px;padding:8px 16px;border-radius:99px;cursor:pointer}
.btn-vi.on{background:#8a6420;border-color:#8a6420;color:#fff}
.vocab-group{border-radius:12px;padding:10px 12px;margin-bottom:2px}
.vocab-group.odd{background:rgba(255,255,255,.55)}
.vocab-group .vgroup-lbl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8a6420;margin:0 0 6px}
.vocab-group .vrow:last-child{border-bottom:none;padding-bottom:0}

.copyright{text-align:center;padding:28px 0 8px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(22,35,63,.2)}

/* MAIN TABS */
.maintabs{max-width:680px;width:calc(100% - 32px);margin:-20px auto 0;padding:5px;position:relative;z-index:6;display:flex;gap:4px;background:var(--gold);border-radius:999px;box-shadow:0 4px 16px rgba(184,134,59,.3)}
.maintab{flex:1;background:transparent;border:none;color:rgba(255,255,255,.8);font-weight:800;font-size:12.5px;padding:12px 8px;border-radius:999px;cursor:pointer;transition:.15s}
.maintab.on{background:#fff;color:var(--gold);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.mainpanel{display:none}
.mainpanel.on{display:block}

/* SUB TOGGLE (Liste/Training, Flash/Quiz) */
.sub-toggle{display:flex;gap:6px;background:#f1f2f6;padding:4px;border-radius:99px;width:fit-content;margin:0 auto 16px}
.stbtn{border:none;background:transparent;font-size:12px;font-weight:700;color:var(--tx2);padding:8px 16px;border-radius:99px;cursor:pointer}
.stbtn.on{background:#fff;color:var(--gold);box-shadow:0 1px 4px rgba(22,35,63,.1)}

/* FLASHCARD */
.flash-counter{text-align:center;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:14px}
.flashcard{min-height:180px;border-radius:16px;background:var(--gold-l);border:1.5px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;cursor:pointer;gap:10px}
.flashcard .fc-word{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--ink)}
.flashcard .fc-def{font-size:14px;color:#7a5a1e;line-height:1.6}
.flashcard .fc-vi{font-size:13px;color:#a3762a;font-style:italic}
.flashcard .fc-hint{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
.flash-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* QUIZ */
.quiz-progress{font-size:12px;font-weight:700;color:var(--mu);text-align:center;margin-bottom:10px}
.quiz-prompt{font-family:'Playfair Display',serif;font-size:19px;font-weight:700;color:var(--ink);text-align:center;margin-bottom:20px;line-height:1.4}
.quiz-opts{display:grid;grid-template-columns:1fr;gap:10px}
.qopt{text-align:left;font-size:13.5px;font-weight:600;color:var(--tx);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 16px;cursor:pointer;transition:.12s;line-height:1.5}
.qopt:hover{border-color:var(--gold)}
.qopt.correct{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.qopt.wrong{border-color:var(--er);background:var(--er-bg);color:var(--er)}
.quiz-done{text-align:center;padding:20px 0}
.quiz-score{font-family:'Playfair Display',serif;font-size:36px;font-weight:700;color:var(--gold);margin-bottom:16px}

/* Per-lesson mini vocab */
.mini-vocab{margin-top:16px}
.mini-vocab summary{font-weight:700;font-size:12px;color:#8a6420}

/* Rätsel (vertikales Treppen-Kreuzworträtsel) */
.raetsel-cols{display:flex;align-items:flex-end;gap:3px;overflow-x:auto;padding:6px 2px 10px}
.raetsel-col{display:flex;flex-direction:column;align-items:center;flex-shrink:0}
.raetsel-num{font-size:12px;font-weight:700;color:var(--gold);height:18px;display:flex;align-items:center;justify-content:center}
input.letter-box-v{
  width:30px;height:30px;flex-shrink:0;margin-top:-1.5px;
  text-align:center;font-size:.95rem;font-weight:700;line-height:1;
  border:1.5px solid #333;border-radius:0;padding:0;
  text-transform:uppercase;font-family:inherit;background:#fff;color:var(--tx);
  box-sizing:border-box;
}
input.letter-box-v:focus{outline:none;background:var(--gold-l);position:relative;z-index:2;border-color:var(--gold)}
input.letter-box-v.correct{background:var(--ok-bg);color:var(--ok);border-color:#333}
input.letter-box-v.wrong{background:var(--er-bg);color:var(--er);border-color:#333}
input.letter-box-v.marked{border:2.5px solid var(--gold);background:var(--gold-l);color:#8a6420;position:relative;z-index:1}
.letterrow-v{display:flex}
.letterrow-v input.letter-box-v.loesung{border-color:var(--gold);background:var(--gold-l);color:#8a6420;margin-top:0;margin-left:-1.5px}
.letterrow-v input:first-child{margin-left:0}

/* Rätsel horizontal (Treppen-Kreuzworträtsel, Original-Vorlage) */
.raetselh-body{overflow-x:auto;padding:4px 2px 10px}
.raetselh-row{display:flex;align-items:center;margin:6px 0}
.raetselh-num{width:20px;flex-shrink:0;font-size:12px;font-weight:700;color:var(--gold);text-align:center}
.raetselh-letters{display:flex;flex-wrap:nowrap}
.letter-spacer-h{width:30px;height:30px;flex-shrink:0}
input.letter-box-h{
  width:30px;height:30px;flex-shrink:0;margin-left:-1.5px;
  text-align:center;font-size:.95rem;font-weight:700;line-height:1;
  border:1.5px solid #333;border-radius:0;padding:0;
  text-transform:uppercase;font-family:inherit;background:#fff;color:var(--tx);
  box-sizing:border-box;
}
.raetselh-letters input.letter-box-h:first-child{margin-left:0}
input.letter-box-h:focus{outline:none;background:var(--gold-l);position:relative;z-index:2;border-color:var(--gold)}
input.letter-box-h.correct{background:var(--ok-bg);color:var(--ok);border-color:#333}
input.letter-box-h.wrong{background:var(--er-bg);color:var(--er);border-color:#333}

<script>
/* Fallback: nếu dl-core.js chưa load được (VD: test file lẻ, thiếu file cùng thư mục),
   _dlLog vẫn tồn tại dưới dạng no-op để không bao giờ làm crash trang. */
if (typeof window._dlLog !== 'function') { window._dlLog = function(){}; }
if (typeof window._dlUser !== 'function') { window._dlUser = function(){ return null; }; }

/* ============================================================
   GENERIC ENGINE
   ============================================================ */
function speak(text){
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance();
  msg.text = text; msg.lang = 'de-DE'; msg.rate = 0.92;
  window.speechSynthesis.speak(msg);
}

/* ---- template parser: [[N]] blank, [[N=text]] given, "## " heading ---- */
function parseTemplate(tpl){
  const lines = tpl.replace(/\r/g,'').split('\n');
  const blocks = []; let buf = [];
  function flush(){ const text = buf.join(' ').trim(); if(text) blocks.push({t:'p', raw:text}); buf = []; }
  lines.forEach(line=>{
    const t = line.trim();
    if(t.startsWith('## ')){ flush(); blocks.push({t:'h3', v:t.slice(3).trim()}); }
    else if(t===''){ flush(); }
    else{ buf.push(t); }
  });
  flush();
  return blocks;
}
function segmentsFromRaw(raw, answers){
  const parts = []; const re = /\[\[([^\]]+)\]\]/g; let last = 0, m;
  while((m = re.exec(raw))){
    if(m.index>last) parts.push(raw.slice(last, m.index));
    const inner = m[1];
    if(inner.includes('|')){
      const bits = inner.split('|');
      parts.push({g:+bits[0], choices:bits.slice(1)});
    } else if(inner.includes('=')){
      const eq = inner.indexOf('=');
      parts.push({g:+inner.slice(0,eq), given: inner.slice(eq+1)});
    } else {
      const num = +inner;
      parts.push({g:num, ans: answers[num]});
    }
    last = re.lastIndex;
  }
  if(last<raw.length) parts.push(raw.slice(last));
  return parts;
}
function plainTextOfBlock(block, answers){
  if(block.t!=='p') return '';
  return segmentsFromRaw(block.raw, answers).map(s=>{
    if(typeof s==='string') return s;
    if(s.choices) return answers[s.g] || s.choices[0];
    return s.given!==undefined ? s.given : s.ans;
  }).join('');
}

/* ---- LÜCKENTEXT lesson ---- */
function renderLueckentext(lesson){
  const blocks = parseTemplate(lesson.tpl);
  lesson._blocks = blocks;

  if(!lesson.noBank){
    document.getElementById('wl-'+lesson.id).innerHTML = lesson.bank.map((w,i)=>
      `<span class="chip${lesson.usedIdx.includes(i)?' used':''}">${w}</span>`
    ).join('');
  }

  /* Text pro Abschnitt sammeln: von jeder h3 bis zur nächsten h3 */
  const sectionText = [];
  let cur = -1;
  blocks.forEach(block=>{
    if(block.t==='h3'){ cur = sectionText.length; sectionText.push(''); }
    else if(cur>=0){ sectionText[cur] += (sectionText[cur]?' ':'') + plainTextOfBlock(block, lesson.answers); }
  });

  let html = ''; let hIdx = -1;
  blocks.forEach(block=>{
    if(block.t==='h3'){
      hIdx++;
      const txt = (sectionText[hIdx]||'').replace(/`/g,"'");
      html += `<h3>${block.v}<button class="head-listen" onclick="speak(\`${txt}\`)">🔊 Klick zum Hören</button></h3>`;
      return;
    }
    html += `<p>`;
    segmentsFromRaw(block.raw, lesson.answers).forEach(seg=>{
      if(typeof seg==='string'){ html += seg; }
      else if(seg.given!==undefined){
        html += `<span class="gap-num">${seg.g}</span><span class="blank given">${seg.given}</span>`;
      } else {
        html += `<span class="gap-num">${seg.g}</span><input class="blank" id="b-${lesson.id}-${seg.g}" data-ans="${seg.ans}" size="${Math.max(seg.ans.length-2,4)}">`;
      }
    });
    html += '</p>';
  });
  document.getElementById('pg-'+lesson.id).innerHTML = lesson.emailMeta ? emailWrap(lesson, html, blocks) : html;

  const rows = [];
  blocks.forEach(block=>{
    if(block.t!=='p') return;
    segmentsFromRaw(block.raw, lesson.answers).forEach(seg=>{
      if(typeof seg!=='string' && seg.given===undefined){
        const n = lesson.notes[seg.g];
        rows.push(`<tr><td class="lk">${seg.g}</td><td class="dap">${seg.ans.replace(/\|/g," / ")}</td><td>${n?noteHTML(n):''}</td></tr>`);
      }
    });
  });
  document.getElementById('tbb-'+lesson.id).innerHTML = rows.join('');
}
function noteHTML(n){ return `<b>${n.form}</b> — ${n.grund}<br><i>„${n.beispiel}“</i>`; }
function emailWrap(lesson, bodyHtml, blocks){
  const m = lesson.emailMeta;
  const fullTxt = blocks.filter(b=>b.t==='p').map(b=>plainTextOfBlock(b, lesson.answers)).join(' ').replace(/`/g,"'");
  return `<div class="email-window">
    <div class="email-dots"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
    <div class="email-meta">
      <div><b>An:</b> ${m.an}</div>
      <div><b>Von:</b> ${m.von}</div>
      <div><b>Betreff:</b> ${m.betreff} <button class="head-listen show" style="margin-left:8px" onclick="speak(\`${fullTxt}\`)">🔊 Klick zum Hören</button></div>
    </div>
    <div class="email-body">${bodyHtml}</div>
  </div>`;
}

function setMode(id, m){
  document.getElementById('modeShow-'+id).classList.toggle('on', m==='show');
  document.getElementById('modeHide-'+id).classList.toggle('on', m==='hide');
  document.getElementById('wl-'+id).style.display = (m==='hide') ? 'none' : 'flex';
  document.querySelectorAll(`#lesson-${id} .head-listen`).forEach(b=>b.classList.toggle('show', m==='hide'));
}
function checkLueckentext(lesson){
  const id = lesson.id;
  let total=0, ok=0;
  document.querySelectorAll(`#lesson-${id} .hint`).forEach(h=>h.remove());
  document.querySelectorAll(`#lesson-${id} .blank:not(.given)`).forEach(inp=>{
    total++;
    const val = inp.value.trim().toLowerCase();
    const ans = inp.dataset.ans.toLowerCase();
    inp.classList.remove('ok','no');
    if(ans.split('|').includes(val)){ inp.classList.add('ok'); ok++; }
    else{
      inp.classList.add('no');
      const num = inp.id.split('-')[2];
      const note = lesson.notes[num];
      if(note){
        const hint = document.createElement('span');
        hint.className='hint'; hint.innerHTML='→ '+noteHTML(note);
        inp.insertAdjacentElement('afterend', hint);
      }
    }
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${total} richtig`;
  saveProgress(id, ok, total);
  _dlLog(lesson.title, ok, total);
}
function revealTable(id){ document.getElementById('tb-'+id).classList.toggle('show'); }

/* ---- ZUORDNUNG (matching, 2 Spalten) ---- */
const zuState = {};
function renderZuordnung(lesson){
  const id = lesson.id;
  const letters = 'abcdefghijkl';
  const leftHtml = lesson.left.map((l,i)=>`<div class="zu2-item left" id="zuL-${id}-${i}" onclick="zuPick('${id}','L',${i})"><span class="zu2-badge">${i+1}</span><span>${l}</span></div>`).join('');
  const rightHtml = lesson.right.map((r,i)=>`<div class="zu2-item right" id="zuR-${id}-${i}" onclick="zuPick('${id}','R',${i})"><span class="zu2-badge">${letters[i]}</span><span>${r}</span></div>`).join('');
  document.getElementById('pg-'+id).innerHTML = `
    <div class="zu-hint"><b>So geht's:</b> Klicken Sie zuerst auf einen Satz links, danach auf die passende Bedeutung rechts — die beiden werden verbunden und springen nach oben.</div>
    <div class="zu2-solved" id="zuSolved-${id}"></div>
    <div class="zu2-cols">
      <div class="zu2-col">
        <div class="zu2-col-lbl left">Sätze</div>
        <div id="zuLeftCol-${id}">${leftHtml}</div>
      </div>
      <div class="zu2-col">
        <div class="zu2-col-lbl right">Bedeutungen</div>
        <div id="zuRightCol-${id}">${rightHtml}</div>
      </div>
    </div>`;
  zuState[id] = {pending:null, pairs:{}};
}
function zuPick(id, side, idx){
  const st = zuState[id];
  const elId = side==='L' ? `zuL-${id}-${idx}` : `zuR-${id}-${idx}`;
  if(!st.pending){
    st.pending = {side, idx};
    document.getElementById(elId).classList.add('active');
    return;
  }
  if(st.pending.side === side){
    document.getElementById(side==='L'?`zuL-${id}-${st.pending.idx}`:`zuR-${id}-${st.pending.idx}`).classList.remove('active');
    st.pending = {side, idx};
    document.getElementById(elId).classList.add('active');
    return;
  }
  const leftIdx = side==='L' ? idx : st.pending.idx;
  const rightIdx = side==='R' ? idx : st.pending.idx;
  document.getElementById(`zuL-${id}-${leftIdx}`).classList.remove('active');
  document.getElementById(`zuR-${id}-${rightIdx}`).classList.remove('active');
  st.pairs[leftIdx] = rightIdx;
  st.pending = null;
  movePairToSolved(id, leftIdx, rightIdx);
}
function movePairToSolved(id, leftIdx, rightIdx){
  const lesson = LESSONS.find(l=>l.id===id);
  const letters = 'abcdefghijkl';
  document.getElementById(`zuL-${id}-${leftIdx}`).style.display = 'none';
  document.getElementById(`zuR-${id}-${rightIdx}`).style.display = 'none';
  const row = document.createElement('div');
  row.className = 'zu2-solved-row';
  row.id = `zuPair-${id}-${leftIdx}`;
  row.innerHTML = `<div class="zu2-solved-top"><span>${leftIdx+1}. ${lesson.left[leftIdx]} → ${letters[rightIdx]}) ${lesson.right[rightIdx]}</span><span class="zu2-x" onclick="zuUnpair('${id}',${leftIdx},${rightIdx})">✕</span></div>`;
  document.getElementById('zuSolved-'+id).prepend(row);
}
function zuUnpair(id, leftIdx, rightIdx){
  delete zuState[id].pairs[leftIdx];
  document.getElementById(`zuPair-${id}-${leftIdx}`).remove();
  document.getElementById(`zuL-${id}-${leftIdx}`).style.display = '';
  document.getElementById(`zuR-${id}-${rightIdx}`).style.display = '';
}
function checkZuordnung(lesson){
  const id = lesson.id;
  const st = zuState[id];
  const letters = 'abcdefghijkl';
  let ok=0; const total = lesson.left.length;
  lesson.left.forEach((l,li)=>{
    const row = document.getElementById(`zuPair-${id}-${li}`);
    if(!row) return;
    row.classList.remove('wrong');
    const isRight = lesson.right[st.pairs[li]] === lesson.right[lesson.correct[li]];
    if(isRight) ok++;
    else row.classList.add('wrong');
    const exp = lesson.explain && lesson.explain[li];
    if(exp){
      const correctText = `${letters[lesson.correct[li]]}) ${lesson.right[lesson.correct[li]]}`;
      const already = row.querySelector('.zu2-exp');
      if(already) already.remove();
      const expEl = document.createElement('div');
      expEl.className = 'zu2-exp';
      expEl.innerHTML = isRight
        ? `→ ${exp}`
        : `Richtig wäre <b>${correctText}</b> — ${exp}`;
      row.appendChild(expEl);
    }
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${total} richtig`;
  saveProgress(id, ok, total);
  _dlLog(lesson.title, ok, total);
}


/* ---- FREITEXT + Musterlösung ---- */
function renderFreitext(lesson){
  const el = document.getElementById('pg-'+lesson.id);
  el.innerHTML = lesson.items.map((it,i)=>`
    <div class="ft-item">
      <div class="ft-prompt"><b>${i+1}.</b> ${it.prompt}</div>
      <textarea class="ft-input" id="ft-${lesson.id}-${i}" rows="2" placeholder="Ihre Antwort…"></textarea>
      <button class="btn ghost small" onclick="toggleSample('${lesson.id}',${i})">Musterlösung anzeigen</button>
      <div class="ft-sample" id="fts-${lesson.id}-${i}">${it.sample}</div>
    </div>`).join('');
}
function toggleSample(id,i){
  document.getElementById(`fts-${id}-${i}`).classList.toggle('show');
}

/* ---- WAS PASST NICHT lesson ---- */
const wpnSel = {};
function renderWpn(lesson){
  const el = document.getElementById('pg-'+lesson.id);
  el.innerHTML = lesson.items.map((item,qi)=>`
    <div class="wpn-item">
      <div class="wpn-q">${qi+1}. ${item.q}</div>
      <div class="wpn-opts">
        ${item.opts.map((o,oi)=>`<span class="wopt" data-l="${lesson.id}" data-q="${qi}" data-o="${oi}" onclick="selectWpn('${lesson.id}',${qi},${oi})">${o}</span>`).join('')}
      </div>
      <div class="wpn-note" id="wn-${lesson.id}-${qi}">${item.note||''}</div>
    </div>`).join('');
}
function selectWpn(id, qi, oi){
  wpnSel[id+'-'+qi] = oi;
  document.querySelectorAll(`.wopt[data-l="${id}"][data-q="${qi}"]`).forEach(el=>{
    el.classList.toggle('sel', +el.dataset.o===oi);
  });
}
function checkWpn(lesson){
  const id = lesson.id; let ok=0;
  lesson.items.forEach((item,qi)=>{
    document.querySelectorAll(`.wopt[data-l="${id}"][data-q="${qi}"]`).forEach(el=>{
      const oi = +el.dataset.o;
      el.classList.remove('correct','wrong-sel');
      if(oi===item.wrong) el.classList.add('correct');
      else if(wpnSel[id+'-'+qi]===oi) el.classList.add('wrong-sel');
    });
    document.getElementById(`wn-${id}-${qi}`).classList.add('show');
    if(wpnSel[id+'-'+qi]===item.wrong) ok++;
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${lesson.items.length} richtig`;
  saveProgress(id, ok, lesson.items.length);
  _dlLog(lesson.title, ok, lesson.items.length);
}

/* ---- GEGENTEIL lesson ---- */
function renderGegenteil(lesson){
  const bankHtml = lesson.bank ? `<div class="wortliste">${lesson.bank.map(w=>`<span class="chip">${w}</span>`).join('')}</div>` : '';
  const arrow = lesson.arrowSymbol || '↔';
  const items = lesson.pairs.map((p,i)=>{
    if(p.given){
      return `<div class="geg-item given"><span class="geg-orig">${p.orig}</span><span class="geg-arrow">${arrow}</span><span class="blank given">${p.answer}</span></div>`;
    }
    const scr = p.scrambled ? `<span class="geg-scr">(${p.scrambled})</span>` : '';
    return `<div class="geg-item-wrap">
      <div class="geg-item">
        <span class="geg-orig">${p.orig}</span><span class="geg-arrow">${arrow}</span>
        ${scr}
        <input class="geg-input" id="g-${lesson.id}-${i}" data-ans="${p.answer}">
      </div>
      <div class="geg-exp" id="ge-${lesson.id}-${i}"></div>
    </div>`;
  }).join('');
  document.getElementById('pg-'+lesson.id).innerHTML = bankHtml + items;
}
function checkGegenteil(lesson){
  const id = lesson.id; let total=0, ok=0;
  lesson.pairs.forEach((p,i)=>{
    if(p.given) return;
    total++;
    const inp = document.getElementById(`g-${id}-${i}`);
    const val = inp.value.trim().toLowerCase();
    inp.classList.remove('ok','no');
    const expEl = document.getElementById(`ge-${id}-${i}`);
    const isRight = val===p.answer.toLowerCase();
    if(isRight){ inp.classList.add('ok'); ok++; }
    else{ inp.classList.add('no'); }
    if(p.note){
      expEl.innerHTML = isRight ? `→ ${p.note}` : `Richtig wäre <b>${p.answer}</b> — ${p.note}`;
      expEl.className = 'geg-exp show' + (isRight ? '' : ' wrong');
    }
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${total} richtig`;
  saveProgress(id, ok, total);
  _dlLog(lesson.title, ok, total);
}

const wahlSel = {};
function renderWahl(lesson){
  const blocks = parseTemplate(lesson.tpl);
  lesson._blocks = blocks;
  let html = '';
  blocks.forEach(block=>{
    if(block.t==='h3'){ html += `<h3>${block.v}</h3>`; return; }
    html += '<p>';
    segmentsFromRaw(block.raw, lesson.answers).forEach(seg=>{
      if(typeof seg==='string'){ html += seg; }
      else if(seg.choices){
        html += `<span class="gap-num">${seg.g}</span>` + seg.choices.map(c=>
          `<span class="wopt" data-g="${seg.g}" data-v="${c.replace(/"/g,'&quot;')}" onclick="wahlPick('${lesson.id}',this)">${c}</span>`
        ).join('<span class="wahl-sep"> / </span>') + ` <span class="geg-exp" id="we-${lesson.id}-${seg.g}"></span>`;
      } else if(seg.given!==undefined){
        html += `<span class="blank given">${seg.given}</span>`;
      }
    });
    html += '</p>';
  });
  document.getElementById('pg-'+lesson.id).innerHTML = html;
}
function wahlPick(id, el){
  const g = el.dataset.g;
  wahlSel[id+'-'+g] = el.dataset.v;
  document.querySelectorAll(`#pg-${id} .wopt[data-g="${g}"]`).forEach(o=>o.classList.toggle('sel', o===el));
}
function checkWahl(lesson){
  const id = lesson.id; let ok=0;
  const groups = new Set();
  document.querySelectorAll(`#pg-${id} .wopt`).forEach(o=>groups.add(o.dataset.g));
  groups.forEach(g=>{
    const correctVal = lesson.answers[g];
    const selVal = wahlSel[id+'-'+g];
    document.querySelectorAll(`#pg-${id} .wopt[data-g="${g}"]`).forEach(o=>{
      o.classList.remove('correct','wrong-sel');
      if(o.dataset.v===correctVal) o.classList.add('correct');
      else if(o.dataset.v===selVal) o.classList.add('wrong-sel');
    });
    if(selVal===correctVal) ok++;
    const noteEl = document.getElementById(`we-${id}-${g}`);
    if(noteEl){
      const note = lesson.notes && lesson.notes[g];
      noteEl.innerHTML = note ? (selVal===correctVal ? `→ ${noteHTML(note)}` : `Richtig: <b>${correctVal}</b> — ${noteHTML(note)}`) : '';
      noteEl.className = 'geg-exp show' + (selVal===correctVal ? '' : ' wrong');
    }
  });
  const total = groups.size;
  document.getElementById('sc-'+lesson.id).innerHTML = `<b>${ok}</b> / ${total} richtig`;
  saveProgress(lesson.id, ok, total);
  _dlLog(lesson.title, ok, total);
}

  html += `<div style="margin-top:24px;padding-top:18px;border-top:2px dashed var(--line);">`;

      if(typeof seg==='string'){ html += seg; }
      else if(seg.given!==undefined){ html += `<span class="gap-num">${seg.g}</span><span class="blank given">${seg.given}</span>`; }
      else{ html += `<span class="gap-num">${seg.g}</span><input class="blank" id="b-${lesson.id}-${seg.g}" data-ans="${seg.ans}" size="${Math.max(seg.ans.length-2,4)}">`; }

    if(block.t!=='p') return;

      if(typeof seg!=='string' && seg.given===undefined){
        const n = lesson.notes[seg.g];
        rows.push(`<tr><td class="lk">${seg.g}</td><td class="dap">${seg.ans.replace(/\|/g," / ")}</td><td>${n?noteHTML(n):''}</td></tr>`);

function checkCombo6(lesson){
  const id = lesson.id;

  let total=0, ok=0;
  document.querySelectorAll(`#lesson-${id} .hint`).forEach(h=>h.remove());
  document.querySelectorAll(`#lesson-${id} .blank:not(.given)`).forEach(inp=>{
    total++;
    const val = inp.value.trim().toLowerCase();
    const ans = inp.dataset.ans.toLowerCase();
    inp.classList.remove('ok','no');
    if(ans.split('|').includes(val)){ inp.classList.add('ok'); ok++; }
    else{
      inp.classList.add('no');
      const num = inp.id.split('-')[2];
      const note = lesson.notes[num];
      if(note){
        const hint = document.createElement('span');
        hint.className='hint'; hint.innerHTML='→ '+noteHTML(note);
        inp.insertAdjacentElement('afterend', hint);
      }
    }
  });
  const zOk = lesson.left.filter((l,li)=>zuState[id].pairs[li]===lesson.correct[li]).length;
  const zTotal = lesson.left.length;
  const combinedOk = ok+zOk, combinedTotal = total+zTotal;
  document.getElementById('sc-'+id).innerHTML = `<b>${combinedOk}</b> / ${combinedTotal} richtig <span style="opacity:.7;font-weight:400">(Zuordnung ${zOk}/${zTotal} · Lücken ${ok}/${total})</span>`;

          <input type="checkbox" onchange="msToggle('${lesson.id}',${qi},${oi})"> <span>${o}</span>

      </div>
      <div class="wpn-note" id="wn-${lesson.id}-${qi}">${item.note||''}</div>
    </div>`).join('');

const msSel = {};
function msToggle(id, qi, oi){
  const key = id+'-'+qi;
  const set = msSel[key] || (msSel[key] = new Set());
  if(set.has(oi)) set.delete(oi); else set.add(oi);
}
function checkMultiselect(lesson){
  const id = lesson.id; let ok=0;
  lesson.items.forEach((item,qi)=>{
    const key = id+'-'+qi;
    const sel = msSel[key] || new Set();
    const correctSet = new Set(item.correct);
    let itemOk = sel.size===correctSet.size;
    item.opts.forEach((o,oi)=>{
      const el = document.getElementById(`ms-${id}-${qi}-${oi}`);
      el.classList.remove('correct','wrong-sel');
      const isCorrect = correctSet.has(oi);
      const isSel = sel.has(oi);
      if(isCorrect) el.classList.add('correct');
      else if(isSel) el.classList.add('wrong-sel');
      if(isCorrect !== isSel) itemOk = false;
    });
    document.getElementById(`wn-${id}-${qi}`).classList.add('show');
    if(itemOk) ok++;
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${lesson.items.length} richtig`;
  saveProgress(id, ok, lesson.items.length);
  _dlLog(lesson.title, ok, lesson.items.length);
}

/* ---- Speicherstand (localStorage) ---- */
function saveProgress(id, ok, total){
  try{
    localStorage.setItem('wsb2-progress-'+id, JSON.stringify({ok,total,ts:Date.now()}));
    showSaved(id, ok, total);
  }catch(e){}
}
function loadProgress(id){
  try{
    const raw = localStorage.getItem('wsb2-progress-'+id);
    if(raw){ const d = JSON.parse(raw); showSaved(id, d.ok, d.total); }
  }catch(e){}
}
function showSaved(id, ok, total){
  const el = document.getElementById('saved-'+id);
  if(el) el.textContent = `Letzter Versuch: ${ok}/${total}`;
}

function cardShell(lesson, bodyHtml, extraTop){
  const eyebrow = lesson.eyebrowOverride || (lesson.type==='lueckentext' ? `${lesson.id} · Lückentext`
    : lesson.type==='wpn' ? `${lesson.id} · Was passt nicht?`
    : lesson.type==='gegenteil' ? `${lesson.id} · Ergänzen Sie das Gegenteil`
    : lesson.type==='zuordnung' ? `${lesson.id} · Ordnen Sie zu`
    : lesson.type==='multiselect' ? `${lesson.id} · Mehrfachauswahl`
    : lesson.type==='singleselect' ? `${lesson.id} · Richtig oder falsch?`
    : lesson.type==='wahl' ? `${lesson.id} · Was passt?`
    : lesson.type==='combo6' ? `${lesson.id} · Ordnen Sie zu + Lückentext`
    : lesson.type==='raetsel' ? `${lesson.id} · Rätsel`
    : lesson.type==='raetselh' ? `${lesson.id} · Rätsel`
    : lesson.type==='karte' ? `${lesson.id} · Deutschlandkarte`
    : `${lesson.id} · Umformulieren`);
  const instr = lesson.instrOverride || (lesson.type==='lueckentext' ? 'Ergänzen Sie. Achten Sie auf die korrekte Form.'
    : lesson.type==='wpn' ? 'Streichen Sie das Wort, das nicht passt.'
    : lesson.type==='gegenteil' ? 'Ergänzen Sie das Gegenteil.'
    : lesson.type==='zuordnung' ? 'Ordnen Sie zu.'
    : lesson.type==='multiselect' ? 'Welche zwei Antworten sind richtig? Kreuzen Sie an.'
    : lesson.type==='singleselect' ? 'Welche Aussage ist richtig? Kreuzen Sie an.'
    : lesson.type==='wahl' ? 'Was passt nicht? Klicken Sie auf das passende Wort.'
    : lesson.type==='combo6' ? 'Teil 1: Ordnen Sie zu. Teil 2: Ergänzen Sie die Lücken.'
    : lesson.type==='raetsel' ? 'Wie heißen die Wörter? Lösen Sie das Kreuzworträtsel und finden Sie das Lösungswort.'
    : lesson.type==='raetselh' ? 'Lösen Sie das Rätsel und finden Sie das Lösungswort.'
    : lesson.type==='karte' ? 'Wie heißen die Bundesländer? Ergänzen Sie die Zahlen.'
    : 'Formulieren Sie die Sätze um. Vergleichen Sie danach mit der Musterlösung.');
  const showCheck = lesson.type!=='freitext';
  const hasTable = lesson.type==='lueckentext' || lesson.type==='combo6';
  const clueList = (lesson.type==='raetsel'||lesson.type==='raetselh') ? `<ol style="font-size:.92rem;line-height:1.7;padding-left:20px;color:var(--tx)">${lesson.words.map(w=>`<li>${w.clue}</li>`).join('')}</ol>`
    : lesson.type==='karte' ? `<div class="karte-list">${lesson.list.map((n,i)=>`<span>${i+1} ${n}</span>`).join('')}</div>` : '';
  return `
  <div class="card">
    <div class="card-eyebrow">${eyebrow}</div>
    <h2>${lesson.title.split('· ')[1]}</h2>
    <div class="instr">${instr}</div>
    ${extraTop||''}
    ${clueList}
    <div id="pg-${lesson.id}" class="passage"></div>
    ${showCheck ? `
    <div class="actions">
      <button class="btn" onclick="runCheck('${lesson.id}')">Überprüfen</button>
      ${hasTable ? `<button class="btn ghost" onclick="revealTable('${lesson.id}')">Lösung anzeigen</button>` : ''}
      ${lesson.type==='raetsel' ? `<button class="btn ghost" onclick="resetRaetsel('${lesson.id}')">Zurücksetzen</button>` : ''}
      ${lesson.type==='raetselh' ? `<button class="btn ghost" onclick="resetRaetselH('${lesson.id}')">Zurücksetzen</button>` : ''}
      ${lesson.type==='karte' ? `<button class="btn ghost" onclick="resetKarte(LESSONS.find(l=>l.id==='${lesson.id}'))">Zurücksetzen</button>` : ''}
      <span class="score" id="sc-${lesson.id}"></span>
    </div>` : ''}
    ${hasTable ? `

  return `

        <b>Option 1 — Mit Wortliste</b>Ergänzen Sie die Lücken mit den Wörtern unten.
      </button>
      <button class="bubble bubble-right" id="modeHide-${lesson.id}" onclick="setMode('${lesson.id}','hide')">
        <b>Option 2 — Ohne Wortliste</b>Hören Sie den Abschnitt (🔊) und ergänzen Sie die Lücken.
      </button>
    </div>
    <div class="wortliste" id="wl-${lesson.id}"></div>
    <span class="saved-badge" id="saved-${lesson.id}"></span>`;
}
function runCheck(id){
  const lesson = LESSONS.find(l=>l.id===id);
  if(lesson.type==='lueckentext') checkLueckentext(lesson);
  else if(lesson.type==='wpn') checkWpn(lesson);
  else if(lesson.type==='gegenteil') checkGegenteil(lesson);
  else if(lesson.type==='zuordnung') checkZuordnung(lesson);
  else if(lesson.type==='multiselect') checkMultiselect(lesson);
  else if(lesson.type==='singleselect') checkSingleselect(lesson);
  else if(lesson.type==='wahl') checkWahl(lesson);
  else if(lesson.type==='combo6') checkCombo6(lesson);
  else if(lesson.type==='raetsel') checkRaetsel(lesson);

  {id:'g2', label:'J4–6', ids:['J4','J5','J6']},
  {id:'g3', label:'J7–10', ids:['J7','J8','J9','J10']},

function switchTab(gid){
  document.querySelectorAll('.tab-sq').forEach(t=>t.classList.toggle('on', t.dataset.id===gid));
  document.querySelectorAll('.lesson-group').forEach(g=>g.classList.toggle('on', g.id==='view-'+gid));
}

function boot(){
  const subnav = document.getElementById('subnav');
  const wrap = document.getElementById('lessonsWrap');
  GROUPS.forEach((g,gi)=>{
    subnav.innerHTML += `<div class="tab-sq${gi===0?' on':''}" data-id="${g.id}" onclick="switchTab('${g.id}')">${g.label}</div>`;
    const groupBody = g.ids.map(lid=>{
      const lesson = LESSONS.find(l=>l.id===lid);
      const localVocab = VOCAB_BY_LESSON[lesson.id] ? `
        <details class="vocab mini-vocab">
          <summary>Wichtige Wörter — ${lesson.id}</summary>
          <div class="vgrid">${VOCAB_BY_LESSON[lesson.id].map(v=>`<div class="vrow"><span class="vde">${v[0]}</span><span class="vdd">${v[1]}</span><span class="vvi">${v[2]}</span></div>`).join('')}</div>
        </details>` : '';
      return `<div id="lesson-${lesson.id}">` + cardShell(lesson, '', lesson.type==='lueckentext' ? lueckentextTop(lesson) : '') + localVocab + `</div>`;
    }).join('');
    wrap.innerHTML += `<div class="lesson-group${gi===0?' on':''}" id="view-${g.id}">${groupBody}</div>`;
  });
  LESSONS.forEach(lesson=>{
    if(lesson.type==='lueckentext'){ renderLueckentext(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='wpn'){ renderWpn(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='gegenteil'){ renderGegenteil(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='zuordnung'){ renderZuordnung(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='multiselect'){ renderMultiselect(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='singleselect'){ renderSingleselect(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='wahl'){ renderWahl(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='combo6'){ renderCombo6(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='raetsel'){ renderRaetsel(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='raetselh'){ renderRaetselH(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='karte'){ renderKarte(lesson); loadProgress(lesson.id); }
    else if(lesson.type==='freitext'){ renderFreitext(lesson); }
  });
  renderVocab();
  renderFlash();
}

/* ============================================================
   RÄTSEL (vertikales Treppen-Kreuzworträtsel) — als normale Übung
   integriert. Wörter stehen SENKRECHT; die markierten Buchstaben
   aller Wörter liegen in EINER gemeinsamen Zeile.
   ============================================================ */
function renderRaetsel(lesson){
  const {words, loesung} = lesson;
  const id = lesson.id;

  let colsHtml = '';
  words.forEach((w,wi)=>{
    const markIndex = w.markPos - 1;
    let cellsHtml = `<div class="raetsel-num">${wi+1}</div>`;
    for(let i=0;i<w.answer.length;i++){
      const isMarked = (i===markIndex);
      cellsHtml += `<input type="text" maxlength="1"
        class="letter-box-v${isMarked?' marked':''}"
        data-ans="${w.answer[i]}" data-word="${wi}" data-pos="${i}"
        ${isMarked?`data-los="${wi}"`:''}>`;
    }
    colsHtml += `<div class="raetsel-col">${cellsHtml}</div>`;
  });

  let loesHtml = '';
  for(let k=0;k<loesung.length;k++){
    loesHtml += `<input type="text" maxlength="1" readonly class="letter-box-v loesung" data-ans="${loesung[k]}" id="${id}-raetsel-los-${k}">`;
  }

  document.getElementById('pg-'+id).innerHTML = `
    <div class="raetsel-cols">${colsHtml}</div>
    <div class="loes-wrap" style="margin-top:18px;padding-top:14px;border-top:2px dashed var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px;">
      <span style="font-size:.9rem;">🔑 <b>Lösungswort:</b> ${lesson.loesungHint}</span>
      <div class="letterrow-v">${loesHtml}</div>
    </div>`;

  document.querySelectorAll(`#pg-${id} input.letter-box-v:not(.loesung)`).forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.toUpperCase().slice(-1);
      inp.classList.remove('correct','wrong');
      if(inp.dataset.los !== undefined){
        const target = document.getElementById(id+'-raetsel-los-'+inp.dataset.los);
        if(target){ target.value = inp.value; target.classList.remove('correct','wrong'); }
      }
      if(inp.value){
        const col = inp.closest('.raetsel-col');
        const all = Array.from(col.querySelectorAll('input.letter-box-v'));
        const idx = all.indexOf(inp);
        if(idx>-1 && idx<all.length-1) all[idx+1].focus();
      }
    });
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !inp.value){
        const col = inp.closest('.raetsel-col');
        const all = Array.from(col.querySelectorAll('input.letter-box-v'));
        const idx = all.indexOf(inp);
        if(idx>0) all[idx-1].focus();
      }
    });
  });
}
function checkRaetsel(lesson){
  const id = lesson.id;
  const inputs = document.querySelectorAll(`#pg-${id} input.letter-box-v:not(.loesung)`);
  let correct=0, total=inputs.length;
  inputs.forEach(inp=>{
    const val = inp.value.trim().toLowerCase();
    const ans = inp.dataset.ans.toLowerCase();
    if(val===ans){ inp.classList.add('correct'); inp.classList.remove('wrong'); correct++; }
    else{ inp.classList.add('wrong'); inp.classList.remove('correct'); }
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${correct}</b> / ${total} richtig`;
  saveProgress(id, correct, total);
  _dlLog(lesson.title, correct, total);
}
function resetRaetsel(id){
  document.querySelectorAll(`#pg-${id} input.letter-box-v`).forEach(inp=>{ inp.value=''; inp.classList.remove('correct','wrong'); });
  document.getElementById('sc-'+id).innerHTML = '';
}

/* ============================================================
   RÄTSEL horizontal (Treppen-Kreuzworträtsel, Original-Vorlage) —
   Wörter stehen WAAGRECHT, die markierten Buchstaben aller Wörter
   liegen in EINER gemeinsamen SPALTE (Original-Algorithmus).

function renderRaetselH(lesson){
  const {words, loesung} = lesson;
  const id = lesson.id;
  const targetCol = Math.max(...words.map(w => w.markPos - 1));

  let rowsHtml = '';
  words.forEach((w,wi)=>{
    const markIndex = w.markPos - 1;
    const offset = targetCol - markIndex;
    let cells = '';
    for(let s=0; s<offset; s++) cells += `<span class="letter-spacer-h"></span>`;
    for(let i=0;i<w.answer.length;i++){
      const isMarked = (i === markIndex);
      cells += `<input type="text" maxlength="1"
        class="letter-box-h${isMarked?' marked':''}"
        data-ans="${w.answer[i]}" data-word="${wi}" data-pos="${i}"
        ${isMarked?`data-los="${wi}"`:''}>`;
    }
    rowsHtml += `<div class="raetselh-row"><span class="raetselh-num">${wi+1}</span><div class="raetselh-letters">${cells}</div></div>`;
  });

  let loesHtml = '';
  for(let k=0;k<loesung.length;k++){

        const target = document.getElementById(id+'-raetselh-los-'+inp.dataset.los);
        if(target){ target.value = inp.value; target.classList.remove('correct','wrong'); }
      }
      if(inp.value){
        const row = inp.closest('.raetselh-letters');
        const all = Array.from(row.querySelectorAll('input.letter-box-h'));
        const idx = all.indexOf(inp);

        const idx = all.indexOf(inp);
        if(idx>0) all[idx-1].focus();
      }
    });
  });
}

function renderKarte(lesson){
  const id = lesson.id;
  const markersHtml = lesson.cells.map(c=>`
    <div class="karte-marker" style="left:${c.x}%;top:${c.y}%">
      <input type="text" maxlength="2" class="karte-input${c.given?' given':''}"
        data-ans="${c.num}" id="k-${id}-${c.key}" ${c.given?`value="${c.num}" readonly`:''}>
    </div>`).join('');
  document.getElementById('pg-'+id).innerHTML = `
    <div class="karte-wrap">
      <img class="karte-img" src="data:image/jpeg;base64,${MAP_B64}" alt="Deutschlandkarte">
      ${markersHtml}
    </div>`;
}
function checkKarte(lesson){
  const id = lesson.id;
  let ok=0, total=0;
  lesson.cells.forEach(c=>{
    if(c.given) return;
    total++;
    const inp = document.getElementById(`k-${id}-${c.key}`);
    inp.classList.remove('correct','wrong');
    if(inp.value.trim()===String(c.num)){ inp.classList.add('correct'); ok++; }
    else inp.classList.add('wrong');
  });
  document.getElementById('sc-'+id).innerHTML = `<b>${ok}</b> / ${total} richtig`;
  saveProgress(id, ok, total);
  _dlLog(lesson.title, ok, total);
}
function resetKarte(lesson){
  const id = lesson.id;
  lesson.cells.forEach(c=>{
    if(c.given) return;
    const inp = document.getElementById(`k-${id}-${c.key}`);
    inp.value=''; inp.classList.remove('correct','wrong');
  });
  document.getElementById('sc-'+id).innerHTML = '';
}

function renderVocab(){
  const el = document.getElementById('vocabList');
  let gi = 0;
  el.innerHTML = LESSONS.map(l=>{
    const items = VOCAB_BY_LESSON[l.id];
    if(!items) return '';
    const cls = (gi++ % 2 === 0) ? 'even' : 'odd';
    return `<div class="vocab-group ${cls}">
      <div class="vgroup-lbl">${l.id}</div>
      ${items.map(v=>`<div class="vrow"><span class="vde">${v[0]}</span><span class="vdd">${v[1]}</span><span class="vvi">${v[2]}</span></div>`).join('')}
    </div>`;
  }).join('');
}
let viOn = false;
function toggleVI(){
  viOn = !viOn;
  document.querySelectorAll('.vvi').forEach(el=>el.style.display = viOn?'block':'none');
  const btn = document.getElementById('viToggle');
  btn.classList.toggle('on', viOn);
  btn.textContent = viOn ? 'Vietnamesisch ausblenden' : 'Vietnamesisch anzeigen';
}
const ALL_VOCAB = Object.values(VOCAB_BY_LESSON).flat();

/* ============================================================
   FLASHCARDS
   ============================================================ */
let flashIdx = 0, flashBack = false;
function renderFlash(){
  const v = ALL_VOCAB[flashIdx];
  document.getElementById('flashCounter').textContent = `${flashIdx+1} / ${ALL_VOCAB.length}`;
  const el = document.getElementById('flashcardEl');
  if(!flashBack){
    el.innerHTML = `<div class="fc-word">${v[0]}</div><div class="fc-hint">Tippen zum Umdrehen</div>`;
  } else {
    el.innerHTML = `<div class="fc-def">${v[1]}</div>${viOn?`<div class="fc-vi">${v[2]}</div>`:''}<div class="fc-hint">Tippen für das Wort</div>`;
  }
}
function flipFlash(){ flashBack = !flashBack; renderFlash(); }
function flashNav(d){ flashIdx = (flashIdx + d + ALL_VOCAB.length) % ALL_VOCAB.length; flashBack=false; renderFlash(); }
function flashRandom(){ flashIdx = Math.floor(Math.random()*ALL_VOCAB.length); flashBack=false; renderFlash(); }

/* ============================================================
   GENERIC 4-CHOICE QUIZ ENGINE
   ============================================================ */
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function buildQuizUI(containerId, questions, restartFnName){
  let idx=0, score=0, answered=false;
  function render(){
    const el = document.getElementById(containerId);
    if(idx>=questions.length){
      el.innerHTML = `<div class="quiz-done"><div class="quiz-score">${score} / ${questions.length}</div><button class="btn" onclick="${restartFnName}()">Neue Runde</button></div>`;
      return;
    }
    const q = questions[idx];
    el.innerHTML = `
      <div class="quiz-progress">${idx+1} / ${questions.length}</div>
      <div class="quiz-prompt">${q.prompt}</div>
      <div class="quiz-opts">${q.options.map((o,i)=>`<button class="qopt" data-i="${i}">${o}</button>`).join('')}</div>`;
    el.querySelectorAll('.qopt').forEach(btn=>{
      btn.onclick = ()=>{
        if(answered) return;
        answered = true;
        const i = +btn.dataset.i;
        el.querySelectorAll('.qopt').forEach((b,bi)=>{
          if(bi===q.correctIndex) b.classList.add('correct');
          else if(bi===i) b.classList.add('wrong');
        });
        if(i===q.correctIndex) score++;
        setTimeout(()=>{ idx++; answered=false; render(); }, 900);
      };
    });
  }
  render();
}
function sampleVocabQuestions(n){
  const pool = shuffle(ALL_VOCAB).slice(0, Math.min(n, ALL_VOCAB.length));
  return pool.map(v=>{
    const distractors = shuffle(ALL_VOCAB.filter(x=>x!==v)).slice(0,3).map(x=>x[1]);
    const options = shuffle([v[1], ...distractors]);
    return { prompt: v[0], options, correctIndex: options.indexOf(v[1]) };
  });
}
function startWsQuiz(){
  buildQuizUI('ws-quiz-body', sampleVocabQuestions(8), 'startWsQuiz');
}

/* ============================================================
   SCHNELLTEST — Wortschatz + Lückentext-Kollokationen gemischt
   ============================================================ */
function buildLueckentestQuestions(n){
  const pool = [];
  LESSONS.filter(l=>l.type==='lueckentext').forEach(lesson=>{
    Object.keys(lesson.notes||{}).forEach(num=>{
      const note = lesson.notes[num];
      const ans = lesson.answers[num];
      if(!note || !ans) return;
      const re = new RegExp(ans.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
      if(!re.test(note.beispiel)) return;
      const blanked = note.beispiel.replace(re, '___');
      const distractors = shuffle(lesson.bank.filter(w=>w.toLowerCase()!==ans.toLowerCase())).slice(0,3);
      if(distractors.length<3) return;
      const options = shuffle([ans, ...distractors]);
      pool.push({ prompt: `„${blanked}“`, options, correctIndex: options.indexOf(ans) });
    });
  });
  return shuffle(pool).slice(0, n);
}
function startSchnelltest(){
  const vocabQ = sampleVocabQuestions(10);
  const luckenQ = buildLueckentestQuestions(10);
  const all = shuffle([...vocabQ, ...luckenQ]);
  buildQuizUI('schnelltest-body', all, 'startSchnelltest');
}
