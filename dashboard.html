<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard · Deutsch-Lernen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--ink:#0f2644;--bg:#eaeff8;--card:#fff;--blue:#2563eb;--border:#dde3ea;--muted:#7a8fa8;--shadow:0 2px 12px rgba(15,38,68,.07);}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
.hdr{background:var(--ink);padding:28px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.hdr-left h1{font-family:'Playfair Display',serif;font-size:1.5rem;color:#fff;}
.hdr-left p{font-size:0.72rem;color:rgba(255,255,255,.4);font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-top:3px;}
.hdr-right{display:flex;align-items:center;gap:8px;}
.btn-hdr{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:'Outfit',sans-serif;font-size:0.78rem;font-weight:700;padding:7px 14px;border-radius:99px;cursor:pointer;transition:background .2s;text-decoration:none;}
.btn-hdr:hover{background:rgba(255,255,255,.2);}
.status-dot{width:8px;height:8px;border-radius:50%;background:#16a34a;}
.tabs{max-width:1100px;margin:20px auto 0;padding:0 20px;display:flex;gap:4px;}
.tab-btn{padding:9px 20px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.5);color:var(--muted);}
.tab-btn.active{background:#fff;color:var(--blue);box-shadow:var(--shadow);}
.filters{max-width:1100px;margin:16px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap;}
.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
.fg label{font-size:0.65rem;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.fg select,.fg input{padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Outfit',sans-serif;font-size:0.83rem;color:var(--ink);background:#fff;outline:none;}
.fg select:focus,.fg input:focus{border-color:var(--blue);}
.btn-clear{align-self:flex-end;padding:8px 14px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:'Outfit',sans-serif;font-size:0.8rem;font-weight:700;color:var(--muted);cursor:pointer;}
.stats{max-width:1100px;margin:16px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.stat{background:var(--card);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);border:1.5px solid var(--border);}
.stat-lbl{font-size:0.62rem;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
.stat-val{font-size:1.9rem;font-weight:900;line-height:1;}
.stat-sub{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.section{max-width:1100px;margin:16px auto 0;padding:0 20px;}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1.5px solid var(--border);overflow:hidden;}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border);}
.card-head h2{font-size:0.88rem;font-weight:800;}
.card-count{font-size:0.72rem;color:var(--muted);font-weight:600;}
table{width:100%;border-collapse:collapse;}
thead th{text-align:left;padding:9px 14px;font-size:0.62rem;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;background:#f8fafc;border-bottom:1px solid var(--border);}
tbody tr{border-bottom:1px solid #f0f4f8;transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:#f8fafc;}
tbody td{padding:10px 14px;font-size:0.81rem;}
.td-name{font-weight:700;}
.td-email{color:var(--muted);font-size:0.72rem;}
.pct-bar{display:flex;align-items:center;gap:6px;}
.bar-track{height:5px;width:50px;background:#e8edf2;border-radius:99px;overflow:hidden;flex:none;}
.bar-fill{height:100%;border-radius:99px;}
.pct-text{font-size:0.78rem;font-weight:700;min-width:34px;}
.badge-lv{display:inline-block;font-size:0.58rem;font-weight:800;padding:2px 7px;border-radius:99px;letter-spacing:.04em;margin-left:4px;}
.lv-a{background:#e0f2fe;color:#0369a1;}
.lv-b1{background:#dcfce7;color:#15803d;}
.lv-b2{background:#ede9fe;color:#6d28d9;}
.td-time{color:var(--muted);font-size:0.72rem;}
.state{text-align:center;padding:50px 20px;color:var(--muted);}
.state .ico{font-size:2.2rem;margin-bottom:10px;}
.state p{font-size:0.88rem;font-weight:600;}
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px;}
.stu-card{background:#f8fafc;border-radius:14px;padding:16px;border:1.5px solid var(--border);}
.stu-name{font-weight:800;font-size:0.9rem;margin-bottom:2px;}
.stu-email{font-size:0.7rem;color:var(--muted);margin-bottom:10px;}
.stu-stats{display:flex;gap:16px;margin-bottom:10px;}
.stu-stat-val{font-size:1.3rem;font-weight:900;line-height:1;}
.stu-stat-lbl{font-size:0.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;}
.stu-files{display:flex;flex-wrap:wrap;gap:4px;}
.stu-file-tag{font-size:0.65rem;font-weight:700;padding:2px 8px;border-radius:99px;background:#e8edf2;color:var(--ink);}
@media(max-width:600px){
  .filters,.stats,.section,.tabs{padding:0 12px;}
  thead th:nth-child(4),tbody td:nth-child(4),thead th:nth-child(5),tbody td:nth-child(5){display:none;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <h1>📊 Lehrer-Dashboard</h1>
    <p>Deutsch-Lernen · Ergebnisübersicht</p>
  </div>
  <div class="hdr-right">
    <span class="status-dot" id="statusDot"></span>
    <button class="btn-hdr" onclick="loadData()">⟳ Aktualisieren</button>
    <a class="btn-hdr" href="index.html">← Hub</a>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('overview')">📋 Übersicht</button>
  <button class="tab-btn" onclick="showTab('students')">👥 Schüler</button>
</div>

<!-- OVERVIEW -->
<div id="tab-overview">
  <div class="filters">
    <div class="fg"><label>Schüler</label><input type="text" id="filterName" placeholder="Name..." oninput="render()"></div>
    <div class="fg"><label>Datei</label><select id="filterFile" onchange="render()"><option value="">Alle</option></select></div>
    <div class="fg"><label>Niveau</label>
      <select id="filterLevel" onchange="render()">
        <option value="">Alle</option><option value="A1-A2">A1–A2</option>
        <option value="B1">B1</option><option value="B2">B2</option>
      </select>
    </div>
    <div class="fg"><label>Von</label><input type="date" id="filterFrom" onchange="render()"></div>
    <div class="fg"><label>Bis</label><input type="date" id="filterTo" onchange="render()"></div>
    <button class="btn-clear" onclick="clearFilters()">✕ Reset</button>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-lbl">Einträge</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat"><div class="stat-lbl">Schüler</div><div class="stat-val" id="s-students">—</div></div>
    <div class="stat"><div class="stat-lbl">Ø Ergebnis</div><div class="stat-val" id="s-avg">—</div><div class="stat-sub">Durchschnitt</div></div>
    <div class="stat"><div class="stat-lbl">Beste Note</div><div class="stat-val" id="s-best">—</div></div>
    <div class="stat"><div class="stat-lbl">Heute</div><div class="stat-val" id="s-today">—</div><div class="stat-sub">Einträge</div></div>
  </div>
  <div class="section" style="margin-bottom:32px;">
    <div class="card">
      <div class="card-head"><h2>Alle Ergebnisse</h2><span class="card-count" id="tableCount"></span></div>
      <div id="tableBody"><div class="state"><div class="ico">⏳</div><p>Laden...</p></div></div>
    </div>
  </div>
</div>

<!-- STUDENTS -->
<div id="tab-students" style="display:none">
  <div class="section" style="margin-bottom:32px;">
    <div class="card">
      <div class="card-head"><h2>👥 Schülerübersicht</h2><span class="card-count" id="stuCount"></span></div>
      <div class="student-grid" id="studentGrid"><div class="state"><div class="ico">⏳</div><p>Laden...</p></div></div>
    </div>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbw7uN5J6WwDG2vl5SgcpeeJ_ZnXDEaXLh-49VzYhQV11baq0pklFJEdhT660frW1kVS/exec";
const GOOGLE_CLIENT_ID='565949426173-cg9jat7abv9jbk2hktuak1sud8pc11do.apps.googleusercontent.com';
let allData=[];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function showTab(tab){
  ['overview','students'].forEach(t=>{
    document.getElementById('tab-'+t).style.display=t===tab?'block':'none';
  });
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['overview','students'][i]===tab);
  });
  if(tab==='students')renderStudents();
}

function decodeJwt(t){try{const b=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(b).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));}catch(e){return null;}}
function getToken(){
  try{const t=JSON.parse(sessionStorage.getItem('dl_teacher_token')||'null');
    if(t&&t.exp*1000>Date.now()+60000)return t.token;}catch(e){}
  return null;
}
function onCredential(r){
  const p=decodeJwt(r.credential); if(!p)return;
  try{sessionStorage.setItem('dl_teacher_token',JSON.stringify({token:r.credential,exp:p.exp}));}catch(e){}
  loadData();
}
function showLogin(msg){
  document.getElementById('statusDot').style.background='#e53e3e';
  document.getElementById('tableBody').innerHTML='<div class="state"><div class="ico">🔒</div><p>'+esc(msg||'Bitte als Lehrer mit Google anmelden.')+'</p><div id="gBtnBox" style="display:flex;justify-content:center;margin-top:16px;min-height:44px"></div></div>';
  (function init(){
    if(typeof google==='undefined'||!google.accounts){setTimeout(init,300);return;}
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onCredential,use_fedcm_for_prompt:true});
    google.accounts.id.renderButton(document.getElementById('gBtnBox'),{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:260});
  })();
}
function loadData(){
  document.getElementById('statusDot').style.background='#d97706';
  const token=getToken();
  if(!token){showLogin();return;}
  fetch(SHEET_URL+'?action=all&token='+encodeURIComponent(token)).then(r=>r.json()).then(res=>{
    if(res.status!=='ok'){
      if(res.code==='auth'){try{sessionStorage.removeItem('dl_teacher_token');}catch(e){}showLogin(res.msg);return;}
      throw new Error(res.msg);
    }
    allData=(res.data||[]).filter(r=>r['Tên học sinh']);
    document.getElementById('statusDot').style.background='#16a34a';
    populateFileFilter();render();
  }).catch(err=>{
    document.getElementById('statusDot').style.background='#e53e3e';
    document.getElementById('tableBody').innerHTML=`<div class="state"><div class="ico">❌</div><p>${esc(err.message)}</p></div>`;
  });
}

function getLevel(f=''){f=String(f).toUpperCase();
  if(f.includes('A1')||f.includes('A2'))return 'A1-A2';
  if(f.includes('B1'))return 'B1';
  if(f.includes('B2')||f.includes('C1'))return 'B2';
  return '';
}
function getLvClass(l){return l==='A1-A2'?'lv-a':l==='B1'?'lv-b1':'lv-b2';}
function getPct(row){const s=parseInt(row['Điểm'])||0,t=parseInt(row['Tổng câu'])||1;return Math.round(s/t*100);}
function barColor(p){return p>=80?'#16a34a':p>=50?'#d97706':'#e53e3e';}
function fmtDate(v){
  if(!v)return '—';const d=new Date(v);if(isNaN(d))return v;
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

function populateFileFilter(){
  const files=[...new Set(allData.map(r=>r['File bài tập']).filter(Boolean))].sort();
  document.getElementById('filterFile').innerHTML='<option value="">Alle</option>'+files.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
}

function getFiltered(){
  const name=document.getElementById('filterName').value.toLowerCase().trim();
  const file=document.getElementById('filterFile').value;
  const level=document.getElementById('filterLevel').value;
  const from=document.getElementById('filterFrom').value;
  const to=document.getElementById('filterTo').value;
  return allData.filter(row=>{
    if(name&&!(row['Tên học sinh']||'').toLowerCase().includes(name))return false;
    if(file&&row['File bài tập']!==file)return false;
    if(level&&getLevel(row['File bài tập'])!==level)return false;
    if(from&&new Date(row['Thời gian'])<new Date(from))return false;
    if(to&&new Date(row['Thời gian'])>new Date(to+'T23:59:59'))return false;
    return true;
  });
}

function render(){
  const data=getFiltered();
  const pcts=data.map(r=>getPct(r));
  const avg=pcts.length?Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length):0;
  const today=data.filter(r=>new Date(r['Thời gian']).toDateString()===new Date().toDateString()).length;
  document.getElementById('s-total').textContent=data.length;
  document.getElementById('s-students').textContent=new Set(data.map(r=>r['Email'])).size;
  document.getElementById('s-avg').textContent=avg+'%';
  document.getElementById('s-best').textContent=(pcts.length?Math.max(...pcts):0)+'%';
  document.getElementById('s-today').textContent=today;
  document.getElementById('tableCount').textContent=data.length+' Einträge';
  if(!data.length){document.getElementById('tableBody').innerHTML='<div class="state"><div class="ico">📭</div><p>Keine Ergebnisse</p></div>';return;}
  const sorted=[...data].sort((a,b)=>new Date(b['Thời gian'])-new Date(a['Thời gian']));
  document.getElementById('tableBody').innerHTML=`<table><thead><tr><th>Schüler</th><th>Datei</th><th>Übung</th><th>Ergebnis</th><th>Zeitpunkt</th></tr></thead><tbody>`+
    sorted.map(row=>{
      const p=getPct(row),c=barColor(p),lv=getLevel(row['File bài tập']||'');
      return `<tr><td><div class="td-name">${esc(row['Tên học sinh']||'—')}</div><div class="td-email">${esc(row['Email'])}</div></td>
        <td>${esc(row['File bài tập']||'—')}${lv?`<span class="badge-lv ${getLvClass(lv)}">${lv}</span>`:''}</td>
        <td>${esc(row['Bộ câu hỏi']||'—')}</td>
        <td><div class="pct-bar"><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${c}"></div></div><span class="pct-text" style="color:${c}">${p}%</span></div>
        <div style="font-size:.7rem;color:var(--muted)">${row['Điểm']||0}/${row['Tổng câu']||0}</div></td>
        <td class="td-time">${fmtDate(row['Thời gian'])}</td></tr>`;
    }).join('')+'</tbody></table>';
}

function clearFilters(){
  document.getElementById('filterName').value='';
  ['filterFile','filterLevel'].forEach(id=>document.getElementById(id).value='');
  ['filterFrom','filterTo'].forEach(id=>document.getElementById(id).value='');
  render();
}

function renderStudents(){
  const by={};
  allData.forEach(row=>{const em=row['Email']||'?';if(!by[em])by[em]={name:row['Tên học sinh'],email:em,rows:[]};by[em].rows.push(row);});
  const list=Object.values(by);
  document.getElementById('stuCount').textContent=list.length+' Schüler';
  if(!list.length){document.getElementById('studentGrid').innerHTML='<div class="state"><div class="ico">📭</div><p>Keine Daten</p></div>';return;}
  document.getElementById('studentGrid').innerHTML=list.map(s=>{
    const pcts=s.rows.map(r=>getPct(r));
    const avg=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);
    const files=[...new Set(s.rows.map(r=>r['File bài tập']).filter(Boolean))];
    const c=barColor(avg);
    return `<div class="stu-card">
      <div class="stu-name">${esc(s.name||'—')}</div>
      <div class="stu-email">${esc(s.email)}</div>
      <div class="stu-stats">
        <div><div class="stu-stat-val" style="color:${c}">${avg}%</div><div class="stu-stat-lbl">Ø Note</div></div>
        <div><div class="stu-stat-val">${s.rows.length}</div><div class="stu-stat-lbl">Übungen</div></div>
        <div><div class="stu-stat-val">${Math.max(...pcts)}%</div><div class="stu-stat-lbl">Beste</div></div>
      </div>
      <div class="stu-files">${files.slice(0,5).map(f=>`<span class="stu-file-tag">${esc(f.replace(/\s*\([^)]+\)/,''))}</span>`).join('')}${files.length>5?`<span class="stu-file-tag">+${files.length-5}</span>`:''}</div>
    </div>`;
  }).join('');
}


loadData();
</script>
</body>
</html>
