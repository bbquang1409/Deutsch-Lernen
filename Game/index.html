<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deutsche Arena</title>
<style>
:root{--ink:#12284a;--gold:#ffd65a;--stone1:#f7e2ad;--stone2:#c8914c;--stone3:#7b4a24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:white;background:#74c9f4}
body{min-height:100svh;overflow-x:hidden;background:linear-gradient(#64c9ff 0 45%,#c9efff 45% 62%,#6fb55d 62% 100%)}
.arena{min-height:100svh;position:relative;overflow:hidden;padding:clamp(14px,2vw,26px) clamp(12px,2vw,28px) 22px;display:flex;flex-direction:column;align-items:center}
.arena:before{content:"";position:absolute;inset:34% -8% 0;background:linear-gradient(145deg,transparent 0 18%,#c9e9f5 18% 22%,transparent 22% 31%,#b8dce9 31% 36%,transparent 36%),linear-gradient(35deg,transparent 0 22%,#d9eef5 22% 28%,transparent 28%);opacity:.7;pointer-events:none}
.flags{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:2}.flag{width:54px;height:34px;border:3px solid #fff;border-radius:4px;box-shadow:0 3px 8px #0004;background:linear-gradient(#111 0 33%,#d62028 33% 66%,#f4cc29 66%)}
header{position:relative;z-index:3;text-align:center;margin-top:35px;text-shadow:0 4px 0 #18396b,0 7px 12px #0006}
h1{margin:0;font-size:clamp(38px,6vw,78px);line-height:.95;letter-spacing:.025em;font-weight:1000;color:#fff9df;-webkit-text-stroke:2px #18396b}header p{margin:9px 0 0;font-weight:950;letter-spacing:.2em;font-size:clamp(11px,1.5vw,17px);color:#ffe979}
.portals{position:relative;z-index:4;width:min(1460px,98vw);display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.3vw,20px);margin:auto 0 18px;align-items:end}
.portal{--c1:#e94531;--c2:#ff9c25;position:relative;height:clamp(360px,56vh,650px);border:0;padding:0;background:transparent;cursor:pointer;text-decoration:none;color:white;filter:drop-shadow(0 12px 9px #17304766);transition:.18s ease;outline:none}.portal:hover,.portal:focus-visible{transform:translateY(-10px) scale(1.015)}
.arch{position:absolute;inset:0;border-radius:46% 46% 12% 12%/25% 25% 6% 6%;padding:clamp(9px,1vw,15px);background:linear-gradient(100deg,var(--stone3),var(--stone1) 22%,var(--stone2) 49%,var(--stone1) 76%,var(--stone3));box-shadow:inset 0 0 0 4px #fff3b0,inset 0 0 0 10px #7d4a23,0 10px 0 #6d421f}
.inner{height:100%;border-radius:44% 44% 8% 8%/24% 24% 5% 5%;overflow:hidden;position:relative;background:radial-gradient(circle at 50% 38%,#fff8 0 2%,transparent 3%),linear-gradient(155deg,var(--c2),var(--c1) 72%);box-shadow:inset 0 0 35px #0005}
.inner:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 25px,#fff1 26px 28px);mix-blend-mode:screen}
.icon{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-size:clamp(78px,9vw,145px);filter:drop-shadow(0 9px 4px #0005);line-height:1}.schnitt .icon{font-size:clamp(88px,10vw,155px)}
.name{position:absolute;left:5%;right:5%;bottom:5%;padding:12px 5px;border-radius:15px;background:linear-gradient(#183c72,#0d2447);border:3px solid #ffe680;box-shadow:0 5px 0 #07182f,0 0 16px #fff5;text-align:center;font-size:clamp(17px,2vw,31px);font-weight:1000;letter-spacing:.025em;text-shadow:0 2px 0 #000}
.rennen{--c1:#1778d5;--c2:#ffe45a}.paar{--c1:#7135b8;--c2:#dc74ef}.jagd{--c1:#22884d;--c2:#83d64b}
.truck{font-size:clamp(74px,8.6vw,140px)!important}.cards{font-size:clamp(72px,8vw,130px)!important}.hunter{font-size:clamp(82px,9vw,145px)!important}
.bottom{position:relative;z-index:5;margin-top:auto;padding:10px 34px;border-radius:12px;background:linear-gradient(#245a9b,#153d74);border:2px solid #f4cc52;box-shadow:0 5px 12px #0004;font-weight:900;font-size:clamp(13px,1.4vw,18px);letter-spacing:.03em;text-align:center}
@media(max-width:850px){body{overflow:auto}.arena{min-height:100svh}.portals{grid-template-columns:repeat(2,1fr);max-width:680px;margin:35px auto 22px}.portal{height:390px}header{margin-top:40px}.flags{transform:translateX(-50%) scale(.8)}}
@media(max-width:480px){.arena{padding-inline:8px}.portals{gap:9px}.portal{height:310px}.arch{padding:8px;box-shadow:inset 0 0 0 3px #fff3b0,inset 0 0 0 7px #7d4a23,0 7px 0 #6d421f}.name{font-size:15px;padding:9px 2px;border-width:2px}.bottom{padding:9px 16px}}
</style>
</head>
<body>
<main class="arena">
  <div class="flags"><span class="flag"></span><span class="flag"></span></div>
  <header><h1>DEUTSCHE ARENA</h1><p>SPIELEN · LERNEN · MEISTERN</p></header>
  <nav class="portals" aria-label="Spiele">
    <a class="portal schnitt" href="wort-schnitt.html" aria-label="Wort-Schnitt öffnen"><div class="arch"><div class="inner"><div class="icon">🥷⚔️</div><div class="name">WORT-SCHNITT</div></div></div></a>
    <a class="portal rennen" href="wort-rennen.html" aria-label="Wort-Rennen öffnen"><div class="arch"><div class="inner"><div class="icon truck">🏎️</div><div class="name">WORT-RENNEN</div></div></div></a>
    <a class="portal paar" href="wort-paar.html" aria-label="Wort-Paar öffnen"><div class="arch"><div class="inner"><div class="icon cards">🃏🃏</div><div class="name">WORT-PAAR</div></div></div></a>
    <a class="portal jagd" href="wort-jagd.html" aria-label="Wort-Jagd öffnen"><div class="arch"><div class="inner"><div class="icon hunter">🧭🔎</div><div class="name">WORT-JAGD</div></div></div></a>
  </nav>
  <div class="bottom">Wähle ein Spiel und los geht’s!</div>
</main>
</body>
</html>
