<script id="arena-orientation-adapter">
(function(){
  'use strict';
  var btn=document.getElementById('arena-landscape-btn');
  if(!btn)return;
  btn.addEventListener('click',async function(){
    // Orientation lock is allowed only after a user gesture and usually fullscreen.
    try {if(document.documentElement.requestFullscreen && !document.fullscreenElement){await document.documentElement.requestFullscreen();}}catch(e){}
    try {if(screen.orientation && screen.orientation.lock){await screen.orientation.lock('landscape');}}catch(e){}
    // On iOS Safari or browsers refusing lock, the gate remains until device rotates.
  });
})();
