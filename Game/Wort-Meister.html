<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deutsch Catch - Modern Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Fredoka', sans-serif;
      background: #0b0c10;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* CONTAINER KHUNG GAME STYLE MODERN MOBILE */
    #game-container {
      width: 100vw;
      max-width: 440px;
      height: 100vh;
      max-height: 820px;
      position: relative;
      /* Background Gradient đa tầng rực rỡ */
      background: radial-gradient(circle at 50% 20%, #4a00e0 0%, #8e2de2 40%, #1f1c2c 100%);
      box-shadow: 0 20px 50px rgba(142, 45, 226, 0.4), 0 0 0 12px #2d134b;
      border-radius: 36px;
      overflow: hidden;
    }

    /* --- MENU CHỌN LEVEL ĐẲNG CẤP HIGH-GLOSS --- */
    #start-screen {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 24px 30px;
      background: rgba(15, 12, 41, 0.75);
      backdrop-filter: blur(16px);
    }

    .logo-container {
      text-align: center;
    }
    .logo-container h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #fff 30%, #ffd700 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
      text-transform: uppercase;
    }
    .logo-container .subtitle {
      display: inline-block;
      background: #ff007f;
      color: #fff;
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.5);
      transform: rotate(-2deg);
    }

    /* LEVEL SELECT GRID - CARDS 3D */
    .level-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
    }
    .level-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 20px 12px;
      text-align: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .level-card:hover, .level-card:active {
      transform: translateY(-6px) scale(1.03);
      border-color: #ffd700;
      box-shadow: 0 12px 25px rgba(255, 215, 0, 0.4);
      background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,255,255,0.1));
    }
    .level-card .icon-wrapper {
      width: 50px;
      height: 50px;
      margin: 0 auto 8px;
      background: radial-gradient(circle, #ff007f 0%, #7928ca 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .level-card h3 { font-size: 1.1rem; color: #fff; margin-bottom: 2px; }
    .level-card span { font-size: 0.75rem; color: #d1c4e9; }

    /* HUD BANNER TRONG GAME */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
    }
    .hud-pill {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
    }

    #target-banner {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #ff8a00, #e52e71);
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(229, 46, 113, 0.5);
      z-index: 5;
      text-align: center;
      width: 85%;
      border: 2px solid rgba(255,255,255,0.4);
    }

    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>

<div id="game-container">
  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="logo-container">
      <h1>WORT CATCH</h1>
      <div class="subtitle">DEUTSCH MEISTER</div>
    </div>

    <div class="level-grid">
      <div class="level-card" onclick="startGame('nomen')">
        <div class="icon-wrapper">👑</div>
        <h3>1. Nomen</h3>
        <span>Der / Die / Das</span>
      </div>
      <div class="level-card" onclick="startGame('verben')">
        <div class="icon-wrapper">⚡</div>
        <h3>2. Verben</h3>
        <span>Chia Động Từ</span>
      </div>
      <div class="level-card" onclick="startGame('adjektiv')">
        <div class="icon-wrapper">🚀</div>
        <h3>3. Adjektiv</h3>
        <span>Komparativ</span>
      </div>
      <div class="level-card" onclick="startGame('antonym')">
        <div class="icon-wrapper">🔄</div>
        <h3>4. Gegenteil</h3>
        <span>Từ Trái Nghĩa</span>
      </div>
    </div>

    <div style="font-size: 0.85rem; opacity: 0.7; color: #e0e0e0;">👉 Vuốt màn hình để điều khiển khay hứng</div>
  </div>

  <!-- HUD -->
  <div id="hud" style="display: none;">
    <div class="hud-pill" style="color: #00ffcc;">💎 <span id="score">0</span></div>
    <div class="hud-pill" style="color: #ff0055;">⏳ <span id="timer">45</span>s</div>
  </div>
  <div id="target-banner" style="display: none;">Mục tiêu...</div>

  <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

canvas.width = 440;
canvas.height = 820;

let currentLevel = null;
let score = 0;
let timeLeft = 45;
let gameInterval, timerInterval;
let items = [];
let particles = [];
let targetData = {};

// Khay hứng Thiết kế 3D Neon Paddle
const player = {
  x: canvas.width / 2 - 60,
  y: canvas.height - 90,
  width: 120,
  height: 24,
  color: '#00ffcc'
};

const GAME_DATA = {
  nomen: [
    { prompt: "Hứng từ giống DER (Giống đực)", items: [
      { text: "Apfel", ok: true }, { text: "Tisch", ok: true },
      { text: "Lampe", ok: false }, { text: "Buch", ok: false }
    ]},
    { prompt: "Hứng từ giống DIE (Giống cái)", items: [
      { text: "Sonne", ok: true }, { text: "Tasche", ok: true },
      { text: "Hund", ok: false }, { text: "Auto", ok: false }
    ]}
  ],
  verben: [
    { prompt: "Chia động từ cho 'ich...'", items: [
      { text: "gehe", ok: true }, { text: "mache", ok: true },
      { text: "geht", ok: false }, { text: "machst", ok: false }
    ]}
  ],
  adjektiv: [
    { prompt: "So sánh hơn của 'groß'", items: [
      { text: "größer", ok: true }, { text: "großer", ok: false },
      { text: "am größten", ok: false }
    ]}
  ],
  antonym: [
    { prompt: "Từ TRÁI NGHĨA với 'kalt'", items: [
      { text: "heiß", ok: true }, { text: "warm", ok: true },
      { text: "kühl", ok: false }, { text: "klein", ok: false }
    ]}
  ]
};

// Xử lý di chuyển mượt
function handleMove(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  player.x = (clientX - rect.left) * (canvas.width / rect.width) - player.width / 2;
  player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
}
canvas.addEventListener('mousemove', handleMove);
canvas.addEventListener('touchmove', handleMove);

function startGame(level) {
  currentLevel = level;
  score = 0;
  timeLeft = 45;
  items = [];
  particles = [];

  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('target-banner').style.display = 'block';

  document.getElementById('score').innerText = score;
  document.getElementById('timer').innerText = timeLeft;

  nextQuestion();

  clearInterval(gameInterval);
  clearInterval(timerInterval);

  gameInterval = setInterval(updateGame, 1000 / 60);
  timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if (timeLeft <= 0) endGame();
  }, 1000);

  setInterval(spawnItem, 1000);
}

function nextQuestion() {
  const list = GAME_DATA[currentLevel];
  targetData = list[Math.floor(Math.random() * list.length)];
  document.getElementById('target-banner').innerText = targetData.prompt;
}

function spawnItem() {
  if (timeLeft <= 0) return;
  const raw = targetData.items[Math.floor(Math.random() * targetData.items.length)];
  items.push({
    x: Math.random() * (canvas.width - 90) + 15,
    y: -50,
    radius: 42,
    text: raw.text,
    ok: raw.ok,
    speed: 3.5 + Math.random() * 2,
    pulse: Math.random() * Math.PI
  });
}

// Hiệu ứng hạt nổ khi hứng đúng
function createParticles(x, y, color) {
  for (let i = 0; i < 15; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      radius: Math.random() * 5 + 2,
      color: color,
      alpha: 1
    });
  }
}

function updateGame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 1. Vẽ Khay hứng Neon 3D
  ctx.save();
  ctx.shadowBlur = 20;
  ctx.shadowColor = player.color;
  
  let gradP = ctx.createLinearGradient(player.x, player.y, player.x, player.y + player.height);
  gradP.addColorStop(0, '#ffffff');
  gradP.addColorStop(0.5, player.color);
  gradP.addColorStop(1, '#0088cc');

  ctx.fillStyle = gradP;
  ctx.beginPath();
  ctx.roundRect(player.x, player.y, player.width, player.height, 12);
  ctx.fill();
  ctx.restore();

  // 2. Update & Vẽ Bong bóng Ngọc Bích rơi
  for (let i = items.length - 1; i >= 0; i--) {
    let item = items[i];
    item.y += item.speed;
    item.pulse += 0.05;

    ctx.save();
    let displayRadius = item.radius + Math.sin(item.pulse) * 2;

    // Gradient hình cầu (Gem Bubble Effect)
    let gemGrad = ctx.createRadialGradient(
      item.x - 10, item.y - 10, 5,
      item.x, item.y, displayRadius
    );
    gemGrad.addColorStop(0, '#ffffff');
    gemGrad.addColorStop(0.3, item.ok ? '#00f2fe' : '#ff0844');
    gemGrad.addColorStop(1, item.ok ? '#4facfe' : '#ffb199');

    ctx.shadowBlur = 15;
    ctx.shadowColor = item.ok ? '#00f2fe' : '#ff0844';

    ctx.fillStyle = gemGrad;
    ctx.beginPath();
    ctx.arc(item.x, item.y, displayRadius, 0, Math.PI * 2);
    ctx.fill();

    // Text bên trong bong bóng
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px "Fredoka", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.8)';
    ctx.shadowBlur = 4;
    ctx.fillText(item.text, item.x, item.y);
    ctx.restore();

    // Va chạm với khay
    if (
      item.y + displayRadius >= player.y &&
      item.x >= player.x - 10 &&
      item.x <= player.x + player.width + 10 &&
      item.y - displayRadius <= player.y + player.height
    ) {
      if (item.ok) {
        score += 100;
        createParticles(item.x, item.y, '#00ffff');
      } else {
        score = Math.max(0, score - 50);
        createParticles(item.x, item.y, '#ff0055');
      }
      document.getElementById('score').innerText = score;
      items.splice(i, 1);
      continue;
    }

    if (item.y > canvas.height + 50) items.splice(i, 1);
  }

  // 3. Update & Vẽ Hạt Nổ (Particles)
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function endGame() {
  clearInterval(gameInterval);
  clearInterval(timerInterval);
  alert(`🏁 HẾT GIỜ! Bạn đạt được: ${score} điểm!`);
  document.getElementById('start-screen').style.display = 'flex';
  document.getElementById('hud').style.display = 'none';
  document.getElementById('target-banner').style.display = 'none';
}
</script>
</body>
</html>
