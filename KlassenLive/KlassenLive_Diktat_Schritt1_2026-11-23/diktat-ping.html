<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KlassenLive · Verbindungstest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#1b2430;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{color:#a91f32;font-size:1.4rem;margin:6px 0 4px}p.sub{margin:0 0 14px;color:#67727f;font-size:.9rem}
.card{background:#fff;border:1px solid #e3e6eb;border-radius:16px;padding:16px;margin:0 0 12px}
label{display:block;font-size:.82rem;font-weight:650;color:#4b5663;margin:0 0 5px}
input,select{width:100%;height:46px;padding:0 12px;border:1px solid #cfd5dc;border-radius:11px;font:inherit;font-size:16px;margin-bottom:12px}
button{min-height:46px;padding:0 16px;border:0;border-radius:11px;background:#a91f32;color:#fff;font:inherit;font-weight:700;width:100%}
button:disabled{opacity:.5}
#status{font-weight:700}.ok{color:#1d7f48}.bad{color:#9b1c2c}
pre{margin:8px 0 0;background:#f4f5f7;border-radius:10px;padding:10px;font-size:.82rem;max-height:240px;overflow:auto;white-space:pre-wrap}
table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #eee;text-align:left;font-size:.92rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>KlassenLive · Verbindungstest</h1>
<p class="sub">Schritt 0 für Live-Diktat: Es werden keine Daten gespeichert. Auf zwei Geräten öffnen, gleichen Code eingeben.</p>
<div class="card" id="setup">
  <label for="role">Rolle</label>
  <select id="role"><option value="teacher">Lehrer</option><option value="student">Schüler</option></select>
  <label for="code">Testcode (beliebig, z. B. TEST01)</label>
  <input id="code" value="TEST01" maxlength="12" autocapitalize="characters">
  <label for="name">Name (nur Schüler)</label>
  <input id="name" placeholder="Anna">
  <button id="go">Verbinden</button>
</div>
<div class="card" id="live" hidden>
  <p>Status: <span id="status">…</span></p>
  <p>Anwesend: <b id="count">0</b></p>
  <div id="tpanel" hidden>
    <button id="ping">Ping an alle Schüler senden</button>
    <table><thead><tr><th>Schüler</th><th>Hin und zurück</th></tr></thead><tbody id="rtt"></tbody></table>
  </div>
  <pre id="log"></pre>
</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const log=m=>{const l=$('log');l.textContent=new Date().toLocaleTimeString()+'  '+m+'\n'+l.textContent};
let db,ch,role,me;
if(!window.KL_CONFIG||!window.supabase){document.body.insertAdjacentHTML('afterbegin','<p class="bad" style="padding:14px">config.js fehlt.</p>')}
else db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);
$('role').onchange=()=>{$('name').disabled=$('role').value==='teacher'};
$('go').onclick=()=>{
  role=$('role').value;const code=$('code').value.trim().toUpperCase();
  me=role==='teacher'?'Lehrer':($('name').value.trim()||'Schüler-'+Math.random().toString(36).slice(2,5));
  if(!code)return;
  $('setup').hidden=true;$('live').hidden=false;$('tpanel').hidden=role!=='teacher';
  ch=db.channel('kl-ping-'+code,{config:{broadcast:{self:false},presence:{key:me+'-'+Math.random().toString(36).slice(2,6)}}});
  ch.on('broadcast',{event:'ping'},({payload})=>{
    if(role!=='student')return;
    log('Ping empfangen, antworte…');
    ch.send({type:'broadcast',event:'pong',payload:{t:payload.t,name:me}});
  });
  ch.on('broadcast',{event:'pong'},({payload})=>{
    if(role!=='teacher')return;
    const ms=Date.now()-payload.t;log(`Pong von ${payload.name}: ${ms} ms`);
    let row=[...$('rtt').children].find(r=>r.dataset.n===payload.name);
    if(!row){row=document.createElement('tr');row.dataset.n=payload.name;row.innerHTML='<td></td><td></td>';row.children[0].textContent=payload.name;$('rtt').append(row)}
    row.children[1].textContent=ms+' ms';
  });
  ch.on('presence',{event:'sync'},()=>{
    const st=ch.presenceState();$('count').textContent=Object.keys(st).length;
    log('Anwesend: '+Object.keys(st).map(k=>k.replace(/-\w{4}$/,'')).join(', '));
  });
  ch.subscribe(async status=>{
    const s=$('status');s.textContent=status;s.className=status==='SUBSCRIBED'?'ok':(status==='CHANNEL_ERROR'||status==='TIMED_OUT')?'bad':'';
    log('Kanal: '+status);
    if(status==='SUBSCRIBED')await ch.track({name:me,role});
  });
};
$('ping').onclick=async()=>{
  $('rtt').replaceChildren();
  const r=await ch.send({type:'broadcast',event:'ping',payload:{t:Date.now()}});
  log('Ping gesendet: '+r);
};
</script>
</body>
</html>
