<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a91f32">
<title>KlassenLive · Live-Diktat</title>
<link rel="stylesheet" href="../style.css">
<style>
.sub{color:var(--mut);font-weight:700;margin:0 0 16px}
#code{text-align:center;text-transform:uppercase;letter-spacing:.35em;font:900 1.8rem var(--font);color:var(--blue);border-color:var(--sky);margin-bottom:14px}
.field{margin-bottom:16px}
.joincard{margin:6px 0 0}
.room-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.room-top h2{margin:0;overflow-wrap:anywhere;font-size:1.3rem}
.codetag{flex:none;font:900 .9rem ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--blue-d);background:#fff;padding:5px 12px;border-radius:99px;box-shadow:0 2px 0 var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;font-size:.9rem;font-weight:800;margin:0 0 14px;background:#fff;box-shadow:0 2px 0 var(--shadow)}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.pill.wait{color:var(--warn)}.pill.ok{color:var(--ok-d)}.pill.off{background:var(--bad-l);color:var(--bad)}
.big{text-align:center;padding:38px 10px;color:var(--mut);font-weight:700}.big b{display:block;color:var(--navy);font-size:1.4rem;font-weight:900;margin-bottom:8px}
.big::before{content:"";display:block;width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle,var(--sky) 0 30%,#ffffff00 31%),radial-gradient(circle,#ffffff 0 62%,#ffffff00 63%);box-shadow:0 0 0 8px #ffffffa0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.75}}
#leave{margin-top:18px}
.qintro{margin:0 0 14px;color:var(--mut);font-weight:800}
.q{margin:0 0 18px}.qt{font-weight:900;font-size:1.15rem;color:var(--navy);margin:0 0 10px;overflow-wrap:anywhere;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:0 3px 0 var(--shadow)}
.opt{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) 24px;gap:12px;align-items:center;min-height:64px;padding:12px 14px;margin:0 0 12px;border-radius:18px;color:#fff;font:800 1.05rem var(--font);cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt input{position:absolute;opacity:0;pointer-events:none}
.q .opt:nth-of-type(1){background:#4d86ff;box-shadow:0 5px 0 var(--blue-d)}
.q .opt:nth-of-type(2){background:#2fa9f0;box-shadow:0 5px 0 #1778b8}
.q .opt:nth-of-type(3){background:var(--deep);box-shadow:0 5px 0 var(--deep-d)}
.q .opt:nth-of-type(4){background:var(--teal);box-shadow:0 5px 0 var(--teal-d)}
.opt .l{width:38px;height:38px;border-radius:12px;background:#ffffff38;display:grid;place-items:center;font-weight:900}
.opt:has(input:checked){outline:4px solid #fff;box-shadow:0 0 0 7px var(--blue),0 2px 0 7px #0003;transform:translateY(3px)}
.opt:has(input:disabled){cursor:default}
.q .opt.right{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
.q .opt.wrong{background:#e5566a;box-shadow:0 5px 0 #b13347}
.q .opt.right:has(input:checked),.q .opt.wrong:has(input:checked){outline:4px solid #fff;transform:none}
.opt .m{font-weight:900;font-size:1.3rem}
.score{margin:6px 0 14px;padding:16px;border-radius:20px;background:var(--ok);color:#fff;font-weight:900;font-size:1.25rem;text-align:center;box-shadow:0 5px 0 var(--ok-d)}
.sent{padding:14px;border-radius:16px;background:var(--ok-l);color:var(--ok-d);font-weight:900;text-align:center}
#qsubmit,#dikt .btn{background:var(--ok);box-shadow:0 5px 0 var(--ok-d)}
#qsubmit:active:not(:disabled),#dikt .btn:active:not(:disabled){box-shadow:0 1px 0 var(--ok-d)}
.audiobar{display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:12px 14px;border-radius:18px;background:var(--warn-l);color:var(--warn);font-size:.92rem;font-weight:800;box-shadow:0 3px 0 #f0e0b0}
.audiobar.on{background:var(--ok-l);color:var(--ok-d);box-shadow:0 3px 0 #b6e8d1}.audiobar span{flex:1}
.audiobar button{min-height:42px;padding:0 16px;border:0;border-radius:13px;background:var(--blue);color:#fff;font:900 .95rem var(--font);box-shadow:0 3px 0 var(--blue-d)}
.now{display:flex;align-items:center;gap:12px;margin:0 0 14px;padding:13px 16px;border-radius:18px;background:#fff;color:var(--blue-d);font-weight:900;box-shadow:0 3px 0 var(--shadow)}
.now::before{content:"";flex:none;width:22px;height:20px;background:linear-gradient(var(--blue),var(--blue)) 0 100%/5px 50% no-repeat,linear-gradient(var(--blue),var(--blue)) 8px 100%/5px 100% no-repeat,linear-gradient(var(--blue),var(--blue)) 16px 100%/5px 70% no-repeat;animation:eq 1s steps(3) infinite}
@keyframes eq{50%{transform:scaleY(.6);transform-origin:bottom}}
.dsent{display:flex;justify-content:space-between;font-weight:900;color:var(--navy);margin:0 0 6px}
.prog{margin:0 0 16px}
textarea{min-height:140px;border-color:var(--sky);background:#fff;font:800 1.2rem/1.45 var(--font);margin-bottom:14px;resize:vertical}
.tkbox{padding:16px;border-radius:18px;background:#fff;font:800 1.15rem/1.8 var(--font);margin-bottom:14px;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--shadow)}
.tk.bad{color:var(--bad);background:var(--bad-l);border-radius:7px;padding:1px 6px;text-decoration:underline wavy #ff6b7a}
.refbox{padding:16px;border-radius:18px;background:var(--ok-l);color:#145c40;font:800 1.15rem/1.7 var(--font);margin-bottom:14px}
.refbox .tk.bad{background:#fff2b8;color:#7a4b00;text-decoration:none}
.fbline{font-weight:900;margin:0 0 12px;padding:12px 14px;border-radius:16px}.fbline.ok{background:var(--ok-l);color:var(--ok-d)}.fbline.no{background:var(--bad-l);color:var(--bad)}
.ver{text-align:center;color:#8fa0c8;font-size:.75rem;padding:0 0 12px}
</style>
</head>
<body class="stage">
<div class="app">
  <header class="ah">
    <div class="brand"><span class="logo">K</span><span>KlassenLive</span></div>
    <span class="chip dark">Live-Diktat</span>
  </header>
  <div class="ab">
  <p id="error" hidden></p>

  <section id="join" class="card joincard">
    <h1>Los geht's!</h1><p class="sub">Gib den Code vom Bildschirm ein.</p>
    <form id="joinform" autocomplete="off">
      <input id="code" maxlength="6" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABC123" aria-label="Raumcode">
      <div class="field"><label for="name">Vor- und Nachname</label><input id="name" maxlength="60" autocomplete="name" placeholder="Anna Muster"></div>
      <button id="joinbtn" class="btn" type="submit">Beitreten</button>
    </form>
  </section>

  <section id="room" hidden>
    <div class="room-top"><h2 id="title">Live-Diktat</h2><span id="codetag" class="codetag"></span></div>
    <span id="pill" class="pill wait">Verbinde…</span>
    <div id="audiobar" class="audiobar" hidden><span id="abtxt"></span><button id="abbtn" type="button">Ton aktivieren</button></div>
    <div id="now" class="now" hidden></div>
    <div id="quiz" hidden></div>
    <div id="dikt" hidden></div>
    <div id="body" class="big"><b>Warten auf den Lehrer</b>Gleich geht es los. Lass diese Seite geöffnet.</div>
    <button id="leave" class="btn ghost" type="button">Raum verlassen</button>
  </section>
  </div>
  <p class="ver" id="ver">v3.5 · <span id="beat">–</span></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
const $=id=>document.getElementById(id);
const err=e=>{const m=e?.message||String(e||'');$('error').textContent=m;$('error').hidden=!m};
let db,ch=null,me=null,lastBeat=0,watch=null,joining=false;
if(!window.KL_CONFIG||!window.supabase)err('Konfiguration fehlt: config.js nicht gefunden.');
else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);
  const qc=(new URLSearchParams(location.search).get('code')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
  try{const s=JSON.parse(sessionStorage.getItem('dik_me')||'null');if(qc&&(!s||s.code!==qc)){sessionStorage.removeItem('dik_me');$('code').value=qc;setTimeout(()=>$('name').focus(),50)}else if(s){$('code').value=s.code;$('name').value=s.name;connect(s.code,s.name,s.id,s.at,true)}}catch(_){}}
$('code').addEventListener('input',()=>{$('code').value=$('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
$('joinform').onsubmit=e=>{e.preventDefault();if(joining||ch)return;
  const code=$('code').value.trim().toUpperCase(),name=$('name').value.trim();
  if(!/^[A-Z0-9]{6}$/.test(code)||!name){err('Bitte einen gültigen Raumcode und deinen Namen eingeben.');return}
  connect(code,name,Math.random().toString(36).slice(2,10),Date.now(),false)};

function setPill(cls,t){const p=$('pill');p.className='pill '+cls;p.textContent=t}
function showRoom(code){$('join').hidden=true;$('room').hidden=false;$('codetag').textContent=code}
function backToJoin(msg){
  clearInterval(watch);if(ch){const c=ch;ch=null;try{c.untrack()}catch(_){}db.removeChannel(c)}
  sessionStorage.removeItem('dik_me');try{sessionStorage.removeItem(qKey())}catch(_){}picks=[];submitted=false;curKey='';lastSentEpoch=null;pickQid=null;stopAudio();aud=null;audUrl='';unlocked=false;dk=null;dkKey='';showNow('');$('audiobar').hidden=true;me=null;joining=false;$('room').hidden=true;$('join').hidden=false;$('joinbtn').disabled=false;$('joinbtn').textContent='Beitreten';err(msg||'');
}
function teacherPresent(){return Object.values(ch.presenceState()).some(a=>a.some(m=>m.role==='teacher'))}
function duplicateName(){
  const mine=me,list=Object.entries(ch.presenceState()).flatMap(([k,a])=>a.filter(m=>m.role==='student').map(m=>({k,...m})));
  return list.some(m=>m.k!==mine.id&&m.name.toLowerCase()===mine.name.toLowerCase()&&(m.joined_at<mine.at||(m.joined_at===mine.at&&m.k<mine.id)))
}
let rcBusy=false,rcTries=0;
function startWatch(c){clearInterval(watch);watch=setInterval(()=>{if(ch!==c)return;const d=Date.now()-lastBeat;$('beat').textContent='Signal vor '+Math.round(d/1000)+' s';
  if(d>8000)try{c.send({type:'broadcast',event:'hello',payload:{}})}catch(_){}
  if(d>15000&&!document.hidden)softReconnect(true);
  else if(d>25000)setPill('off','Verbindung zum Lehrer unterbrochen')},3000)}
function softReconnect(force){
  if(!me||joining||rcBusy||$('room').hidden)return;
  if(!force&&Date.now()-lastBeat<10000)return;
  rcBusy=true;rcTries++;setPill('wait','Verbinde neu…');clearInterval(watch);
  if(ch){const c=ch;ch=null;try{c.untrack()}catch(_){}try{db.removeChannel(c)}catch(_){}}
  connect(me.code,me.name,me.id,me.at,true,0,true);
  setTimeout(()=>{if(rcBusy){rcBusy=false;if(ch){const c=ch;ch=null;try{db.removeChannel(c)}catch(_){}}softReconnect(true)}},9000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(softReconnect,400)});
window.addEventListener('pageshow',()=>setTimeout(softReconnect,400));
window.addEventListener('online',()=>softReconnect(true));
function connect(code,name,id,at,resume,try_,soft){try_=try_||0;
  if(!soft){joining=true;err('');$('joinbtn').disabled=true;$('joinbtn').textContent='Verbinde…'}
  me={code,name,id,at};
  const c=db.channel('kl-dik-'+code,{config:{broadcast:{self:false},presence:{key:id}}});ch=c;
  let checked=false;
  c.on('broadcast',{event:'state'},({payload})=>{lastBeat=Date.now();render(payload)});
  c.on('broadcast',{event:'play'},({payload})=>{lastBeat=Date.now();onPlay(payload)});
  c.on('broadcast',{event:'stop'},()=>{lastBeat=Date.now();showNow('');stopAudio()});
  c.on('broadcast',{event:'idle'},()=>{lastBeat=Date.now();showNow('')});
  c.on('broadcast',{event:'fb'},({payload})=>{lastBeat=Date.now();onFb(payload)});
  c.on('broadcast',{event:'end'},()=>backToJoin('Der Lehrer hat die Sitzung beendet.'));
  const verify=()=>{
    if(!ch||ch!==c||checked)return;checked=true;
    if(soft){rcBusy=false;rcTries=0;c.send({type:'broadcast',event:'hello',payload:{}});lastBeat=Date.now();startWatch(c);return}
    if(!teacherPresent()){backToJoin('Kein Raum mit diesem Code gefunden. Bitte Code prüfen.');return}
    if(duplicateName()){backToJoin('Dieser Name ist im Raum schon vergeben. Bitte anderen Namen eingeben (z. B. mit Nachname).');return}
    sessionStorage.setItem('dik_me',JSON.stringify(me));showRoom(code);joining=false;
    c.send({type:'broadcast',event:'hello',payload:{}});
    lastBeat=Date.now();startWatch(c);
  };
  c.subscribe(async st=>{
    if(st==='SUBSCRIBED'){await c.track({role:'student',name,joined_at:at});setTimeout(verify,1200)}
    else if((st==='CHANNEL_ERROR'||st==='TIMED_OUT')&&!checked){
      if(soft){if(ch===c){ch=null;try{c.untrack()}catch(_){}try{db.removeChannel(c)}catch(_){}rcBusy=false;setPill('wait','Verbinde neu…');setTimeout(softReconnect,3000,true)}}
      else if(try_<3&&ch===c){ch=null;try{c.untrack()}catch(_){}db.removeChannel(c);setTimeout(()=>{if(!ch&&me&&me.id===id)connect(code,name,id,at,resume,try_+1)},1500+try_*1000)}
      else backToJoin('Verbindung fehlgeschlagen ('+st+'). Bitte erneut versuchen.')}
  });
  if(!soft)setTimeout(()=>{if(joining&&ch===c&&!checked)backToJoin('Verbindung zum Raum nicht möglich. Bitte Code prüfen.')},8000);
}
const LET='ABCD';
let picks=[],submitted=false,curKey='',lastSentEpoch=null,lastState=null,pickQid=null;
const qKey=()=>'dik_q_'+(me?.code||'');
function loadPicks(n,qid){
  try{const s=JSON.parse(sessionStorage.getItem(qKey())||'null');
    if(s&&s.qid===qid&&Array.isArray(s.picks)&&s.picks.length===n){picks=s.picks;submitted=!!s.submitted;pickQid=qid;return}}catch(_){}
  picks=new Array(n).fill(null);submitted=false;pickQid=qid;
}
function savePicks(){try{sessionStorage.setItem(qKey(),JSON.stringify({qid:pickQid,picks,submitted}))}catch(_){}}
function sendAnswer(){if(ch)ch.send({type:'broadcast',event:'answer',payload:{id:me.id,name:me.name,picks}})}
function mk(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!=null)n.textContent=txt;return n}
function render(s){
  lastState=s;$('title').textContent=s.title||'Live-Diktat';
  const showQuiz=(s.phase==='quiz'||s.phase==='quizResult')&&Array.isArray(s.quiz);
  const showDik=s.phase==='dikt';
  $('quiz').hidden=!showQuiz;$('dikt').hidden=!showDik;$('body').hidden=showQuiz||showDik;
  audioSetup(s.audio);
  if(s.phase==='lobby'){setPill('wait','Warten auf den Start');$('body').innerHTML='<b>Du bist im Raum</b>Der Lehrer startet gleich. Lass diese Seite geöffnet.'}
  else if(s.phase==='listen'){setPill('ok','Zuhören');$('body').innerHTML='<b>Bitte gut zuhören</b>Der Lehrer spielt den Text ab. Du musst noch nichts tun.'}
  else if(s.phase==='final'){setPill('ok','Zuhören');$('body').innerHTML='<b>Zum Abschluss: Bitte noch einmal zuhören</b>Der Lehrer spielt den ganzen Text noch einmal ab.'}
  else if(showDik){renderDikt(s)}
  else if(showQuiz){renderQuiz(s)}
  else{setPill('ok','Verbunden');$('body').innerHTML='<b>Bitte warten</b>'}
}
function renderQuiz(s){
  if(pickQid!==s.qid||picks.length!==s.quiz.length)loadPicks(s.quiz.length,s.qid);
  if(submitted&&lastSentEpoch!==s.epoch){lastSentEpoch=s.epoch;sendAnswer()} // Lehrer neu geladen: Antwort erneut senden
  const res=s.phase==='quizResult',key=s.phase+'|'+s.qid+'|'+submitted;
  if(key===curKey)return;curKey=key;
  setPill('ok',res?'Auflösung':'Fragen');
  const box=$('quiz');box.replaceChildren();
  box.append(mk('p','qintro',res?'So hast du geantwortet:':'Was ist die Hauptidee? Wähle pro Frage eine Antwort.'));
  s.quiz.forEach((q,i)=>{
    const card=mk('div','q');card.append(mk('p','qt',`${i+1}. ${q.q}`));
    q.o.forEach((txt,j)=>{
      const lab=mk('label','opt');const inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=j;
      inp.checked=picks[i]===j;inp.disabled=submitted||res;
      inp.onchange=()=>{picks[i]=j;savePicks();upd()};
      lab.append(inp,mk('span','l',LET[j]),mk('span',null,txt));
      const mark=mk('span','m','');
      if(res){if(s.correct[i]===j){lab.classList.add('right');mark.textContent='✓'}else if(picks[i]===j){lab.classList.add('wrong');mark.textContent='✗'}}
      lab.append(mark);card.append(lab);
    });
    box.append(card);
  });
  if(res){
    const any=picks.some(x=>x!==null);
    if(any){let n=0;s.quiz.forEach((_,i)=>{if(picks[i]===s.correct[i])n++});box.append(mk('div','score',`Du hast ${n} von ${s.quiz.length} richtig.`))}
    box.append(mk('p','qintro','Gleich geht es weiter. Lass diese Seite geöffnet.'));
  }else if(submitted){box.append(mk('div','sent','Abgegeben ✓ Warte auf die Auflösung.'))}
  else{
    const b=mk('button','btn','Abgeben');b.id='qsubmit';b.type='button';b.disabled=!picks.every(x=>x!==null);
    b.onclick=()=>{if(!picks.every(x=>x!==null))return;submitted=true;savePicks();lastSentEpoch=lastState.epoch;sendAnswer();curKey='';renderQuiz(lastState)};
    box.append(b);
  }
  function upd(){const b=$('qsubmit');if(b)b.disabled=!picks.every(x=>x!==null)}
}

/* ---- Ton auf dem eigenen Handy (für Online-Unterricht) ---- */
let aud=null,audUrl='',unlocked=false,audReady=false,audOn=false,playTok=0;
function mmss(){return ''}
function audioSetup(a){
  const bar=$('audiobar');
  if(!a||!a.on||!a.url){audOn=false;bar.hidden=true;return}
  audOn=true;bar.hidden=false;
  if(!aud||audUrl!==a.url){stopAudio();audUrl=a.url;audReady=false;unlocked=false;aud=new Audio();aud.preload='auto';
    aud.addEventListener('loadedmetadata',()=>{audReady=true;abUpd()});aud.addEventListener('error',()=>{audReady=false;$('abtxt').textContent='Audio konnte nicht geladen werden. Bitte mit dem Lehrer-Ton zuhören.';$('abbtn').hidden=true});
    aud.dataset.u=a.url;aud.src=a.url;aud.load()}
  abUpd();
}
function abUpd(){
  const bar=$('audiobar'),t=$('abtxt'),b=$('abbtn');
  bar.classList.toggle('on',unlocked);
  if(unlocked){t.textContent=audReady?'🔊 Ton ist aktiv – du hörst den Text hier auf deinem Handy.':'Ton wird geladen…';b.hidden=true}
  else{t.textContent='Online? Aktiviere den Ton, um den Text hier zu hören.';b.hidden=false}
}
$('abbtn').onclick=()=>{
  if(!aud)return;aud.muted=true;
  const p=aud.play();
  const fin=()=>{try{aud.pause()}catch(_){};aud.muted=false;unlocked=true;abUpd()};
  if(p&&p.then)p.then(fin,()=>{aud.muted=false;$('abtxt').textContent='Ton konnte nicht aktiviert werden. Bitte erneut tippen.'});else fin();
};
function stopAudio(){playTok++;if(aud){try{aud.pause()}catch(_){}}}
function showNow(t){const n=$('now');n.textContent=t?'▶ '+t:'';n.hidden=!t}
function onPlay(p){
  if(!p)return;showNow(p.info||'');
  if(!audOn||!unlocked||!aud)return;
  const url=p.src||audUrl;stopAudio();const tk=playTok;
  const go=()=>{if(tk!==playTok)return;try{aud.currentTime=p.from}catch(_){}aud.muted=false;const pr=aud.play();if(pr&&pr.catch)pr.catch(()=>{});
    const iv=setInterval(()=>{if(tk!==playTok){clearInterval(iv);return}if(aud.currentTime>=p.to-0.04||aud.ended){clearInterval(iv);try{aud.pause()}catch(_){}}},40)};
  if(aud.dataset.u===url&&audReady)go();
  else{audReady=false;aud.dataset.u=url;aud.src=url;aud.load();aud.addEventListener('loadedmetadata',go,{once:true})}
}

/* ---- Diktat: Satz schreiben, abgeben, Rückmeldung ---- */
const nrm=s=>s.replace(/[’‘`´]/g,"'");
const WORD=/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*/gu;
const tok=s=>(nrm(s).match(WORD)||[]).map(t=>({t,k:t.toLowerCase()}));
function diff(ref,usr){const a=tok(ref),b=tok(usr),n=a.length,m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i].k===b[j].k?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const R=a.map(x=>({t:x.t,ok:false})),U=b.map(x=>({t:x.t,ok:false}));let i=0,j=0;
  while(i<n&&j<m){if(a[i].k===b[j].k){R[i].ok=U[j].ok=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  return{R,U}}
const gap=n=>n&&/^[\p{L}\p{N}"(]/u.test(n.t)?' ':'';
let dk=null,dkKey='',dkSentEpoch=null;
const dKey=()=>'dik_s_'+(me?.code||'');
function dkLoad(i){
  try{const s=JSON.parse(sessionStorage.getItem(dKey())||'null');if(s&&s.i===i){dk=s;return}}catch(_){}
  dk={i,text:'',submitted:false,fb:null};
}
function dkSave(){try{sessionStorage.setItem(dKey(),JSON.stringify(dk))}catch(_){}}
function dkSend(){if(ch&&dk)ch.send({type:'broadcast',event:'sentence',payload:{id:me.id,name:me.name,i:dk.i,text:dk.text}})}
function onFb(p){if(!p||p.to!==me?.id||!dk||p.i!==dk.i)return;dk.fb={marks:p.marks,missing:p.missing};dkSave();dkDraw()}
function renderDikt(s){
  if(!dk||dk.i!==s.i)dkLoad(s.i);
  if(dk.submitted&&dkSentEpoch!==s.epoch){dkSentEpoch=s.epoch;dkSend()}
  setPill('ok','Diktat');dkLast=s;dkDraw();
}
let dkLast=null;
function dkDraw(){
  const s=dkLast;if(!s||s.phase!=='dikt'||!dk)return;
  const rev=!!s.rev,key=[s.i,rev,dk.submitted,dk.fb?dk.fb.missing+'/'+dk.fb.marks.length:'-'].join('|');
  if(key===dkKey)return;dkKey=key;
  const box=$('dikt');box.replaceChildren();
  box.append(mk('p','dsent',`Satz ${s.i+1} von ${s.sentences}`));{const pr=mk('div','prog'),bar=document.createElement('i');bar.style.width=Math.round((s.i+1)/s.sentences*100)+'%';pr.append(bar);box.append(pr)}
  if(!dk.submitted&&!rev){
    const ta=document.createElement('textarea');ta.value=dk.text;ta.placeholder='Schreibe, was du hörst…';ta.setAttribute('autocapitalize','sentences');ta.setAttribute('autocorrect','off');ta.spellcheck=false;
    const b=mk('button','btn','Abgeben');b.type='button';b.disabled=!dk.text.trim();
    ta.oninput=()=>{dk.text=ta.value;dkSave();b.disabled=!ta.value.trim()};
    b.onclick=()=>{if(!dk.text.trim())return;dk.submitted=true;dkSave();dkSentEpoch=lastState.epoch;dkSend();dkKey='';dkDraw()};
    box.append(ta,b);return;
  }
  if(!dk.submitted&&rev){box.append(mk('div','sent','Der Lehrer zeigt die richtige Lösung.'))}
  if(dk.submitted){
    const t=mk('div','tkbox');
    if(dk.fb){dk.fb.marks.forEach((m,k,arr)=>t.append(mk('span','tk'+(m.ok?'':' bad'),m.t+gap(arr[k+1]))));
      box.append(mk('p','fbline '+(dk.fb.missing===0&&dk.fb.marks.every(m=>m.ok)?'ok':'no'),dk.fb.missing===0&&dk.fb.marks.every(m=>m.ok)?'Alles richtig! ✓':(dk.fb.missing>0?`${dk.fb.missing} ${dk.fb.missing===1?'Wort fehlt':'Wörter fehlen'} oder ${dk.fb.missing===1?'ist':'sind'} falsch`:'Rot markierte Wörter sind falsch')))}
    else{t.textContent=dk.text}
    box.append(t);
    if(!dk.fb)box.append(mk('div','sent','Abgegeben ✓ Wird geprüft…'));
  }
  if(rev&&s.ref){
    const d=diff(s.ref,dk.text||'');box.append(mk('p','qintro','Richtig ist:'));
    const r=mk('div','refbox');let pos=0,wi=0;const ref=s.ref;nrm(ref).replace(WORD,(w,idx)=>{if(idx>pos)r.append(document.createTextNode(ref.slice(pos,idx)));const bad=dk.text.trim()&&d.R[wi]&&!d.R[wi].ok;r.append(mk('span','tk'+(bad?' bad':''),ref.slice(idx,idx+w.length)));pos=idx+w.length;wi++;return w});if(pos<ref.length)r.append(document.createTextNode(ref.slice(pos)));box.append(r);
  }else if(dk.submitted&&dk.fb)box.append(mk('p','qintro','Warte, bis der Lehrer die Lösung zeigt.'));
}
$('leave').onclick=()=>{if(confirm('Raum wirklich verlassen?'))backToJoin('')};
</script>
