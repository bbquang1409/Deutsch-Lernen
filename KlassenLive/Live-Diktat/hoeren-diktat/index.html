<style>
/* ============ Hören & Diktat · Modul ============
   Alle Stile hängen unter .hd (Namespace), Farben sind CSS-Variablen -> leicht in andere Module einbettbar. */
:root{color-scheme:light dark}
.hd{
  --hd-bg:#f6f4ff;--hd-card:#ffffff;--hd-ink:#1d1b3a;--hd-muted:#6b6890;--hd-line:#e6e2fb;
  --hd-brand:#6c5ce7;--hd-brand2:#8e7cff;--hd-mint:#00c9a7;--hd-pink:#ff5d8f;--hd-sun:#ffc24b;
  --hd-ok:#12b886;--hd-okbg:#d9f7ec;--hd-bad:#f03e5f;--hd-badbg:#ffe3ea;
  --hd-shadow:0 10px 30px -12px rgba(76,56,190,.28);--hd-r:20px;--hd-display:var(--hd-font-d,"Baloo 2","Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif);
  font-family:var(--hd-font,"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);zoom:var(--hd-scale,1);color:var(--hd-ink);background:var(--hd-bg);
  min-height:100vh;min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd{
  --hd-bg:#14122b;--hd-card:#1f1c3d;--hd-ink:#f1efff;--hd-muted:#a8a3d6;--hd-line:#322e60;
  --hd-okbg:#0f3b32;--hd-badbg:#4a1b2a;--hd-shadow:0 10px 30px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"] .hd{--hd-bg:#14122b;--hd-card:#1f1c3d;--hd-ink:#f1efff;--hd-muted:#a8a3d6;--hd-line:#322e60;--hd-okbg:#0f3b32;--hd-badbg:#4a1b2a;--hd-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.hd *{box-sizing:border-box}
.hd h1,.hd h2,.hd h3{font-family:var(--hd-display);margin:0;line-height:1.15;letter-spacing:.2px}
.hd button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.hd button:focus-visible,.hd textarea:focus-visible,.hd input:focus-visible,.hd select:focus-visible{outline:3px solid var(--hd-brand2);outline-offset:2px}
.hd-wrap{max-width:980px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
/* Kopf */
.hd-top{background:linear-gradient(135deg,#6c5ce7 0%,#8e7cff 55%,#ff5d8f 130%);color:#fff;padding:22px 0 64px;position:relative;overflow:hidden}
.hd-top::before,.hd-top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hd-top::before{width:220px;height:220px;right:-60px;top:-80px}.hd-top::after{width:120px;height:120px;left:-30px;bottom:-50px}
.hd-top .hd-wrap{position:relative;z-index:1}
.hd-bar{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hd-logo{display:flex;align-items:center;gap:10px;font-family:var(--hd-display);font-weight:800;font-size:1.35rem}
.hd-logo i{font-style:normal;background:#fff;color:var(--hd-brand);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.25rem;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.hd-iconbtn{background:rgba(255,255,255,.18);border-radius:12px;min-width:40px;height:40px;padding:0 12px;color:#fff;font-weight:700}
.hd-iconbtn:hover{background:rgba(255,255,255,.3)}
.hd-hero{margin-top:22px}.hd-hero h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:800}.hd-hero p{margin:6px 0 0;opacity:.92;max-width:560px}
.hd-main{margin-top:-40px;position:relative;z-index:2}
/* Karten */
.hd-card{background:var(--hd-card);border-radius:var(--hd-r);box-shadow:var(--hd-shadow);padding:20px}
.hd-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.hd-stat{background:var(--hd-card);border-radius:16px;padding:12px 14px;box-shadow:var(--hd-shadow);text-align:center}
.hd-stat b{display:block;font-family:var(--hd-display);font-size:1.6rem;line-height:1.1;color:var(--hd-brand)}.hd-stat span{font-size:.78rem;color:var(--hd-muted);font-weight:700}
.hd-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 14px}
.hd-chip{padding:8px 14px;border-radius:999px;background:var(--hd-card);border:2px solid var(--hd-line);font-weight:700;font-size:.9rem;transition:.15s}
.hd-chip:hover{border-color:var(--hd-brand2)}.hd-chip[aria-pressed="true"]{background:var(--hd-brand);border-color:var(--hd-brand);color:#fff}
.hd-search{flex:1;min-width:150px;padding:9px 14px;border-radius:999px;border:2px solid var(--hd-line);background:var(--hd-card);color:var(--hd-ink);font:inherit}
.hd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.hd-lesson{text-align:left;background:var(--hd-card);border-radius:var(--hd-r);padding:16px;box-shadow:var(--hd-shadow);display:flex;flex-direction:column;gap:10px;border:2px solid transparent;transition:transform .15s,border-color .15s;position:relative}
.hd-lesson:hover{transform:translateY(-3px);border-color:var(--hd-brand2)}
.hd-lesson h3{font-size:1.15rem}
.hd-emoji{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:var(--c,#efeaff)}
.hd-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hd-tag{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--hd-brand);background:color-mix(in srgb,var(--hd-brand) 12%,transparent);padding:3px 9px;border-radius:999px}
.hd-meta{font-size:.82rem;color:var(--hd-muted);font-weight:600}
.hd-badge{position:absolute;top:12px;right:12px;font-size:.78rem;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--hd-okbg);color:var(--hd-ok)}
/* Lektion */
.hd-lhead{display:flex;align-items:center;gap:12px}
.hd-lhead{min-width:0}.hd-lhead .hd-logo{font-size:1.15rem;min-width:0}.hd-back{flex:none;white-space:nowrap;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;height:40px;padding:0 14px;font-weight:800}
.hd-back:hover{background:rgba(255,255,255,.32)}
.hd-steps{display:flex;gap:8px;margin-top:18px}
.hd-step{flex:1;text-align:center;font-size:.8rem;font-weight:800;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.16);color:#fff;opacity:.8}
.hd-step.on{background:#fff;color:var(--hd-brand);opacity:1;box-shadow:0 6px 14px rgba(0,0,0,.16)}
.hd-step.done{opacity:1;background:rgba(255,255,255,.34)}
.hd h2{font-size:1.5rem}
.hd-sub{color:var(--hd-muted);margin:4px 0 16px}
.hd-big{display:flex;flex-direction:column;align-items:center;gap:16px;padding:12px 0}
.hd-play{width:116px;height:116px;border-radius:50%;background:linear-gradient(135deg,var(--hd-brand),var(--hd-pink));color:#fff;font-size:2.6rem;display:grid;place-items:center;box-shadow:0 16px 34px -10px rgba(108,92,231,.7);transition:transform .15s}
.hd-play:hover{transform:scale(1.05)}.hd-play:active{transform:scale(.96)}
.hd-play.live{animation:hdpulse 1.6s infinite}
@keyframes hdpulse{0%{box-shadow:0 0 0 0 rgba(255,93,143,.5),0 16px 34px -10px rgba(108,92,231,.7)}70%{box-shadow:0 0 0 22px rgba(255,93,143,0),0 16px 34px -10px rgba(108,92,231,.7)}100%{box-shadow:0 0 0 0 rgba(255,93,143,0)}}
.hd-eq{display:flex;gap:4px;align-items:flex-end;height:28px}.hd-eq b{width:5px;background:var(--hd-mint);border-radius:3px;height:6px}
.hd-eq.live b{animation:hdeq .9s ease-in-out infinite}.hd-eq.live b:nth-child(2){animation-delay:.15s}.hd-eq.live b:nth-child(3){animation-delay:.3s}.hd-eq.live b:nth-child(4){animation-delay:.45s}.hd-eq.live b:nth-child(5){animation-delay:.6s}
@keyframes hdeq{0%,100%{height:6px}50%{height:28px}}
.hd-dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:420px}
.hd-dot{width:14px;height:14px;border-radius:50%;background:var(--hd-line);transition:.2s}.hd-dot.on{background:var(--hd-pink);transform:scale(1.3)}.hd-dot.done{background:var(--hd-mint)}
.hd-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:800;background:var(--hd-brand);color:#fff;box-shadow:0 8px 18px -8px rgba(108,92,231,.8);transition:transform .12s,filter .12s}
.hd-btn:hover{filter:brightness(1.08)}.hd-btn:active{transform:translateY(1px)}
.hd-btn.ghost{background:transparent;color:var(--hd-brand);box-shadow:none;border:2px solid var(--hd-line)}
.hd-btn.mint{background:var(--hd-mint);box-shadow:0 8px 18px -8px rgba(0,201,167,.8);color:#04382f}
.hd-btn.sun{background:var(--hd-sun);color:#4a3200;box-shadow:0 8px 18px -8px rgba(255,194,75,.9)}
.hd-btn[disabled]{opacity:.45;cursor:not-allowed}
.hd-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.hd-note{background:color-mix(in srgb,var(--hd-sun) 22%,transparent);border-radius:14px;padding:10px 14px;font-size:.9rem;font-weight:600}
/* Quiz */
.hd-qn{font-size:.85rem;font-weight:800;color:var(--hd-brand);margin-bottom:6px}
.hd-q{font-family:var(--hd-display);font-weight:700;font-size:1.35rem;margin-bottom:14px}
.hd-opts{display:grid;gap:10px}
.hd-opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:2px solid var(--hd-line);background:var(--hd-card);font-weight:700;transition:.15s}
.hd-opt:hover:not([disabled]){border-color:var(--hd-brand2);transform:translateX(3px)}
.hd-opt b{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--hd-brand) 14%,transparent);color:var(--hd-brand);font-family:"Baloo 2"}
.hd-opt.ok{border-color:var(--hd-ok);background:var(--hd-okbg)}.hd-opt.ok b{background:var(--hd-ok);color:#fff}
.hd-opt.no{border-color:var(--hd-bad);background:var(--hd-badbg)}.hd-opt.no b{background:var(--hd-bad);color:#fff}
.hd-opt[disabled]{cursor:default}
.hd-score{font-family:var(--hd-display);font-size:3.4rem;font-weight:800;line-height:1;background:linear-gradient(135deg,var(--hd-brand),var(--hd-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
/* Diktat */
.hd-prog{height:10px;background:var(--hd-line);border-radius:99px;overflow:hidden;margin:6px 0 16px}.hd-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--hd-mint),var(--hd-brand));border-radius:99px;transition:width .3s}
.hd-audio{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hd-aud{display:inline-flex;gap:8px;align-items:center;padding:11px 16px;border-radius:14px;font-weight:800;background:color-mix(in srgb,var(--hd-brand) 12%,transparent);color:var(--hd-brand);transition:.15s}
.hd-aud:hover{background:color-mix(in srgb,var(--hd-brand) 22%,transparent)}.hd-aud.live{background:var(--hd-brand);color:#fff}
.hd-aud.slow{background:color-mix(in srgb,var(--hd-mint) 18%,transparent);color:#067a65}.hd-aud.slow.live{background:var(--hd-mint);color:#04382f}
.hd-text{width:100%;min-height:130px;margin-top:14px;padding:14px 16px;border-radius:16px;border:2px solid var(--hd-line);background:var(--hd-bg);color:var(--hd-ink);font:inherit;font-size:1.1rem;line-height:1.6;resize:vertical}
.hd-text:focus{border-color:var(--hd-brand2);outline:none}
.hd-peek{margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--hd-sun) 22%,transparent);font-size:1.05rem;font-weight:600}
.hd-res{margin-top:16px;display:grid;gap:12px}
.hd-line{padding:12px 14px;border-radius:14px;background:var(--hd-bg);font-size:1.08rem;line-height:2}
.hd-line small{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--hd-muted);line-height:1.4;margin-bottom:2px}
.hd-w{padding:1px 5px;border-radius:7px;margin-right:3px;white-space:pre-wrap}.hd-w.p{margin-right:0;padding:1px 2px}
.hd-w.ok{background:var(--hd-okbg);color:var(--hd-ok)}.hd-w.bad{background:var(--hd-badbg);color:var(--hd-bad);font-weight:800}
.hd-w.extra{background:var(--hd-badbg);color:var(--hd-bad);text-decoration:line-through}
.hd-pct{display:inline-flex;align-items:center;gap:8px;font-family:var(--hd-display);font-size:1.4rem;font-weight:800}
.hd-pill{padding:2px 10px;border-radius:99px;font-size:.9rem;color:#fff;background:var(--hd-ok)}.hd-pill.mid{background:var(--hd-sun);color:#4a3200}.hd-pill.low{background:var(--hd-pink)}
.hd-sum{display:grid;gap:8px;margin-top:12px}.hd-sumrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--hd-bg)}
.hd-sumrow span:first-child{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:var(--hd-line)}
.hd-sumrow em{flex:1;font-style:normal;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Neue Lektion */
.hd-admin{margin-top:26px}.hd-admin summary{cursor:pointer;font-weight:800;color:var(--hd-brand)}
.hd-field{display:grid;gap:6px;margin:12px 0}.hd-field label{font-weight:800;font-size:.85rem}
.hd-field input,.hd-field select,.hd-field textarea{padding:10px 12px;border-radius:12px;border:2px solid var(--hd-line);background:var(--hd-bg);color:var(--hd-ink);font:inherit}
.hd-code{white-space:pre-wrap;word-break:break-word;background:#15122f;color:#d8d4ff;padding:14px;border-radius:14px;font:.78rem/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:260px;overflow:auto}
.hd-bar{position:relative}.hd-setpanel{position:fixed;right:16px;top:64px;z-index:40;width:min(300px,92vw);background:var(--hd-card);color:var(--hd-ink);border-radius:18px;padding:6px 16px 14px;box-shadow:0 20px 50px -10px rgba(0,0,0,.4)}.hd-setpanel .hd-field{margin:10px 0}.hd-setpanel input[type=color]{height:40px;width:100%;padding:2px}
.hd-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d1b3a;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.hd-pop{animation:hdpop .35s ease}@keyframes hdpop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  .hd-top{padding-bottom:56px}.hd-card{padding:16px}.hd-play{width:96px;height:96px}
  .hd-step{font-size:.68rem;padding:8px 2px}.hd-stats{gap:8px}.hd-stat b{font-size:1.35rem}
  .hd-actions .hd-btn{flex:1 1 140px}
}
@media (prefers-reduced-motion:reduce){.hd *{animation:none!important;transition:none!important}}
</style>

<body>
<div id="hd-root"></div>
<script src="assets/lessons.js"></script>
<script>
/* ============ Hören & Diktat · Modul ============
   Einbinden in andere Module:
     <div id="mein-ziel"></div>
     HoerenDiktat.mount(document.getElementById('mein-ziel'), {
        lessons: window.HD_LESSONS,          // Lektionsdaten (assets/lessons.js)
        onEvent: (name, data) => {...}       // 'quiz:done' | 'diktat:done' | 'lesson:done'
     });
   Alleinstehend startet das Modul automatisch in #hd-root. */
(function(){
"use strict";
const $=(s,r=document)=>r.querySelector(s);
function h(tag,attrs,...kids){const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];if(v==null||v===false)continue;
    if(k==="class")e.className=v;else if(k==="on")for(const ev in v)e.addEventListener(ev,v[ev]);
    else if(k==="text")e.textContent=v;else if(k in e&&k!=="list"&&k!=="style")e[k]=v;else e.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(c));return e}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const TAGS={Geschichte:["📖","#efe7ff"],Alltag:["🛒","#ffe9d6"],Brief:["✉️","#dff6ff"],Jahreszeiten:["🍂","#fff3cf"]};
const store={get(){try{return JSON.parse(localStorage.getItem("hd.progress.v1")||"{}")}catch(e){return{}}},
  set(o){try{localStorage.setItem("hd.progress.v1",JSON.stringify(o))}catch(e){}}};
function toast(t){const e=h("div",{class:"hd-toast",role:"status",text:t});document.body.append(e);setTimeout(()=>e.remove(),2200)}

/* ---------- Audio: Abschnitte aus einer Datei abspielen ---------- */
class Player{
  constructor(){this.a=new Audio();this.a.preload="auto";this.tok=0;this.src=""}
  load(src){if(this.src===src)return;this.src=src;const a=this.a;a.src=src;a.load();this.ready=Promise.resolve();
    /* Manche einfache Server (z. B. python -m http.server) unterstützen keine Range-Anfragen -> Springen im Audio würde scheitern.
       Darum bei http(s) die Datei einmal als Blob laden (danach sind Zeitsprünge immer exakt). */
    if(/^https?:/.test(location.protocol)&&!/^blob:/.test(src)){this.ready=fetch(src).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{if(this.src===src){a.src=URL.createObjectURL(b)}}).catch(()=>{})}}
  stop(){this.tok++;this.a.pause()}
  _seek(t){return new Promise(res=>{const a=this.a;const done=()=>{a.removeEventListener("seeked",done);res()};
    a.addEventListener("seeked",done);a.currentTime=t;setTimeout(done,1500)})}
  async range(s,e){const my=++this.tok,a=this.a;await this.ready;if(my!==this.tok)return false;await this._seek(s);if(my!==this.tok)return false;
    try{await a.play()}catch(err){return false}
    return new Promise(res=>{const tick=()=>{if(my!==this.tok){res(false);return}
      if(a.currentTime>=e-.03||a.ended){a.pause();res(true);return}requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
}

/* ---------- Diktat-Vergleich (Wörter + Satzzeichen getrennt) ---------- */
const nq=s=>s.replace(/[„“”"»«‚‘’']/g,'"').replace(/…/g,"...").replace(/[–—]/g,"-");
const tok=s=>(nq(s).match(/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*|\.\.\.|[^\s\p{L}\p{N}]/gu)||[]);
const isP=t=>!/[\p{L}\p{N}]/u.test(t);
function diff(ref,usr){const a=tok(ref),b=tok(usr),n=a.length,m=b.length;
  const L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const R=a.map(t=>({t,ok:false})),U=b.map(t=>({t,ok:false}));let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){R[i].ok=U[j].ok=true;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}
  const good=R.filter(x=>x.ok).length;return{R,U,pct:n?Math.round(good/n*100):0,refRaw:tok(ref)}}
function renderTokens(arr,okCls,badCls){const f=document.createDocumentFragment();
  arr.forEach(x=>f.append(h("span",{class:"hd-w "+(x.ok?"ok":badCls)+(isP(x.t)?" p":""),text:x.t})," "));return f}

/* ---------- Automatische Abschnittserkennung (für neue Lektionen) ---------- */
async function detectBlocks(file){
  const buf=await file.arrayBuffer();const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const au=await ctx.decodeAudioData(buf);await ctx.close();
  const d=au.getChannelData(0),sr=au.sampleRate,fr=Math.round(sr*.02),n=Math.floor(d.length/fr);
  const low=new Uint8Array(n);for(let i=0;i<n;i++){let s=0;for(let k=0;k<fr;k++){const v=d[i*fr+k];s+=v*v}low[i]=20*Math.log10(Math.sqrt(s/fr)+1e-9)<-50?1:0}
  const runs=[];for(let i=0;i<n;){if(low[i]){let j=i;while(j<n&&low[j])j++;runs.push([i*.02,j*.02]);i=j}else i++}
  const gaps=runs.filter(r=>r[1]-r[0]>=1.2&&r[0]>.05),ends=gaps.filter(r=>{const l=r[1]-r[0];return l>=2.9&&l<=3.6});
  const out=[];let start=.3;for(const e of ends){const inner=gaps.find(g=>g[0]>start&&g[0]<e[0]);

      h("div",{class:"hd-field"},h("label",{text:"Audio-Datei (.mp3, liegt später in assets/audio/)"}),f.file),h("div",{class:"hd-field"},h("label",{text:"Text (Zeile = Abschnitt)"}),f.txt),h("div",{class:"hd-field"},h("label",{text:"Fragen (optional, JSON)"}),f.qs),
      h("div",{class:"hd-row"},run,prompt,saveBtn,tryBtn,copyBtn),info,code)}

  /* Start */
  applySettings();window.addEventListener("pagehide",stopAll);
  const q=new URLSearchParams(location.search).get("lesson");
  if(opts.startLessonId||q)openLesson(opts.startLessonId||q);else viewList();
  return{destroy(){stopAll();root.replaceChildren()},open:openLesson,list:viewList,get lessons(){return LESSONS}}
}
window.HoerenDiktat={mount};
document.addEventListener("DOMContentLoaded",()=>{const r=document.getElementById("hd-root");if(r&&window.HD_LESSONS&&!r.dataset.manual)mount(r,{})});
})();
