<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a91f32">
<title>KlassenLive · Lehrer</title>
<link rel="stylesheet" href="style.css">
<style>
#login{max-width:400px;margin:0 auto}
.field{margin-bottom:14px}.pw{position:relative}.pw input{padding-right:96px}
.pw button{position:absolute;right:8px;top:8px;height:40px;padding:0 14px;border:0;border-radius:11px;background:#e8effc;color:var(--blue-d);font:800 .85rem var(--font);cursor:pointer}
.page{min-height:calc(100vh - 62px);display:grid;place-items:center;padding:24px 16px 40px;position:relative;overflow:hidden}
.page::before,.page::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
.page::before{width:420px;height:420px;left:-120px;top:-60px;background:radial-gradient(circle,#ffffffb0,#ffffff00 70%)}
.page::after{width:520px;height:520px;right:-160px;bottom:-140px;background:radial-gradient(circle,#9cc4ff80,#9cc4ff00 70%)}
.panel{position:relative;z-index:1;width:100%;max-width:520px;background:#fff;border-radius:28px;padding:26px 22px 22px;box-shadow:0 6px 0 var(--shadow),0 24px 50px #1c47c922}
.hello{margin:0 0 4px;font-size:1.9rem}.sub{color:var(--mut);font-weight:700;margin:0 0 20px}
.opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;color:#fff;text-decoration:none;margin-bottom:14px}
.opt:last-child{margin-bottom:0}
.opt.t1{background:linear-gradient(135deg,#3b78ff,#1f4fd6);box-shadow:0 5px 0 #14349b}
.opt.t2{background:linear-gradient(135deg,#1d93d6,#145aa6);box-shadow:0 5px 0 #0c3d78}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 #0c2a66}
.opt .ic{width:60px;height:60px;flex:none;border-radius:18px;background:#ffffff2e;display:grid;place-items:center;font-size:2rem}
.opt .tx{flex:1;min-width:0}.opt b{display:block;font-size:1.35rem;font-weight:900;text-shadow:0 1px 0 #0003}
.opt small{display:block;font:700 .92rem/1.3 var(--font);opacity:1;text-shadow:0 1px 0 #0002}
.opt .go{font-size:1.6rem;font-weight:900;flex:none}
body.in-hub{background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed}
</style>
</head>
<body>
<main id="loginwrap">
  <div class="brand"><span class="logo">K</span><span>KlassenLive</span></div>
  <p id="error" hidden style="max-width:400px;margin:0 auto 12px"></p>

  <section id="login" class="card" hidden>
    <h1>Anmelden</h1><p class="mut" style="margin-bottom:16px">Nur für Lehrer.</p>
    <form id="loginform">
      <div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Passwort</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button id="showpw" type="button" aria-label="Passwort anzeigen">Zeigen</button></div></div>
      <button id="signin" class="btn" type="submit">Anmelden</button>
    </form>
  </section>

</main>

<header class="appbar" id="appbar" hidden><div class="in"><div class="brand"><span class="logo">K</span><span>KlassenLive</span></div><span class="chip" id="who"></span><button id="signout" class="btn ghost sm" type="button">Abmelden</button></div></header>
<div class="page" id="page" hidden>
  <div class="panel">
    <h1 class="hello">Hallo! 👋</h1>
    <p class="sub">Was möchtest du starten?</p>
    <a class="opt t1" href="Live-Test/teacher.html"><span class="ic">✏️</span><span class="tx"><b>Live-Test</b><small>Übung mit Zeitlimit, Ergebnisse live</small></span><span class="go">›</span></a>
    <a class="opt t2" href="Live-Diktat/teacher.html"><span class="ic">🎧</span><span class="tx"><b>Live-Diktat</b><small>Hören und Satz für Satz schreiben</small></span><span class="go">›</span></a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const err=e=>{const m=e?.message||String(e||'');$('error').textContent=m;$('error').hidden=!m};
let db;
if(!window.KL_CONFIG||!window.supabase||String(KL_CONFIG.anonKey||'').includes('PASTE_'))err('Konfiguration fehlt: config.js oder Supabase-Schlüssel nicht gefunden.');
else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init()}
function show(session){
  $('loginwrap').hidden=!!session;$('login').hidden=!!session;$('appbar').hidden=!session;$('page').hidden=!session;
  if(session){$('who').textContent=session.user?.email||'';
}
}
async function init(){
  const {data}=await db.auth.getSession();show(data.session);
  db.auth.onAuthStateChange((_e,s)=>show(s));
}
$('showpw').onclick=()=>{const i=$('password'),h=i.type==='password';i.type=h?'text':'password';$('showpw').textContent=h?'Verbergen':'Zeigen'};
$('loginform').onsubmit=async e=>{e.preventDefault();err('');const b=$('signin');b.disabled=true;
  try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error)err(error.message==='Invalid login credentials'?'E-Mail oder Passwort falsch.':error.message)}
  catch(x){err(x)}
  finally{b.disabled=false}};
$('signout').onclick=()=>db.auth.signOut();
</script>
</body>
</html>
