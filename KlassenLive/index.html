<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<title>KlassenLive · Lehrer</title>
<link rel="stylesheet" href="style.css">
<style>
.hello{font-size:2rem;margin:10px 0 2px}.sub{color:var(--mut);font-weight:500;margin:0 0 18px}
.pick{display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.opt{display:flex;align-items:center;gap:14px;border-radius:16px;padding:20px;color:#fff;text-decoration:none}
.opt.t1{background:#2f6bff;box-shadow:var(--soft)}
.opt.t2{background:#1b7fc4;box-shadow:var(--soft)}
.opt:active{transform:translateY(1px)}
.opt .tx{flex:1;min-width:0}
.opt b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;}
.opt small{display:block;font:400 .95rem/1.35 var(--font);margin-top:4px;opacity:.92}
.opt .go{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--blue-d);display:grid;place-items:center;font-size:1.7rem;font-weight:700;line-height:1;padding-bottom:3px}
.login{margin:auto 0;padding:22px 18px}
.field{margin-bottom:14px}.pw{position:relative}.pw input{padding-right:96px}
.pw button{position:absolute;right:8px;top:8px;height:40px;padding:0 14px;border:0;border-radius:11px;background:#e8effc;color:var(--blue-d);font:700 .85rem var(--font);cursor:pointer}
</style>
</head>
<body class="stage">
<div class="app">
  <header class="ah">
    <div class="brand"><span class="logo">K</span><span>KlassenLive</span></div>
    <span class="chip" id="who" hidden></span><button id="signout" class="btn ghost sm" type="button" hidden>Abmelden</button>
  </header>
  <div class="ab">
    <p id="error" hidden></p>

    <section id="login" class="card login" hidden>
      <h1>Anmelden</h1><p class="mut" style="margin-bottom:16px">Nur für Lehrer.</p>
      <form id="loginform">
        <div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required></div>
        <div class="field"><label for="password">Passwort</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button id="showpw" type="button" aria-label="Passwort anzeigen">Zeigen</button></div></div>
        <button id="signin" class="btn" type="submit">Anmelden</button>
      </form>
    </section>

    <section id="hub" hidden>
      <h1 class="hello">Willkommen</h1>
      <p class="sub">Was möchtest du starten?</p>
      <div class="pick">
        <a class="opt t1" href="Live-Test/teacher.html"><span class="tx"><b>Live-Test</b><small>Übung mit Zeitlimit. Ergebnisse live.</small></span><span class="go">›</span></a>
        <a class="opt t2" href="Live-Diktat/teacher.html"><span class="tx"><b>Live-Diktat</b><small>Hören und Satz für Satz schreiben.</small></span><span class="go">›</span></a>
      </div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const err=e=>{const m=e?.message||String(e||'');$('error').textContent=m;$('error').hidden=!m};
let db;
if(!window.KL_CONFIG||!window.supabase||String(KL_CONFIG.anonKey||'').includes('PASTE_'))err('Konfiguration fehlt: config.js oder Supabase-Schlüssel nicht gefunden.');
else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init()}
function show(session){
  $('login').hidden=!!session;$('hub').hidden=!session;$('signout').hidden=!session;
  $('who').hidden=!session;$('who').textContent=session?(session.user?.email||''):'';
}
async function init(){
  const {data}=await db.auth.getSession();show(data.session);
  db.auth.onAuthStateChange((_e,s)=>show(s));
}
$('showpw').onclick=()=>{const i=$('password'),h=i.type==='password';i.type=h?'text':'password';$('showpw').textContent=h?'Verbergen':'Zeigen'};
$('loginform').onsubmit=async e=>{e.preventDefault();err('');const b=$('signin');b.disabled=true;
  try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error)err(error.message==='Invalid login credentials'?'E-Mail oder Passwort falsch.':error.message)}
  catch(x){err(x)}
  finally{b.disabled=false}};
$('signout').onclick=()=>db.auth.signOut();
</script>
</body>
</html>
