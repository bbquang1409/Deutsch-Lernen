<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a91f32">
<title>KlassenLive · Lehrer</title>
<style>
:root{--red:#a91f32;--red-l:#fbeaec;--ink:#1b2430;--mut:#67727f;--line:#e3e6eb;--bg:#f4f5f7}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px 0 22px;color:var(--red);font-weight:750;font-size:1.6rem;letter-spacing:-.04em}
.logo{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:1.2rem;letter-spacing:0}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:0 1px 8px #1420340a}
#login{max-width:380px;margin:0 auto}
h2{margin:0 0 14px;font-size:1.15rem}
label{display:block;margin:0 0 6px;font-size:.82rem;font-weight:650;color:#4b5663}
input{width:100%;height:48px;padding:0 14px;border:1px solid #cfd5dc;border-radius:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.field{margin-bottom:12px}.pw{position:relative}.pw input{padding-right:84px}
.pw button{position:absolute;right:6px;top:6px;height:36px;padding:0 12px;border:0;border-radius:9px;background:#eceff2;color:#3a4552;font:inherit;font-size:.85rem;font-weight:650;cursor:pointer}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:4px}
.btn:disabled{opacity:.55}
#error{max-width:380px;margin:0 auto 12px;padding:10px 12px;border-radius:11px;background:#fdecee;color:#9b1c2c;font-size:.92rem;white-space:pre-wrap}
.who{text-align:center;color:var(--mut);font-size:.9rem;margin:-10px 0 18px}
.tiles{display:grid;gap:14px}
a.tile{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 20px;box-shadow:0 1px 8px #1420340a}
a.tile:active{background:var(--red-l)}
a.tile b{display:block;font-size:1.3rem;color:var(--red);margin-bottom:4px}
a.tile span{color:var(--mut);font-size:.95rem}
#signout{margin:22px auto 0;display:block;width:auto;padding:0 22px;background:#fff;color:#3a4552;border:1px solid #d5dae0;font-weight:600}
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo">K</span><span>KlassenLive</span></div>
  <p id="error" hidden></p>

  <section id="login" class="card" hidden>
    <h2>Anmelden</h2>
    <form id="loginform">
      <div class="field"><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="password">Passwort</label><div class="pw"><input id="password" type="password" autocomplete="current-password" required><button id="showpw" type="button" aria-label="Passwort anzeigen">Zeigen</button></div></div>
      <button id="signin" class="btn" type="submit">Anmelden</button>
    </form>
  </section>

  <section id="hub" hidden>
    <p class="who" id="who"></p>
    <div class="tiles">
      <a class="tile" href="Live-Test/teacher.html"><b>Live-Test</b><span>Übung mit Zeitlimit: Schüler lösen sie am Handy, du siehst die Ergebnisse live.</span></a>
      <a class="tile" href="Live-Diktat/teacher.html"><b>Live-Diktat</b><span>Hörverstehen und Diktat Satz für Satz: Du spielst den Ton ab, die Schüler schreiben.</span></a>
    </div>
    <button id="signout" class="btn" type="button">Abmelden</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const err=e=>{const m=e?.message||String(e||'');$('error').textContent=m;$('error').hidden=!m};
let db;
if(!window.KL_CONFIG||!window.supabase||String(KL_CONFIG.anonKey||'').includes('PASTE_'))err('Konfiguration fehlt: config.js oder Supabase-Schlüssel nicht gefunden.');
else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init()}
function show(session){
  $('login').hidden=!!session;$('hub').hidden=!session;
  if(session)$('who').textContent='Angemeldet als '+(session.user?.email||'');
}
async function init(){
  const {data}=await db.auth.getSession();show(data.session);
  db.auth.onAuthStateChange((_e,s)=>show(s));
}
$('showpw').onclick=()=>{const i=$('password'),h=i.type==='password';i.type=h?'text':'password';$('showpw').textContent=h?'Verbergen':'Zeigen'};
$('loginform').onsubmit=async e=>{e.preventDefault();err('');const b=$('signin');b.disabled=true;
  try{const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error)err(error.message==='Invalid login credentials'?'E-Mail oder Passwort falsch.':error.message)}
  catch(x){err(x)}
  finally{b.disabled=false}};
$('signout').onclick=()=>db.auth.signOut();
</script>
</body>
</html>
