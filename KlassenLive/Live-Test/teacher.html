<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<title>KlassenLive · Lehrer</title>
<link rel="stylesheet" href="../style.css">
<style>
.sec{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--soft);margin:0 0 14px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:var(--soft);margin:0 0 14px}
label{display:flex;flex-direction:column;gap:6px}
.btn.outline-red{background:#fff;color:var(--bad);box-shadow:none;border-color:#ffc9d0}
.btn.sm{width:auto}
.stack{display:grid;gap:12px}
.layout{display:grid;gap:0;grid-template-columns:1fr}
@media(min-width:900px){
 .layout{grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:0 16px;align-items:start}
 .col-left{grid-column:1}.col-right{grid-column:2;grid-row:1;position:sticky;top:12px}
}
details.create>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:1.15rem;color:var(--navy);min-height:30px}
details.create>summary::-webkit-details-marker{display:none}
details.create>summary::after{content:"+";color:var(--blue);font-size:1.6rem;line-height:1}
details.create[open]>summary::after{content:"–"}
.create-form{display:grid;gap:14px;margin-top:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips .chip{height:38px;padding:0 16px;border:0;cursor:pointer;font-size:.9rem}
.chips .chip.on{background:var(--blue);color:#fff;box-shadow:var(--soft)}
.room{border:1.5px solid var(--line);border-radius:18px;padding:12px;margin:0 0 10px;background:#fff}
.room.sel{border-color:var(--sky);background:#f3f8ff}
.room-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.room-title{font-weight:700;overflow-wrap:anywhere;color:var(--navy)}
.room-meta{display:flex;align-items:center;gap:8px;margin-top:4px;color:var(--mut);font-size:.88rem;font-weight:700}
.code{font-family:ui-monospace,Menlo,monospace;font-weight:700;letter-spacing:.12em;color:var(--blue-d)}
.room-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.room-actions .btn{flex:1 1 auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.waiting,.pill.p-work{background:var(--warn-l);color:var(--warn)}
.pill.active,.pill.p-sub{background:var(--ok-l);color:var(--ok-d)}
.pill.finished,.pill.p-conn{background:#e8effc;color:var(--blue-d)}
.pill.p-none{background:var(--bad-l);color:var(--bad)}
.muted{color:var(--mut);font-weight:700;font-size:.9rem}
.archive-toggle{width:100%;margin-top:4px}
.m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.m-title{margin:0;font-size:1.2rem;font-weight:700;color:var(--navy);overflow-wrap:anywhere}
.m-code{display:block;width:100%;height:auto;margin:12px 0 4px;padding:14px;border:2px dashed var(--sky);border-radius:20px;background:#fff;color:var(--blue-d);font:700 clamp(2.2rem,8vw,3.2rem)/1 ui-monospace,Menlo,monospace;letter-spacing:.18em;text-align:center;cursor:pointer;box-shadow:none}
.m-hint{margin:0 0 12px;text-align:center;color:var(--mut);font-weight:700;font-size:.85rem}
.m-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
#m-count{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-d)}
.m-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.m-actions .btn{flex:1 1 140px;width:auto}
#stats{margin:0;font-size:.95rem;font-weight:700}
.progress{height:14px;border-radius:99px;background:#e8effc;overflow:hidden;margin:8px 0 12px}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--blue));transition:width .3s}
.person{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 0;border-top:2px solid var(--line)}
.person .name{font-weight:700;overflow-wrap:anywhere}
.person .res{font-weight:700;font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
@media(max-width:480px){.person{grid-template-columns:minmax(0,1fr) auto}.person .res{grid-column:2;grid-row:1}.person .pill{grid-column:1;justify-self:start}}
.empty{padding:18px 8px;text-align:center;color:var(--mut);font-weight:700}
.ab.pad{padding-bottom:24px}
</style>
</head>
<body class="stage">
<div class="app wide">
  <header class="ah">
    <div class="brand"><span class="logo">K</span><span>KlassenLive</span></div>
    <span class="chip dark">Live-Test</span>
    <a class="btn ghost sm" href="../index.html" style="margin-left:auto">Hub</a><button id="signout" class="btn ghost sm" type="button" hidden>Abmelden</button>
  </header>
  <div class="ab pad">
  <p id="error" role="alert" hidden></p>



  <div id="app" class="layout" hidden>
    <div class="col-left">
      <section class="card">
        <details class="create" id="create-box" open>
          <summary>Neuen Live-Raum erstellen</summary>
          <form id="create-form" class="create-form">
            <label>Titel<input id="title" value="Grammatik Live-Test" maxlength="80"></label>
            <div class="row2">
              <input id="activity" type="hidden" value="test">
              <label>Dauer (Min.)<input id="minutes" type="number" inputmode="numeric" min="1" max="240" value="1"></label>
            </div>
            <div class="chips" id="chips" aria-label="Schnellauswahl Dauer">
              <button type="button" class="chip" data-m="1">1</button>
              <button type="button" class="chip" data-m="5">5</button>
              <button type="button" class="chip" data-m="10">10</button>
              <button type="button" class="chip" data-m="15">15</button>
              <button type="button" class="chip" data-m="20">20</button>
            </div>
            <label>Übung
              <select id="exercise-choice">
                <option value="demo">HTML Übung · Demo</option>
                <option value="custom">Andere Übungs-URL…</option>
              </select>
            </label>
            <label id="custom-url-field" hidden>Übungs-URL<input id="url" type="url" inputmode="url" placeholder="https://…/uebung.html"></label>
            <button id="create" class="btn" type="submit">Raum erstellen</button>
          </form>
        </details>
      </section>

      <section class="card">
        <h2>Meine Räume</h2>
        <div id="rooms"><p class="muted">Laden…</p></div>
        <button id="archive-toggle" class="btn ghost sm archive-toggle" type="button">Archiv anzeigen</button>
        <div id="archive" hidden style="margin-top:10px"></div>
      </section>
    </div>

    <div class="col-right">
      <section class="card" id="monitor">
        <h2>Live-Monitor</h2>
        <p id="m-empty" class="empty">Noch kein Raum vorhanden.<br>Erstelle einen Raum, um die Schüler zu sehen.</p>
        <div id="m-body" hidden>
          <div class="m-top"><p id="m-title" class="m-title"></p><span id="m-pill" class="pill"></span></div>
          <button id="m-code" class="m-code" type="button" title="Code kopieren"></button>
          <p class="m-hint" id="m-hint">Schüler scannen den QR-Code und geben ihren Namen ein.</p>
          <div class="m-actions" id="m-share"><button id="m-qr" class="btn green" type="button">QR-Code</button><button id="m-link" class="btn ghost" type="button">Link kopieren</button></div>
          <div class="m-bar"><span id="m-count"></span></div>
          <div class="m-actions" id="m-actions"></div>
          <p id="stats"></p>
          <div class="progress"><i id="bar"></i></div>
          <div id="people"></div>
        </div>
      </section>
    </div>
  </div>
  </div>
</div>

<div id="qrov" hidden style="position:fixed;inset:0;z-index:50;background:#14246b99;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;cursor:pointer"><div style="background:#fff;border-radius:28px;padding:22px 26px;text-align:center;box-shadow:0 8px 0 #c3d4f5,0 30px 60px #0b164666;max-width:92vw"><div id="qrimg" style="width:min(46vmin,320px);height:min(46vmin,320px);margin:0 auto"></div><div id="qrcode" style="font:700 clamp(1.6rem,6vw,2.4rem)/1 ui-monospace,Menlo,monospace;letter-spacing:.2em;color:#1c47c9;margin-top:12px"></div><p style="margin:10px 0 0;color:#6b7aa8;font-weight:700;font-size:.9rem">Mit der Handykamera scannen · Tippen zum Schließen</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../ui.js"></script>
<script src="../config.js"></script>
<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n};
const STATUS={waiting:'Wartet',active:'Läuft',finished:'Beendet'};
let db,selected=null,sub=null,roomsCache=[],lastPeople=[],archiveOpen=false,roomsChannel=null,expirySweepBusy=false,refreshSequence=0;
const err=e=>{const m=e?.message||String(e||'');$('error').textContent=m;$('error').hidden=!m};

if(!window.KL_CONFIG||!window.supabase||String(KL_CONFIG.anonKey||'').includes('PASTE_')){err('Konfiguration fehlt: config.js oder Supabase-Schlüssel nicht gefunden.')}
else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init()}

async function init(){const {data}=await db.auth.getSession();show(!!data.session);db.auth.onAuthStateChange((_e,s)=>show(!!s))}
let shownOn=null;
function show(on){
  if(shownOn===on)return;shownOn=on;
  if(!on){location.replace('../index.html');return}
  $('app').hidden=false;$('signout').hidden=false;
  if(on){loadRooms();finishExpiredRooms();subscribeRooms()}
  else{if(roomsChannel){db.removeChannel(roomsChannel);roomsChannel=null}clearMonitor()}
}

$('signout').onclick=()=>db.auth.signOut();

/* ---------- Raum erstellen ---------- */
function syncChips(){document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===String($('minutes').value)))}
$('chips').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;$('minutes').value=c.dataset.m;syncChips()};
$('minutes').oninput=syncChips;syncChips();
$('exercise-choice').onchange=()=>{$('custom-url-field').hidden=$('exercise-choice').value!=='custom'};
const CODE_ALPHABET='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function makeCode(){const a=new Uint32Array(6);crypto.getRandomValues(a);return Array.from(a,n=>CODE_ALPHABET[n%CODE_ALPHABET.length]).join('')}
$('create-form').onsubmit=async e=>{
  e.preventDefault();err('');const btn=$('create');btn.disabled=true;
  try{
    const {data:{user}}=await db.auth.getUser();
    const chosen=$('exercise-choice').value==='demo'?new URL('exercise-demo.html',location.href).href:$('url').value.trim();
    if(!chosen)throw Error('Bitte eine Übungs-URL eingeben.');
    const url=new URL(chosen);if(!['http:','https:'].includes(url.protocol))throw Error('Ungültige Übungs-URL.');
    const mins=Number($('minutes').value);if(!(mins>=1&&mins<=240))throw Error('Dauer: 1 bis 240 Minuten.');
    let code,error;
    for(let i=0;i<5;i++){
      code=makeCode();
      ({error}=await db.from('kl_sessions').insert({teacher_id:user.id,title:$('title').value.trim()||'Live-Test',exercise_url:url.href,activity:$('activity').value,duration_seconds:Math.round(mins*60),room_code:code}));
      if(!error||error.code!=='23505')break;
    }
    if(error)throw error;
    await loadRooms();
    const created=roomsCache.find(s=>s.room_code===code);
    if(created){await selectRoom(created);$('create-box').open=false;$('monitor').scrollIntoView({behavior:'smooth',block:'start'})}
    else err('Raum erstellt, aber der Monitor konnte nicht automatisch geöffnet werden.');
  }catch(x){err(x)}finally{btn.disabled=false}
};

/* ---------- Räume ---------- */
function setPill(n,status){n.className='pill '+status;n.textContent=STATUS[status]||status}
async function copyCode(code,btn,label){try{await navigator.clipboard.writeText(code);if(btn){const o=btn.textContent;btn.textContent='Kopiert ✓';setTimeout(()=>btn.textContent=label||o,1500)}}catch(e){err('Kopieren fehlgeschlagen: '+e.message)}}
function roomCard(s){
  const d=el('div','room'+(selected?.id===s.id?' sel':''));
  const head=el('div','room-head');head.append(el('span','room-title',s.title));const p=el('span','pill');setPill(p,s.status);head.append(p);d.append(head);
  const meta=el('div','room-meta');meta.append(el('span','code',s.room_code));meta.append(el('span','',`· ${Math.round(s.duration_seconds/60)} Min.`));d.append(meta);
  const acts=el('div','room-actions');
  const view=el('button','btn sm'+(selected?.id===s.id?'':' ghost'),'Monitor');view.type='button';view.onclick=()=>{selectRoom(s);$('monitor').scrollIntoView({behavior:'smooth',block:'start'})};acts.append(view);
  if(s.status==='waiting'){const b=el('button','btn sm green','Starten');b.type='button';b.onclick=()=>update(s,'active');acts.append(b)}
  if(s.status!=='finished'){const b=el('button','btn sm outline-red','Beenden');b.type='button';b.onclick=()=>finishRoom(s);acts.append(b)}
  if(s.status!=='finished'){const b=el('button','btn sm ghost','Code kopieren');b.type='button';b.onclick=()=>copyCode(s.room_code,b,'Code kopieren');acts.append(b)}
  d.append(acts);return d;
}
function renderRooms(){
  const live=$('rooms'),arch=$('archive');live.replaceChildren();arch.replaceChildren();
  const open=roomsCache.filter(s=>s.status!=='finished'),fin=roomsCache.filter(s=>s.status==='finished');
  if(!open.length)live.append(el('p','muted','Keine offenen Räume.'));
  open.forEach(s=>live.append(roomCard(s)));
  if(!fin.length)arch.append(el('p','muted','Keine abgeschlossenen Räume.'));
  fin.forEach(s=>arch.append(roomCard(s)));
  $('archive-toggle').textContent=`${archiveOpen?'Archiv ausblenden':'Archiv anzeigen'} (${fin.length})`;
  arch.hidden=!archiveOpen;
}
$('archive-toggle').onclick=()=>{archiveOpen=!archiveOpen;renderRooms()};
async function finishRoom(s){if(await klConfirm('Raum beenden?',`„${s.title}“ wird beendet. Die Schüler werden gesperrt und ihre Antworten abgegeben.`,'Beenden',true))await update(s,'finished')}

async function finishExpiredRooms(){
  if(!db||expirySweepBusy||$('app').hidden)return;expirySweepBusy=true;
  try{
    const now=new Date().toISOString();
    const {data:expired,error:le}=await db.from('kl_sessions').select('id,ends_at').eq('status','active').not('ends_at','is',null).lte('ends_at',now);
    if(le)throw le;
    for(const r of expired||[]){const {error}=await db.from('kl_sessions').update({status:'finished'}).eq('id',r.id).eq('status','active').lte('ends_at',now);if(error)throw error}
    if(expired?.length)await loadRooms();
  }catch(e){err(e)}finally{expirySweepBusy=false}
}
async function loadRooms(){
  if(!db)return;
  const {data,error}=await db.from('kl_sessions').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){err(error);return}
  roomsCache=data||[];
  if(selected){
    const latest=roomsCache.find(s=>s.id===selected.id);
    if(latest){selected=latest;renderRooms();renderMonitorHead();await refresh()}
    else if(roomsCache.length){await selectRoom(roomsCache[0])}else{renderRooms();clearMonitor()}
  }else if(roomsCache.length){await selectRoom(roomsCache[0])}
  else{renderRooms();renderMonitorHead()}
}
async function update(s,status){
  const payload={status};if(status==='active')payload.ends_at=new Date(Date.now()+s.duration_seconds*1000).toISOString();
  const {error}=await db.from('kl_sessions').update(payload).eq('id',s.id);
  if(error){err(error);return}
  if(selected?.id===s.id){selected={...selected,...payload};renderMonitorHead()}
  await loadRooms();
}

/* ---------- Monitor ---------- */
async function clearMonitor(){selected=null;lastPeople=[];const old=sub;sub=null;if(old)await db.removeChannel(old);renderMonitorHead();$('people').replaceChildren();$('stats').textContent='';$('bar').style.width='0'}
function renderMonitorHead(){
  $('m-empty').hidden=!!selected;$('m-body').hidden=!selected;if(!selected)return;
  $('m-title').textContent=selected.title;$('m-code').textContent=selected.room_code;setPill($('m-pill'),selected.status);
  const a=$('m-actions');a.replaceChildren();
  if(selected.status==='waiting'){const b=el('button','btn green','Starten');b.type='button';b.onclick=()=>update(selected,'active');a.append(b)}
  if(selected.status!=='finished'){const b=el('button','btn outline-red','Beenden');b.type='button';b.onclick=()=>finishRoom(selected);a.append(b)}
  $('m-hint').hidden=$('m-share').hidden=selected.status==='finished';
  tickCountdown();renderPeople();
}
const stuLink=()=>new URL('student.html?code='+selected.room_code,location.href).href;
$('m-qr').onclick=()=>{if(!selected)return;const t=$('qrimg');t.replaceChildren();
  if(window.qrcode){const q=qrcode(0,'M');q.addData(stuLink());q.make();t.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true});const v=t.querySelector('svg');if(v){v.style.width='100%';v.style.height='100%'}}else t.textContent=stuLink();
  $('qrcode').textContent=selected.room_code;$('qrov').hidden=false};
$('qrov').onclick=()=>{$('qrov').hidden=true};
$('m-link').onclick=async()=>{if(!selected)return;try{await navigator.clipboard.writeText(stuLink());$('m-link').textContent='Kopiert ✓';setTimeout(()=>$('m-link').textContent='Link kopieren',1800)}catch(_){err('Kopieren nicht erlaubt. Link: '+stuLink())}};
$('m-code').onclick=()=>selected&&copyCode(selected.room_code);
function tickCountdown(){
  const c=$('m-count');if(!selected){c.textContent='';return}
  if(selected.status==='active'&&selected.ends_at){const s=Math.max(0,Math.ceil((new Date(selected.ends_at)-Date.now())/1000));c.textContent=`Restzeit ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
  else if(selected.status==='waiting')c.textContent=`Dauer ${Math.round(selected.duration_seconds/60)} Min. · wartet auf den Start`;
  else c.textContent='Abgeschlossen';
}
async function selectRoom(s){
  const old=sub;sub=null;if(old)await db.removeChannel(old);
  selected=s;lastPeople=[];renderRooms();renderMonitorHead();$('stats').textContent='Laden…';
  sub=db.channel('kl-teacher-'+s.id).on('postgres_changes',{event:'*',schema:'public',table:'kl_participants',filter:'session_id=eq.'+s.id},()=>refresh()).subscribe();
  await refresh();
}
function personStatus(p){
  if(p.submitted_at)return['Abgegeben','p-sub'];
  if(selected.status==='finished')return['Nicht abgegeben','p-none'];
  if(selected.status==='active')return['In Arbeit','p-work'];
  return['Verbunden','p-conn'];
}
function renderPeople(){
  const box=$('people');box.replaceChildren();if(!selected)return;
  const data=lastPeople,submitted=data.filter(p=>p.submitted_at).length;
  $('stats').textContent=`${submitted}/${data.length} abgegeben`;
  $('bar').style.width=data.length?Math.round(submitted/data.length*100)+'%':'0';
  if(!data.length){box.append(el('p','empty','Noch keine Schüler im Raum.'));return}
  for(const p of data){
    const row=el('div','person');row.append(el('span','name',p.display_name));
    const [t,c]=personStatus(p);row.append(el('span','pill '+c,t));
    const r=p.result;row.append(el('span','res',r?.correct!=null?`${r.correct}/${r.total}`:p.submitted_at?'Ohne Bewertung':'—'));
    box.append(row);
  }
}
async function refresh(){
  if(!selected)return;const seq=++refreshSequence,id=selected.id;
  const {data,error}=await db.from('kl_participants').select('display_name,submitted_at,result,progress').eq('session_id',id).order('joined_at');
  if(!selected||selected.id!==id||seq!==refreshSequence)return;
  if(error){err(error);return}
  lastPeople=data||[];renderPeople();
}
async function subscribeRooms(){if(roomsChannel)return;roomsChannel=db.channel('kl-teacher-sessions').on('postgres_changes',{event:'*',schema:'public',table:'kl_sessions'},()=>loadRooms()).subscribe()}
setInterval(()=>{if(selected)refresh()},3000);
setInterval(finishExpiredRooms,5000);
setInterval(()=>{if(db&&!$('app').hidden)loadRooms()},15000);
setInterval(tickCountdown,1000);
</script>
</body>
</html>
