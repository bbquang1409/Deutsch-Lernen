<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenLive · Lehrer</title><style>body{font:16px system-ui;background:#f7f7f8;color:#222;margin:0}main{max-width:900px;margin:auto;padding:20px}h1{color:#a91f32}section{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}input,select,button{font:inherit;padding:11px;border-radius:8px;margin:5px 0;box-sizing:border-box}input{border:1px solid #aaa;width:100%}button{border:0;background:#a91f32;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}small{color:#666}.hide{display:none}.room-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #eee}.room-row .room-label{flex:1 1 230px}.room-row button{margin:0}.room-row .copy{background:#555}.archive-toggle{background:#555;margin-top:14px}.muted{color:#666}#error{color:#b00020;white-space:pre-wrap}</style></head><body><main><h1>KlassenLive · Lehrer</h1><p id="error"></p><section id="login"><h2>Anmelden</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="signin">Anmelden</button></section><div id="app" class="hide"><button id="signout">Abmelden</button><section><h2>Neuen Live-Raum erstellen</h2><input id="title" placeholder="Titel" value="Grammatik Live-Test"><input id="url" placeholder="https://.../exercise-demo.html"><select id="activity"><option value="test">Live-Test</option><option value="dictation">Live-Diktat</option></select><input id="minutes" type="number" min="1" max="240" value="20" placeholder="Minuten"><button id="create">Raum erstellen</button></section><section><h2>Meine Räume</h2><div id="rooms">Laden…</div><button id="archive-toggle" class="archive-toggle" type="button">Archiv anzeigen</button><div id="archive" class="hide"></div></section><section><h2>Live-Monitor</h2><p id="roomtitle">Raum auswählen</p><h3 id="stats"></h3><table><thead><tr><th>Name</th><th>Status</th><th>Ergebnis</th></tr></thead><tbody id="people"></tbody></table></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let db,selected=null,sub=null,roomsCache=[],archiveOpen=false;const err=e=>$('error').textContent=e?.message||String(e||'');
if(!window.KL_CONFIG||!window.supabase||KL_CONFIG.anonKey.includes('PASTE_'))err('Thiếu config.js hoặc Supabase public key.');else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init();}
async function init(){const {data}=await db.auth.getSession();show(!!data.session);db.auth.onAuthStateChange((_e,s)=>show(!!s));}
function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);if(on)loadRooms();}
$('signin').onclick=async()=>{err('');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)err(error)};
$('signout').onclick=()=>db.auth.signOut();
$('create').onclick=async()=>{err('');try{const {data:{user}}=await db.auth.getUser();const url=new URL($('url').value);if(!['http:','https:'].includes(url.protocol))throw Error('URL không hợp lệ');const code=Math.random().toString(36).slice(2,8).toUpperCase();const {error}=await db.from('kl_sessions').insert({teacher_id:user.id,title:$('title').value.trim()||'Live-Test',exercise_url:url.href,activity:$('activity').value,duration_seconds:Math.round(Number($('minutes').value)*60),room_code:code});if(error)throw error;await loadRooms();}catch(e){err(e)}};
function roomRow(s){
  const div=document.createElement('div');div.className='room-row';
  const label=document.createElement('span');label.className='room-label';label.textContent=`${s.title} · ${s.room_code} · ${s.status}`;div.append(label);
  const copy=document.createElement('button');copy.className='copy';copy.type='button';copy.textContent='Code kopieren';copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.room_code);copy.textContent='Kopiert ✓';setTimeout(()=>copy.textContent='Code kopieren',1800)}catch(e){err('Kopieren fehlgeschlagen: '+e.message)}};div.append(copy);
  const view=document.createElement('button');view.textContent='Monitor';view.onclick=()=>selectRoom(s);div.append(view);
  if(s.status==='waiting'){const start=document.createElement('button');start.textContent='START';start.onclick=()=>update(s,'active');div.append(start)}
  if(s.status!=='finished'){const finish=document.createElement('button');finish.textContent='FINISH';finish.onclick=()=>update(s,'finished');div.append(finish)}
  return div;
}
function renderRooms(){
  const active=$('rooms'),archive=$('archive');active.replaceChildren();archive.replaceChildren();
  const live=roomsCache.filter(s=>s.status!=='finished'),finished=roomsCache.filter(s=>s.status==='finished');
  if(!live.length){const p=document.createElement('p');p.className='muted';p.textContent='Keine offenen Räume.';active.append(p)}
  for(const s of live)active.append(roomRow(s));
  for(const s of finished)archive.append(roomRow(s));
  if(!finished.length){const p=document.createElement('p');p.className='muted';p.textContent='Keine abgeschlossenen Räume.';archive.append(p)}
  $('archive-toggle').textContent=`${archiveOpen?'Archiv ausblenden':'Archiv anzeigen'} (${finished.length})`;
  archive.classList.toggle('hide',!archiveOpen);
}
$('archive-toggle').onclick=()=>{archiveOpen=!archiveOpen;renderRooms()};
async function loadRooms(){
  if(!db)return;
  const {data,error}=await db.from('kl_sessions').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){err(error);return}
  roomsCache=data||[];renderRooms();
  if(selected){const latest=roomsCache.find(s=>s.id===selected.id);if(latest){selected=latest;renderMonitorTitle()}}
}
async function update(s,status){
  const payload={status};if(status==='active')payload.ends_at=new Date(Date.now()+s.duration_seconds*1000).toISOString();
  const {error}=await db.from('kl_sessions').update(payload).eq('id',s.id);
  if(error){err(error);return}
  if(selected?.id===s.id){selected={...selected,...payload};renderMonitorTitle()}
  await loadRooms();
}
function renderMonitorTitle(){if(selected)$('roomtitle').textContent=`${selected.title} · Raumcode: ${selected.room_code} · ${selected.status}`}
async function selectRoom(s){selected=s;renderMonitorTitle();if(sub)await db.removeChannel(sub);sub=db.channel('kl-teacher-'+s.id).on('postgres_changes',{event:'*',schema:'public',table:'kl_participants',filter:'session_id=eq.'+s.id},refresh).subscribe();refresh();}
async function refresh(){if(!selected)return;const {data,error}=await db.from('kl_participants').select('display_name,submitted_at,result,progress').eq('session_id',selected.id).order('joined_at');if(error){err(error);return}const submitted=data.filter(p=>p.submitted_at).length;$('stats').textContent=`${submitted}/${data.length} abgegeben`;$('people').replaceChildren();for(const p of data){const tr=document.createElement('tr');const result=p.result;for(const value of [p.display_name,p.submitted_at?'Abgegeben':p.progress?'In Arbeit':'Verbunden',result?.correct!=null?`${result.correct}/${result.total}`:p.submitted_at?'Ohne Bewertung':'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('people').append(tr)}}
setInterval(()=>{if(selected)refresh()},5000);setInterval(()=>{if(db&&$('app').classList.contains('hide')===false)loadRooms()},15000);
</script></body></html>
