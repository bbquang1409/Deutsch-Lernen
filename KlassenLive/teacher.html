<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenLive · Lehrer</title><style>body{font:16px system-ui;background:#f7f7f8;color:#222;margin:0}main{max-width:900px;margin:auto;padding:20px}h1{color:#a91f32}section{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin:16px 0}input,select,button{font:inherit;padding:11px;border-radius:8px;margin:5px 0;box-sizing:border-box}input{border:1px solid #aaa;width:100%}button{border:0;background:#a91f32;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}small{color:#666}.hide{display:none}.room-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #eee}.room-row .room-label{flex:1 1 230px}.room-row button{margin:0}.room-row .copy{background:#555}.archive-toggle{background:#555;margin-top:14px}.muted{color:#666}#error{color:#b00020;white-space:pre-wrap}</style>
<style id="kl-compact-teacher">
main{max-width:1080px;padding:14px 18px}
h1{font-size:1.7rem;margin:12px 0}
h2{font-size:1.15rem;margin:0 0 12px}
section{padding:16px;margin:12px 0}
input,select,button{padding:9px 11px;margin:0}
button{margin-right:0}
#app>button#signout{margin:4px 0 8px}
#app>section:first-of-type{display:grid;grid-template-columns:minmax(0,1fr) 170px 90px auto;gap:10px;align-items:center}
#app>section:first-of-type h2{grid-column:1/-1}
#title{grid-column:1/3}
#activity{grid-column:3/5;width:100%}
#url{grid-column:1/3;min-width:0}
#minutes{grid-column:3;width:100%}
#create{grid-column:4;white-space:nowrap}
.room-row{padding:9px 0;gap:6px}
.room-row .room-label{flex:1 1 260px;font-size:.95rem;overflow-wrap:anywhere}
.room-row button{padding:8px 10px;font-size:.9rem}
.archive-toggle{margin-top:10px;padding:8px 12px}
#roomtitle{margin:5px 0 8px}
#stats{margin:8px 0;font-size:1rem}
td,th{padding:8px}
@media(max-width:680px){
main{padding:10px}
section{padding:12px}
#app>section:first-of-type{grid-template-columns:minmax(0,1fr) 100px;gap:8px}
#title{grid-column:1}
#activity{grid-column:2}
#url{grid-column:1/-1}
#minutes{grid-column:1}
#create{grid-column:2}
.room-row .room-label{flex-basis:100%}
.room-row button{flex:1 1 auto}
}
</style>
<style id="kl-create-redesign">
.create-room{padding:16px 18px}
.create-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(130px,.65fr) 110px auto;gap:10px;align-items:end}
.create-grid label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#555;min-width:0}
.create-grid input,.create-grid select{width:100%;margin:0;padding:9px 10px;font-size:15px;height:42px;background:#fff}
.create-grid .field-title{grid-column:1/3}
.create-grid .field-activity{grid-column:3/5}
.create-grid .field-exercise{grid-column:1/3}
.create-grid .field-custom{grid-column:1/3}
.create-grid .field-duration{grid-column:3}
.create-grid .create-button{grid-column:4;margin:0;height:42px;white-space:nowrap;padding:8px 12px;font-size:14px}
.create-grid .hide{display:none}
@media(max-width:680px){.create-grid{grid-template-columns:minmax(0,1fr) 108px;gap:9px}.create-grid .field-title{grid-column:1/-1}.create-grid .field-activity{grid-column:1/-1}.create-grid .field-exercise{grid-column:1/-1}.create-grid .field-custom{grid-column:1/-1}.create-grid .field-duration{grid-column:1}.create-grid .create-button{grid-column:2}}
</style></head><body><main><h1>KlassenLive · Lehrer</h1><p id="error"></p><section id="login"><h2>Anmelden</h2><input id="email" type="email" placeholder="E-Mail"><input id="password" type="password" placeholder="Passwort"><button id="signin">Anmelden</button></section><div id="app" class="hide"><button id="signout">Abmelden</button><section class="create-room"><h2>Neuen Live-Raum erstellen</h2><div class="create-grid"><label class="field-title">Titel<input id="title" placeholder="Titel" value="Grammatik Live-Test"></label><label class="field-activity">Typ<select id="activity"><option value="test">Live-Test</option><option value="dictation">Live-Diktat</option></select></label><label class="field-exercise">Übung<select id="exercise-choice"><option value="demo">HTML Übung · Demo</option><option value="custom">Andere Übungs-URL…</option></select></label><label class="field-custom hide" id="custom-url-field">Übungs-URL<input id="url" type="url" placeholder="https://.../uebung.html"></label><label class="field-duration">Dauer (Min.)<input id="minutes" type="number" min="1" max="240" value="1" placeholder="Minuten"></label><button id="create" class="create-button">Raum erstellen</button></div></section><section><h2>Meine Räume</h2><div id="rooms">Laden…</div><button id="archive-toggle" class="archive-toggle" type="button">Archiv anzeigen</button><div id="archive" class="hide"></div></section><section><h2>Live-Monitor</h2><p id="roomtitle">Raum auswählen</p><h3 id="stats"></h3><table><thead><tr><th>Name</th><th>Status</th><th>Ergebnis</th></tr></thead><tbody id="people"></tbody></table></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id);let db,selected=null,sub=null,roomsCache=[],archiveOpen=false;const err=e=>$('error').textContent=e?.message||String(e||'');
if(!window.KL_CONFIG||!window.supabase||KL_CONFIG.anonKey.includes('PASTE_'))err('Thiếu config.js hoặc Supabase public key.');else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);init();}
async function init(){const {data}=await db.auth.getSession();show(!!data.session);db.auth.onAuthStateChange((_e,s)=>show(!!s));}
function show(on){$('login').classList.toggle('hide',on);$('app').classList.toggle('hide',!on);if(on)loadRooms();}
$('signin').onclick=async()=>{err('');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)err(error)};
$('signout').onclick=()=>db.auth.signOut();
$('exercise-choice').onchange=()=>{$('custom-url-field').classList.toggle('hide',$('exercise-choice').value!=='custom')};
$('create').onclick=async()=>{err('');try{const {data:{user}}=await db.auth.getUser();const chosen=$('exercise-choice').value==='demo' ? new URL('exercise-demo.html',location.href).href : $('url').value.trim();if(!chosen)throw Error('Bitte eine Übungs-URL eingeben.');const url=new URL(chosen);if(!['http:','https:'].includes(url.protocol))throw Error('Ungültige Übungs-URL.');const code=Math.random().toString(36).slice(2,8).toUpperCase();const {error}=await db.from('kl_sessions').insert({teacher_id:user.id,title:$('title').value.trim()||'Live-Test',exercise_url:url.href,activity:$('activity').value,duration_seconds:Math.round(Number($('minutes').value)*60),room_code:code});if(error)throw error;await clearMonitor();await loadRooms();}catch(e){err(e)}};
function roomRow(s){
  const div=document.createElement('div');div.className='room-row';
  const label=document.createElement('span');label.className='room-label';label.textContent=`${s.title} · ${s.room_code} · ${s.status}`;div.append(label);
  const copy=document.createElement('button');copy.className='copy';copy.type='button';copy.textContent='Code kopieren';copy.onclick=async()=>{try{await navigator.clipboard.writeText(s.room_code);copy.textContent='Kopiert ✓';setTimeout(()=>copy.textContent='Code kopieren',1800)}catch(e){err('Kopieren fehlgeschlagen: '+e.message)}};div.append(copy);
  const view=document.createElement('button');view.textContent='Monitor';view.onclick=()=>selectRoom(s);div.append(view);
  if(s.status==='waiting'){const start=document.createElement('button');start.textContent='START';start.onclick=()=>update(s,'active');div.append(start)}
  if(s.status!=='finished'){const finish=document.createElement('button');finish.textContent='FINISH';finish.onclick=()=>update(s,'finished');div.append(finish)}
  return div;
}
function renderRooms(){
  const active=$('rooms'),archive=$('archive');active.replaceChildren();archive.replaceChildren();
  const live=roomsCache.filter(s=>s.status!=='finished'),finished=roomsCache.filter(s=>s.status==='finished');
  if(!live.length){const p=document.createElement('p');p.className='muted';p.textContent='Keine offenen Räume.';active.append(p)}
  for(const s of live)active.append(roomRow(s));
  for(const s of finished)archive.append(roomRow(s));
  if(!finished.length){const p=document.createElement('p');p.className='muted';p.textContent='Keine abgeschlossenen Räume.';archive.append(p)}
  $('archive-toggle').textContent=`${archiveOpen?'Archiv ausblenden':'Archiv anzeigen'} (${finished.length})`;
  archive.classList.toggle('hide',!archiveOpen);
}
$('archive-toggle').onclick=async()=>{archiveOpen=!archiveOpen;if(!archiveOpen&&selected?.status==='finished')await clearMonitor();renderRooms()};
async function loadRooms(){
  if(!db)return;
  const {data,error}=await db.from('kl_sessions').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){err(error);return}
  roomsCache=data||[];renderRooms();
  if(selected){const latest=roomsCache.find(s=>s.id===selected.id);if(latest){const wasLive=selected.status!=='finished';selected=latest;if(wasLive&&latest.status==='finished')await clearMonitor();else renderMonitorTitle()}}
}
async function update(s,status){
  const payload={status};if(status==='active')payload.ends_at=new Date(Date.now()+s.duration_seconds*1000).toISOString();
  const {error}=await db.from('kl_sessions').update(payload).eq('id',s.id);
  if(error){err(error);return}
  if(selected?.id===s.id){if(status==='finished')await clearMonitor();else{selected={...selected,...payload};renderMonitorTitle()}}
  await loadRooms();
}
async function clearMonitor(){selected=null;const old=sub;sub=null;if(old)await db.removeChannel(old);$('roomtitle').textContent='Kein Raum ausgewählt';$('stats').textContent='';$('people').replaceChildren()}
function renderMonitorTitle(){if(selected)$('roomtitle').textContent=`${selected.title} · Raumcode: ${selected.room_code} · ${selected.status}`}
async function selectRoom(s){const old=sub;sub=null;if(old)await db.removeChannel(old);selected=s;renderMonitorTitle();sub=db.channel('kl-teacher-'+s.id).on('postgres_changes',{event:'*',schema:'public',table:'kl_participants',filter:'session_id=eq.'+s.id},refresh).subscribe();refresh();}
async function refresh(){if(!selected)return;const roomId=selected.id;const {data,error}=await db.from('kl_participants').select('display_name,submitted_at,result,progress').eq('session_id',roomId).order('joined_at');if(!selected||selected.id!==roomId)return;if(error){err(error);return}const submitted=data.filter(p=>p.submitted_at).length;$('stats').textContent=`${submitted}/${data.length} abgegeben`;$('people').replaceChildren();for(const p of data){const tr=document.createElement('tr');const result=p.result;for(const value of [p.display_name,p.submitted_at?'Abgegeben':p.progress?'In Arbeit':'Verbunden',result?.correct!=null?`${result.correct}/${result.total}`:p.submitted_at?'Ohne Bewertung':'—']){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('people').append(tr)}}
setInterval(()=>{if(selected)refresh()},5000);setInterval(()=>{if(db&&$('app').classList.contains('hide')===false)loadRooms()},15000);
</script></body></html>
