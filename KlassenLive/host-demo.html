<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenLive · Bridge v1.1</title><style>body{font:15px system-ui;max-width:850px;margin:24px auto;padding:0 16px;color:#242424}button{background:#a91f32;color:white;border:0;padding:11px 15px;border-radius:8px;margin:4px;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}iframe{width:100%;height:430px;border:1px solid #ddd;border-radius:10px}pre{background:#f4f4f4;padding:14px;white-space:pre-wrap;max-height:220px;overflow:auto}#summary{font-weight:600}</style></head><body><h1>KlassenLive Bridge v1.1 · Demo</h1><p>Kiểm tra giao tiếp HTML ↔ KlassenLive. Chưa kết nối Supabase.</p><button id="start" disabled>Bắt đầu (60 giây)</button><button id="end" disabled>Yêu cầu nộp</button><p id="summary">Đang kết nối HTML…</p><iframe id="exercise" title="Exercise"></iframe><h3>Live messages</h3><pre id="log"></pre><script>
const frame=document.getElementById('exercise'),log=document.getElementById('log'),summary=document.getElementById('summary');const channel='KLASSENLIVE_V1',sessionId='demo-room-01',origin=location.origin;let ready=false,started=false,finished=false;
frame.src='exercise-demo.html?kl_origin='+encodeURIComponent(origin);
function send(type,data={}){if(!ready)return;frame.contentWindow.postMessage({channel,version:1,type,data:{sessionId,...data}},origin);}
window.addEventListener('message',e=>{
 if(e.source!==frame.contentWindow||e.origin!==origin||!e.data||e.data.channel!==channel||e.data.version!==1)return;
 const m=e.data;log.textContent+=JSON.stringify({type:m.type,data:m.data})+'\n';log.scrollTop=log.scrollHeight;
 if(m.type==='HELLO'){ready=true;send('INIT',{endsAt:null,mode:'test'});}
 if(m.type==='READY'&&!started){document.getElementById('start').disabled=false;summary.textContent='HTML đã kết nối · Sẵn sàng bắt đầu';}
 if(m.type==='SUBMITTED'){finished=true;document.getElementById('end').disabled=true;summary.textContent='Đã nhận bài nộp ('+(m.data.reason||'manual')+')';}
 if(m.type==='RESULT'){summary.textContent='Kết quả: '+m.data.correct+'/'+m.data.total+' câu đúng';}
});
document.getElementById('start').onclick=()=>{if(started||finished)return;started=true;document.getElementById('start').disabled=true;document.getElementById('end').disabled=false;send('INIT',{endsAt:new Date(Date.now()+60000).toISOString(),mode:'test'});send('START');summary.textContent='Đang làm bài · 60 giây';};
document.getElementById('end').onclick=()=>{if(started&&!finished)send('SUBMIT');};
</script></body></html>
