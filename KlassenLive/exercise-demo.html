<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenLive · HTML Übung</title><style>body{font:16px system-ui;max-width:550px;margin:24px auto;padding:0 18px;color:#242424}button{background:#a91f32;color:white;border:0;border-radius:9px;padding:12px 18px;font-size:16px;cursor:pointer}button:disabled,input:disabled{opacity:.55;cursor:not-allowed}input{box-sizing:border-box;padding:12px;font-size:16px;width:100%;margin:12px 0}#status{color:#666}#timer{font-weight:700;font-variant-numeric:tabular-nums}#timer.urgent{color:#a91f32}section{background:#f6f6f6;border-radius:12px;padding:18px}#feedback{font-weight:600}</style></head><body><h1>HTML Übung · Demo</h1><p id="status">Standalone-Modus: ohne KlassenLive nutzbar.</p><p id="timer" aria-live="off"></p><section><p><b>Ergänzen Sie:</b> Ich ___ heute Deutsch. (lernen)</p><input id="answer" autocomplete="off" placeholder="Antwort eingeben"><button id="submit">Prüfen und abgeben</button><p id="feedback"></p></section><script src="klassenlive-bridge.js"></script><script>
const $=id=>document.getElementById(id);let done=false;let active=!KlassenLive.connected;
function updateControls(){ $('answer').disabled=done||!active;$('submit').disabled=done||!active; }
KlassenLive.on('init',s=>{ $('status').textContent='Verbunden mit Sitzung '+s.sessionId;updateControls(); });
KlassenLive.on('start',()=>{if(done)return;active=true;$('status').textContent='Test gestartet';updateControls();});
KlassenLive.on('tick',({remainingMs})=>{if(remainingMs===null)return;const secs=Math.ceil(remainingMs/1000);$('timer').textContent='Verbleibende Zeit: '+String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');$('timer').classList.toggle('urgent',secs<=10);});
KlassenLive.on('submit-request',({reason})=>grade(reason));
KlassenLive.on('locked',()=>{active=false;done=true;$('timer').textContent='';$('timer').classList.remove('urgent');$('status').textContent='Test beendet';updateControls();});
function grade(reason='manual'){
 if(done||!active)return;done=true;
 const actual=$('answer').value.trim().toLocaleLowerCase('de');const correct=actual==='lerne';
 $('feedback').textContent=correct?'Richtig!':'Nicht richtig. Lösung: lerne';
 $('status').textContent=reason==='deadline'?'Zeit abgelaufen · automatisch abgegeben':'Abgegeben';$('timer').textContent='';$('timer').classList.remove('urgent');
 updateControls();
 KlassenLive.submit({reason,answers:[{questionId:'q1',answer:actual,isCorrect:correct}],correct:correct?1:0,total:1});
 KlassenLive.result({correct:correct?1:0,total:1});
}
$('submit').onclick=()=>grade();updateControls();
</script></body></html>
