<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KlassenLive · Schüler</title><style>body{font:16px system-ui;background:#f8f8f8;color:#222;margin:0}main{max-width:760px;margin:auto;padding:16px}h1{color:#a91f32}section{background:white;padding:18px;border-radius:14px;border:1px solid #ddd;margin:15px 0}input,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box}input{width:100%;border:1px solid #bbb;margin:8px 0}button{background:#a91f32;color:white;border:0}iframe{width:100%;height:560px;border:1px solid #ddd;border-radius:10px}.hide{display:none}#error{color:#b00020;white-space:pre-wrap}#timer{font-weight:bold}</style></head><body><main><h1>KlassenLive</h1><p id="error"></p><section id="join"><h2>Raum beitreten</h2><input id="code" placeholder="Raumcode"><input id="name" placeholder="Vor- und Nachname"><button id="joinbtn">Beitreten</button></section><section id="room" class="hide"><h2 id="title"></h2><p id="status"></p><p id="timer"></p><iframe id="exercise" title="Übung"></iframe><p id="result"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id),channel='KLASSENLIVE_V1';let db,token=sessionStorage.getItem('kl_token'),state=null,frameReady=false,started=false,sent=false,frameOrigin=null;const err=e=>$('error').textContent=e?.message||String(e||'');
if(!window.KL_CONFIG||!window.supabase||KL_CONFIG.anonKey.includes('PASTE_'))err('Thiếu config.js hoặc Supabase public key.');else{db=supabase.createClient(KL_CONFIG.url,KL_CONFIG.anonKey);if(token)poll();setInterval(()=>{if(token)poll()},2000)}
$('joinbtn').onclick=async()=>{err('');const {data,error}=await db.rpc('kl_join',{p_room_code:$('code').value,p_name:$('name').value});if(error){err(error);return}token=data.token;sessionStorage.setItem('kl_token',token);poll()};
function send(type,data={}){if(!frameReady||!state)return;$('exercise').contentWindow.postMessage({channel,version:1,type,data:{sessionId:state.session_id,...data}},frameOrigin)}
async function poll(){const {data,error}=await db.rpc('kl_student_state',{p_token:token});if(error){err(error);return}state=data;$('join').classList.add('hide');$('room').classList.remove('hide');$('title').textContent=data.title;$('status').textContent=data.status==='waiting'?'Warten auf Lehrer…':data.status==='active'?'Test läuft':'Test beendet';if(data.result){$('result').textContent=data.result.correct!=null?`Ergebnis: ${data.result.correct}/${data.result.total}`:'Abgegeben';sent=true}
if(!$('exercise').src||$('exercise').getAttribute('data-url')!==data.exercise_url){frameReady=false;started=false;const url=new URL(data.exercise_url);url.searchParams.set('kl_origin',location.origin);frameOrigin=url.origin;$('exercise').src=url.href;$('exercise').setAttribute('data-url',data.exercise_url)}
if(frameReady){send('INIT',{endsAt:data.ends_at,mode:data.activity});if(data.status==='active'&&!started&&!sent){started=true;send('START')}if((data.status==='finished'||data.submitted)&&!sent){send('SUBMIT');sent=true}if(data.status==='finished'||data.submitted){send('LOCK');started=false}}
const left=data.status==='finished'||data.submitted?null:data.ends_at?Math.max(0,Math.ceil((new Date(data.ends_at).getTime()-Date.now())/1000)):null;$('timer').textContent=left===null?'':`Zeit: ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;}
window.addEventListener('message',async e=>{if(!state||e.source!==$('exercise').contentWindow||e.origin!==frameOrigin||e.data?.channel!==channel||e.data?.version!==1)return;const m=e.data;if(m.type==='HELLO'){frameReady=true;send('INIT',{endsAt:state.ends_at,mode:state.activity});if(state.status==='active'&&!sent){started=true;send('START')}if(state.status==='finished'||state.submitted){send('LOCK');started=false}}if(m.type==='SUBMITTED'&&!sent){sent=true;const {error}=await db.rpc('kl_student_event',{p_token:token,p_kind:'submitted',p_payload:m.data});if(error)err(error);else poll()}if(m.type==='PROGRESS'||m.type==='SENTENCE_SUBMITTED'){await db.rpc('kl_student_event',{p_token:token,p_kind:'progress',p_payload:m.data})}});
</script></body></html>
