t früher in Berlin gewohnt.","vm":"ở (nơi ở)"},{"v":"leben","er":"lebt","perf":"hat gelebt","de":"am Leben sein und an einem Ort zu Hause sein","ex":"Meine Oma lebt in Hanoi.","vi":"Bà tôi sống ở Hà Nội.","pex":"Meine Oma hat früher in Hanoi gelebt.","vm":"sống"},{"v":"arbeiten","er":"arbeitet","perf":"hat gearbeitet","de":"einen Beruf ausüben","ex":"Mein Vater arbeitet im Krankenhaus.","vi":"Bố tôi làm việc ở bệnh viện.","pex":"Mein Vater hat gestern im Krankenhaus gearbeitet.","vm":"làm việc"},{"v":"heißen","er":"heißt","perf":"hat geheißen","de":"einen Namen haben","ex":"Wie heißt du?","vi":"Bạn tên là gì?","pex":"Er hat früher Peter geheißen.","note":"Im Alltag meist Präteritum: er hieß","vm":"tên là"},{"v":"essen","er":"isst","perf":"hat gegessen","de":"Nahrung zu sich nehmen","ex":"Wir essen heute Reis.","vi":"Hôm nay chúng tôi ăn cơm.","pex":"Wir haben gestern Reis gegessen.","vm":"ăn"},{"v":"trinken","er":"trinkt","perf":"hat getrunken","de":"ein Getränk zu sich nehmen","ex":"Ich trinke gern Wasser.","vi":"Tôi thích uống nước.","pex":"Ich habe gestern Wasser getrunken.","vm":"uống"},{"v":"fahren","er":"fährt","perf":"ist gefahren","de":"mit einem Fahrzeug unterwegs sein","ex":"Wir fahren mit dem Zug.","vi":"Chúng tôi đi tàu.","pex":"Wir sind gestern mit dem Zug gefahren.","vm":"đi (bằng xe)"},{"v":"lesen","er":"liest","perf":"hat gelesen","de":"geschriebene Wörter verstehen","ex":"Sie liest eine Zeitung.","vi":"Cô ấy đọc báo.","pex":"Sie hat gestern eine Zeitung gelesen.","vm":"đọc"},{"v":"schreiben","er":"schreibt","perf":"hat geschrieben","de":"Text mit der Hand oder am Computer machen","ex":"Ich schreibe eine E-Mail.","vi":"Tôi viết một email.","pex":"Ich habe gestern eine E-Mail geschrieben.","vm":"viết"},{"v":"hören","er":"hört","perf":"hat gehört","de":"mit den Ohren wahrnehmen","ex":"Er hört Musik.","vi":"Anh ấy nghe nhạc.","pex":"Er hat gestern Musik gehört.","vm":"nghe"},{"v":"sehen","er":"sieht","perf":"hat gesehen","de":"mit den Augen wahrnehmen", ,"pex":"Die Kinder haben gestern Fußball gespielt.","vm":"chơi"},{"v":"kochen","er":"kocht","perf":"hat gekocht","de":"Essen zubereiten","ex":"Ich koche eine Suppe.","vi":"Tôi nấu súp.","pex":"Ich habe gestern eine Suppe gekocht.","vm":"nấu ăn"},{"v":"backen","er":"backt","perf":"hat gebacken","de":"im Ofen zubereiten","ex":"Meine Mutter backt Brot.","vi":"Mẹ tôi nướng bánh mì.","pex":"Meine Mutter hat gestern Brot gebacken.","vm":"nướng (bánh)"},{"v":"waschen","er":"wäscht","perf":"hat gewaschen","de":"mit Wasser sauber machen","ex":"Er wäscht das Auto.","vi":"Anh ấy rửa xe.","pex":"Er hat gestern das Auto gewaschen.","vm":"rửa, giặt"},{"v":"putzen","er":"putzt","perf":"hat geputzt","de":"sauber machen","ex":"Wir putzen die Küche.","vi":"Chúng tôi dọn bếp.","pex":"Wir haben gestern die Küche geputzt.","vm":"lau dọn"},{"v":"duschen","er":"duscht","perf":"hat geduscht","de":"sich unter der Dusche waschen","ex":"Ich dusche am Morgen.","vi":"Tôi tắm vòi sen buổi sáng.","pex":"Ich habe heute Morgen geduscht.","vm":"tắm vòi sen"},{"v":"anziehen","er":"zieht an","perf":"hat angezogen","de":"Kleidung anlegen","ex":"Sie zieht eine Jacke an.","vi":"Cô ấy mặc áo khoác.","pex":"Sie hat gestern eine Jacke angezogen.","vm":"mặc (quần áo)"},{"v":"tragen","er":"trägt","perf":"hat getragen","de":"Kleidung anhaben oder etwas halten","ex":"Er trägt eine Brille.","vi":"Anh ấy đeo kính.","pex":"Er hat gestern eine Brille getragen.","vm":"mang, xách"},{"v":"treffen","er":"trifft","perf":"hat getroffen","de":"mit jemandem zusammenkommen","ex":"Ich treffe meine Freunde.","vi":"Tôi gặp bạn bè.","pex":"Ich habe gestern meine Freunde getroffen.","vm":"gặp"},{"v":"besuchen","er":"besucht","perf":"hat besucht","de":"zu jemandem oder an einen Ort gehen","ex":"Wir besuchen unsere Oma.","vi":"Chúng tôi thăm bà.","pex":"Wir haben gestern unsere Oma besucht.","vm":"thăm"},{"v":"helfen","er":"hilft","perf":"hat geholfen","de":"jemanden unterstützen","ex":"Kannst du mir helfen?","vi":"Bạn giúp tôi đư zen","er":"sitzt","perf":"hat gesessen","de":"auf einem Stuhl sein","ex":"Ich sitze am Fenster.","vi":"Tôi ngồi bên cửa sổ.","pex":"Ich habe gestern am Fenster gesessen.","note":"Süden/AT/CH: ist gesessen","vm":"ngồi"},{"v":"stehen","er":"steht","perf":"hat gestanden","de":"auf den Füßen sein","ex":"Der Mann steht vor der Tür.","vi":"Người đàn ông đứng trước cửa.","pex":"Der Mann hat gestern vor der Tür gestanden.","note":"Süden/AT/CH: ist gestanden","vm":"đứng"},{"v":"liegen","er":"liegt","perf":"hat gelegen","de":"waagerecht sein","ex":"Das Buch liegt auf dem Tisch.","vi":"Quyển sách nằm trên bàn.","pex":"Das Buch hat gestern auf dem Tisch gelegen.","note":"Süden/AT/CH: ist gelegen","vm":"nằm"},{"v":"stellen","er":"stellt","perf":"hat gestellt","de":"etwas aufrecht an einen Ort bringen","ex":"Ich stelle die Flasche auf den Tisch.","vi":"Tôi đặt chai lên bàn.","pex":"Ich habe gestern die Flasche auf den Tisch gestellt.","vm":"đặt (đứng)"},{"v":"legen","er":"legt","perf":"hat gelegt","de":"etwas flach an einen Ort bringen","ex":"Sie legt das Buch aufs Bett.","vi":"Cô ấy đặt sách lên giường.","pex":"Sie hat gestern das Buch aufs Bett gelegt.","vm":"đặt (nằm)"},{"v":"zeigen","er":"zeigt","perf":"hat gezeigt","de":"jemandem etwas sichtbar machen","ex":"Ich zeige dir den Weg.","vi":"Tôi chỉ đường cho bạn.","pex":"Ich habe dir gestern den Weg gezeigt.","vm":"chỉ, cho xem"},{"v":"schicken","er":"schickt","perf":"hat geschickt","de":"etwas an jemanden senden","ex":"Ich schicke dir ein Foto.","vi":"Tôi gửi bạn một tấm ảnh.","pex":"Ich habe dir gestern ein Foto geschickt.","vm":"gửi"},{"v":"einkaufen","er":"kauft ein","perf":"hat eingekauft","de":"Lebensmittel oder andere Dinge kaufen","ex":"Ich kaufe am Samstag im Supermarkt ein.","vi":"Tôi mua sắm ở siêu thị vào thứ Bảy.","pex":"Ich habe gestern im Supermarkt eingekauft.","vm":"đi mua sắm"},{"v":"frühstücken","er":"frühstückt","perf":"hat gefrühstückt","de":"am Morgen etwas essen","ex":"Ich frühstücke um sieben Uhr.","vi": as hast du gestern gemacht?","q3":"Wer macht die Hausaufgaben?","s1":"Ihr Freund sitzt am Tisch und bastelt. Sie wollen seine Tätigkeit erfahren.","s3":"Die Hausaufgaben sind noch offen. Sie wollen die zuständige Person erfahren."},{"verb":"lernen","vi":"Bạn muốn hỏi người bạn đang học ngôn ngữ nào.","ok":"Welche Sprache lernst du?","word":"Welche","q2":"Wie lange hast du Deutsch gelernt?","q3":"Wann lernst du Deutsch?","s1":"Ihr Kollege liest ein Heft mit Vokabeln. Sie wollen die Sprache erfahren.","s3":"Ihre Freundin hat einen Deutschkurs. Sie wollen die Zeit dafür erfahren."},{"verb":"sprechen","vi":"Bạn muốn hỏi người kia nói được tiếng Đức không tốt đến mức nào.","ok":"Wie gut sprichst du Deutsch?","word":"Wie gut","q2":"Mit wem hast du gestern gesprochen?","q3":"Wer spricht Deutsch?","s1":"Ihre Kollegin redet auf Deutsch mit Ihnen. Sie wollen ihr Niveau erfahren.","s3":"Im Flur hört man Deutsch. Sie wollen die sprechende Person erfahren."},{"verb":"wohnen","vi":"Bạn muốn hỏi người bạn sống ở thành phố nào.","ok":"In welcher Stadt wohnst du?","word":"In welcher Stadt","q2":"Wo hast du früher gewohnt?","q3":"Mit wem wohnst du?","s1":"Ihr neuer Nachbar zieht ein. Sie wollen seine Stadt erfahren.","s3":"Ihre Freundin wohnt nicht allein. Sie wollen die Person im Haushalt erfahren."},{"verb":"arbeiten","vi":"Bạn muốn hỏi người kia làm việc ở đâu.","ok":"Wo arbeitest du?","word":"Wo","q2":"Wo hast du gestern gearbeitet?","q3":"Wie lange arbeitest du heute?","s1":"Ihre Freundin hat einen neuen Job. Sie wollen den Arbeitsort erfahren.","s3":"Ihr Kollege hat heute viel zu tun. Sie wollen die Dauer seiner Arbeit erfahren."},{"verb":"heißen","vi":"Bạn muốn hỏi tên người đối diện.","ok":"Wie heißen Sie?","word":"Wie","q2":"Wie hat die Straße früher geheißen?","q3":"Wie heißt dein Bruder?","s1":"Eine Frau stellt sich vor, aber Sie verstehen den Namen nicht. Sie fragen höflich mit „Sie“.","s3":"Sie sehen das Foto von Ihrem Freund und seinem Bruder. Sie wollen den Namen des Bruders erfahren."},{"verb":"essen","vi":"Bạn muốn hỏi người bạn muốn ăn gì tối nay.","ok":"Was möchtest du heute Abend essen?","word":"Was","q2":"Was hast du gestern gegessen?","q3":"Wann essen wir?","s1":"Ihre Freundin lädt Sie zum Abendessen ein. Sie wollen ihren Wunsch erfahren.","s3":"Es ist schon spät und alle haben Hunger. Sie wollen die Uhrzeit des Essens erfahren."},{"verb":"trinken","vi":"Bạn muốn hỏi người bạn muốn uống gì.","ok":"Was möchtest du trinken?","word":"Was","q2":"Was hast du heute getrunken?","q3":"Wer trinkt Kaffee?","s1":"Im Café kommt der Kellner. Sie fragen Ihren Gast nach seinem Wunsch.","s3":"Auf dem Tisch steht eine Kaffeekanne. Sie wollen die trinkende Person erfahren."},{"verb":"fahren","vi":"Bạn muốn hỏi chuyến tàu đi đến đâu.","ok":"Wohin fährt dieser Zug?","word":"Wohin","q2":"Wohin ist der Zug gefahren?","q3":"Wann fährt der Bus?","s1":"Sie stehen am Bahnhof vor einem Zug. Sie wollen sein Ziel erfahren.","s3":"Sie warten an der Haltestelle. Sie wollen die Abfahrtszeit des Busses erfahren."},{"verb":"lesen","vi":"Bạn muốn hỏi người bạn đang đọc quyển sách nào.","ok":"Welches Buch liest du gerade?","word":"Welches","q2":"Was hast du gestern gelesen?","q3":"Wer liest das Buch?","s1":"Ihr Freund hält ein Buch in der Hand. Sie wollen wissen, welches.","s3":"Auf dem Tisch liegt ein Buch. Sie wollen die lesende Person erfahren."},{"verb":"schreiben","vi":"Bạn muốn hỏi người bạn đang viết cho ai.","ok":"Wem schreibst du eine Nachricht?","word":"Wem","q2":"Wem hast du geschrieben?","q3":"Was schreibt der Lehrer an die Tafel?","s1":"Ihr Freund tippt am Handy. Sie wollen den Empfänger erfahren.","s3":"Der Lehrer steht an der Tafel. Sie wollen den Inhalt erfahren."},{"verb":"hören","vi":"Bạn muốn hỏi người bạn thích nghe nhạc gì.","ok":"Welche Musik hörst du gern?","word":"Welche","q2":"Was hast du gehört?","q3":"Wann hörst du Musik?","s1":"Ihr Freund trägt Kopfhörer. Sie wollen seine Lieblingsmusik erfahren.","s3":"Ihre Freundin mag Musik am üssel ist weg. Sie wollen den Suchort Ihres Freundes erfahren."},{"verb":"finden","vi":"Bạn muốn hỏi người bạn tìm thấy chìa khóa ở đâu.","ok":"Wo hast du den Schlüssel gefunden?","word":"Wo","q2":"Wo kann ich einen Parkplatz finden?","q3":"Wie findest du den Film?","s1":"Ihr Kollege hat seinen Schlüssel wieder. Sie wollen den Fundort erfahren.","s3":"Sie sprechen über einen neuen Film. Sie wollen die Meinung Ihres Freundes erfahren."},{"verb":"nehmen","vi":"Bạn muốn hỏi nên đi xe buýt nào.","ok":"Welchen Bus soll ich nehmen?","word":"Welchen","q2":"Welchen Bus hast du genommen?","q3":"Was nimmst du zum Frühstück?","s1":"Sie sind an der Haltestelle mit drei Bussen. Sie wollen die richtige Linie erfahren.","s3":"Ihr Freund bestellt das Frühstück. Sie wollen sein Essen erfahren."},{"verb":"geben","vi":"Bạn muốn hỏi ai đưa người bạn quyển sách.","ok":"Wer gibt dir das Buch?","word":"Wer","q2":"Was hast du ihm gegeben?","q3":"Wann gibst du mir das Buch?","s1":"Ihr Kollege hat ein Buch für Sie. Sie wollen den Geber erfahren.","s3":"Sie warten auf ein Buch. Sie wollen die Zeit der Übergabe erfahren."},{"verb":"bringen","vi":"Bạn muốn hỏi người bạn mang gì cho mình.","ok":"Was bringst du mir?","word":"Was","q2":"Was hast du mir gebracht?","q3":"Wer bringt die Getränke?","s1":"Ihr Freund kommt mit einer Tüte. Sie wollen wissen, was er Ihnen bringt.","s3":"Sie planen ein Fest. Sie wollen die Person für die Getränke erfahren."},{"verb":"holen","vi":"Bạn muốn hỏi khi nào người bạn đi lấy hành lý.","ok":"Wann holst du deinen Koffer?","word":"Wann","q2":"Wann hast du den Koffer geholt?","q3":"Wer holt die Kinder?","s1":"Ihr Freund ist am Flughafen. Sie wollen die Zeit für seinen Koffer erfahren.","s3":"Die Kinder warten vor der Schule. Sie wollen die abholende Person erfahren."},{"verb":"bleiben","vi":"Bạn muốn hỏi người bạn ở lại bao lâu.","ok":"Wie lange bleibst du hier?","word":"Wie lange","q2":"Wie lange bist du geblieben?","q3":"Wo bleibst du heute Abend?","s1":"Ihr Gast ha const shuffled=a=>{let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x};
const AUX=/\b(bin|bist|ist|sind|seid|habe|hast|hat|haben|habt)\b/i,SW={bin:'habe',bist:'hast',ist:'hat',sind:'haben',seid:'habt',habe:'bin',hast:'bist',hat:'ist',haben:'sind',habt:'seid'},WD={bin:'werde',habe:'werde',bist:'wirst',hast:'wirst',ist:'wird',hat:'wird',sind:'werden',haben:'werden',seid:'werdet',habt:'werdet'};
const cs=(w,r)=>w[0]===w[0].toUpperCase()?r[0].toUpperCase()+r.slice(1):r,cap=x=>x[0].toUpperCase()+x.slice(1),cl=s=>s.replace(/\s+/g,' ').replace(/ \?/,'?').trim();

function makeSentence(v){const p=v.perf.split(' ').pop(),aux=v.pex.match(AUX)[0],blank=v.pex.replace(AUX,'___').replace(p,'___'),toks=v.ex.replace(/[.?!]$/,'').split(' '),same=V.filter(x=>x.vm===v.vm).map(x=>x.v);
return [{t:'order',ins:'Übersetze ins Deutsche. Tippe die Wörter in der richtigen Reihenfolge.',main:v.vi,vi:1,tokens:toks,end:endP(v.ex),correct:toks.join(' '),show:v.ex,why:`Richtig: ${v.ex}`,say:v.ex},
{t:'type',ins:`Schreibe Hilfsverb + Partizip II (${v.v}).`,main:blank,correct:aux+' '+p,show:v.pex,why:`Perfekt: ${v.perf}`,say:v.pex},
{t:'type',ins:'Wie heißt das Verb auf Deutsch? (Infinitiv)',main:v.vm,vi:1,correct:v.v,alt:same,show:v.v,why:`${v.vm} = ${same.join(' / ')}`,say:v.v}]}
const GRP=x=>/^(Wo|Wohin)$|^(In|An) welche/.test(x)?'P':/^(Wann|Um wie viel Uhr|Wie lange)$/.test(x)?'T':/^(Wer|Wen|Wem|Mit wem|Auf wen|An wen)$/.test(x)?'M':/^(Wie viele|Für wie viele)$/.test(x)?'N':x==='Warum'?'R':(x==='Wie'||x==='Wie gut')?'W':x.startsWith('Welch')?'S':'X';
const WPOOL=['Wo','Wann','Wer','Was','Wie','Wohin','Warum','Wen','Wem','Wie lange','Wie viele','Um wie viel Uhr','Mit wem','Auf wen'];
const WLIST=["Um wie viel Uhr", "Für wie viele", "In welcher Stadt", "An welcher Haltestelle", "Wie viele", "Wie lange", "Wie gut", "Wie oft", "Mit wem", "Auf wen", "An wen", "Wohin", "Wann", "Warum", "Wer", "Wen", "Wem", "Was", "Wo", "Wie", "Welchen", "Welches", "Welche"];
function qInfo(q,word){word=word||WLIST.find(x=>q.startsWith(x+' '));const nx=/^(Welch|Wie viele|Für wie viele)/.test(word)?1:0,bits=q.slice(word.length).trim().replace(/\?$/,'').split(' '),P=(word+' '+bits.slice(0,nx).join(' ')).trim(),verb=bits[nx],tail=bits.slice(nx+1);return{word,q,verb,tail,gap:cl(P+' ___ '+tail.join(' ')+'?'),toks:q.replace(/\?$/,'').split(' ')}}

return [{t:'order',ins,main:w.s1,sit:1,tokens:x.toks,end:'?',correct:x.toks.join(' '),show:x.q,why:`Richtig: ${x.q}`,say:x.q},
{t:'order',ins,main:w.s3,sit:1,tokens:z.toks,end:'?',correct:z.toks.join(' '),show:z.q,why:`Richtig: ${z.q}`,say:z.q},

const KIND={type:'EINTIPPEN',order:'SATZ BAUEN',tf:'RICHTIG / FALSCH',mc:'AUSWAHL'};
function taskRender(id,arr){const root=$(id);
root.innerHTML=arr.map((q,i)=>{const t=q.t||'mc';let body='';
if(t==='mc')body='<div class="opts">'+shuffled([...new Set(q.choices)]).map(o=>`<button class="option" data-value="${esc(o)}"><span>${esc(o)}</span></button>`).join('')+'</div>';
else if(t==='tf')body='<div class="tf"><button class="option" data-value="1">✓ Richtig</button><button class="option" data-value="0">✗ Falsch</button></div>';
else if(t==='type')body='<div class="typebox"><input class="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eingeben …" aria-label="Antwort"><button class="btn sm" data-check="1">Prüfen</button></div>';
else{let sh=shuffled(q.tokens);if(sh.join(' ')===q.correct)sh.reverse();body=`<div class="built" data-end="${esc(q.end||'')}" aria-label="Dein Satz"></div><div class="bank">${sh.map(x=>`<button class="chip">${esc(x)}</button>`).join('')}</div><button class="btn sm" data-check="1">Prüfen</button>`}
return `<div class="task" data-n="${i}"><div class="tasknum">${KIND[t]}</div><div class="ins">${esc(q.ins)}</div><div class="main${q.vi?' vi':''}${q.sit?' sit':''}">${esc(q.main).replace(/___/g,'<span class="blank"></span>')}</div>${body}<div class="feedback" aria-live="polite" hidden></div></div>`}).join('');
const finish=(el,q,ok)=>{el.dataset.done=1;el.querySelectorAll('button,input').forEach(x=>x.disabled=true);const fb=el.querySelector('.feedback');fb.hidden=false;fb.innerHTML=`<b>${ok?'✓ Richtig':'✗ Noch nicht richtig'} · ${esc(q.show||q.correct)}</b>${ok?'':`<div>${esc(q.why)}</div>`}<button class="speaker" data-read="1" aria-label="Lösung anhören">${icons.volume}</button>`;fb.querySelector('[data-read]').onclick=()=>say(q.say||q.correct)};
root.onclick=e=>{const el=e.target.closest('[data-n]');if(!el||el.dataset.done)return;const q=arr[+el.dataset.n],t=q.t||'mc',chip=e.target.closest('.chip');
if(chip){const bank=el.querySelector('.bank'),built=el.querySelector('.built');(chip.parentNode===bank?built:bank).appendChild(chip);return}

if(o){const ok=o.dataset.value===String(q.correct);el.querySelectorAll('.option').forEach(x=>{if(x.dataset.value===String(q.correct))x.classList.add('correct');else if(x===o)x.classList.add('wrong')});finish(el,q,ok);return}
if(e.target.closest('[data-check]')){let ok;if(t==='type'){const val=el.querySelector('.ans').value.trim();if(!val)return;ok=[q.correct,...(q.alt||[])].some(a=>norm(a)===norm(val.replace(/\s+/g,' ')))}else{const got=[...el.querySelectorAll('.built .chip')].map(c=>c.textContent).join(' ');if(!got)return;ok=got===q.correct}finish(el,q,ok)}};
root.onkeydown=e=>{if(e.key==='Enter'&&e.target.classList.contains('ans'))e.target.closest('.task').querySelector('[data-check]').click()}}
