<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Vorstellung", "mode": "lesen", "text": "Mein Name ist Anna. Ich komme aus Österreich und lebe seit drei Jahren in Deutschland. Ich bin 15 Jahre alt und habe zwei Geschwister: Meine Schwester heißt Klara und ist 13 Jahre alt, mein Bruder Michael ist 18 Jahre alt. Wir wohnen mit unseren Eltern in einem Haus in der Nähe von München. Meine Mutter ist Köchin, mein Vater arbeitet in einer Bank.\n\nIch lese gerne und mag Tiere: Wir haben einen Hund, zwei Katzen und im Garten einen Teich mit Goldfischen. Ich gehe auch gerne in die Schule, mein Lieblingsfach ist Mathematik. Physik und Chemie mag ich nicht so gerne.\n\nNach der Schule gehe ich oft mit meinen Freundinnen im Park spazieren, manchmal essen wir ein Eis. Am Samstag gehen wir oft ins Kino. Am Sonntag schlafe ich lange, dann koche ich mit meiner Mutter das Mittagessen. Nach dem Essen gehen wir mit dem Hund am See spazieren. Sonntag ist mein Lieblingstag!", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wie alt ist Annas Schwester?", "options": ["zwölf Jahre", "dreizehn Jahre", "vierzehn Jahre", "fünfzehn Jahre"], "answer": 1}, {"type": "mc", "q": "Wo arbeitet Annas Vater?", "options": ["in einer Bank", "in Österreich", "im Kino", "in der Schule"], "answer": 0}, {"type": "mc", "q": "Was ist Annas Lieblingsfach in der Schule?", "options": ["Physik", "Mathematik", "Chemie", "Kochen"], "answer": 1}, {"type": "mc", "q": "Was macht Anna nach der Schule?", "options": ["Sie geht ins Kino.", "Sie kocht das Mittagessen.", "Sie schläft lange.", "Sie geht mit ihren Freundinnen spazieren."], "answer": 3}, {"type": "mc", "q": "Wo geht die Familie am Sonntag mit dem Hund spazieren?", "options": ["im Garten", "im Park", "am See", "im Haus"], "answer": 2}, {"type": "mc", "q": "Woher kommt Anna?", "options": ["Aus Österreich", "Aus Deutschland", "Aus der Schweiz", "Aus München"], "answer": 0}, {"type": "mc", "q": "Welche Tiere hat Annas Familie?", "options": ["Zwei Hunde und eine Katze", "Einen Hund, zwei Katzen und Goldfische", "Einen Hund und einen Vogel", "Nur Fische"], "answer": 1}, {"type": "tf", "q": "Annas Bruder ist älter als Anna.", "answer": true}, {"type": "tf", "q": "Anna mag Physik und Chemie nicht so gern.", "answer": true}, {"type": "tf", "q": "Anna kocht am Samstag mit ihrer Mutter das Mittagessen.", "answer": false}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
