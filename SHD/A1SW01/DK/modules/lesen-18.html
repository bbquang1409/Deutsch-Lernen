<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Pläne für die Freizeit", "mode": "lesen", "level": "A2", "text": "Für das Wochenende und die Ferien mache ich gern Pläne. An den freien Samstagen und Sonntagen werde ich lange schlafen. Dann klingelt der Wecker nicht. Aber ich werde für die Wochenenden nicht zu viel planen, weil ich gern faul bin und nichts tue. Aber ich werde vielleicht zum Sport gehen. Manchmal habe ich am Wochenende ein Turnier.\n\nDiesen Sonntag zum Beispiel werde ich mit meinem Team in eine andere Stadt fahren. Wir werden dort ein Match gegen einen anderen Hockeyverein spielen. Das wird bestimmt ein Spaß. Wenn das Wetter schön ist, werde ich anschließend mit meinen Freunden schwimmen gehen. In der Nähe gibt es einen See, der wird schon warm genug sein.\n\nWenn ich länger frei habe, mache ich gerne größere Pläne. In den Sommerferien werde ich sehr oft mit meinen Freunden unterwegs sein. Wir werden zum See fahren. Dort werden wir im Zelt übernachten und beim Lagerfeuer sitzen. Eine oder zwei Wochen möchte ich gerne reisen.\n\nEin Freund wird mich auf der Reise begleiten, wir werden mit dem Zug losfahren. Wir planen eine Route durch das ganze Land, von West bis Ost und von Süd bis Nord. Mit Rucksäcken und Wanderschuhen werden wir auch in die Berge fahren. Am liebsten würde ich dort in einer Hütte übernachten. Wir werden sehen, ob wir das auch schaffen werden. Ein Abenteuer wird es aber ganz bestimmt.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Was macht der Erzähler am liebsten am Wochenende?", "options": ["Lernen", "Faul sein", "Viel essen", "In die Berge fahren"], "answer": 1}, {"type": "mc", "q": "Welchen Sport macht er manchmal am Wochenende?", "options": ["Tennis spielen", "Wandern", "Hockey spielen", "Laufen"], "answer": 2}, {"type": "mc", "q": "Was macht er gern mit Freunden am Wochenende?", "options": ["Schwimmen gehen", "Faul sein", "Shoppen", "Wandern"], "answer": 0}, {"type": "mc", "q": "Was plant der Erzähler mit den Freunden im Sommer?", "options": ["Eine Radtour", "Zum See fahren und dort im Zelt übernachten", "In einen Vergnügungspark fahren", "Schach spielen"], "answer": 1}, {"type": "mc", "q": "Welche größeren Pläne hat er in den Sommerferien?", "options": ["Einen Urlaub am Meer", "Campen mit Zelt in den Bergen", "Eine Reise in die nächste Stadt", "Eine Route mit dem Zug durch das ganze Land"], "answer": 3}, {"type": "tf", "q": "Der Erzähler plant für die Wochenenden sehr viel.", "answer": false}, {"type": "tf", "q": "Diesen Sonntag spielt er mit seinem Team gegen einen anderen Hockeyverein.", "answer": true}, {"type": "tf", "q": "Im Sommer übernachtet er mit Freunden im Hotel.", "answer": false}, {"type": "order", "q": "Der Sonntag", "options": ["Anschließend mit Freunden schwimmen gehen", "Mit dem Team in eine andere Stadt fahren", "Im Sommer zum See fahren", "Ein Hockeymatch spielen"], "answer": ["Mit dem Team in eine andere Stadt fahren", "Ein Hockeymatch spielen", "Anschließend mit Freunden schwimmen gehen", "Im Sommer zum See fahren"]}, {"type": "order", "q": "Die Sommerferien", "options": ["Am Lagerfeuer sitzen", "Mit dem Zug auf Reise gehen", "Zum See fahren", "Im Zelt übernachten"], "answer": ["Zum See fahren", "Im Zelt übernachten", "Am Lagerfeuer sitzen", "Mit dem Zug auf Reise gehen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
