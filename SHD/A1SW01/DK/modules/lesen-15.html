<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "In der Schule", "mode": "lesen", "level": "A2", "text": "Ich gehe gerne in die Schule. In der Klasse sind 30 Schüler. Es sind Mädchen und Jungen. Die meisten Lehrer sind nett und der Schuldirektor auch. Neben mir in der Schulbank sitzt mein bester Freund Klaus. Florian ist ein Klassenkamerad. Er ist auch ein Freund. Im Rucksack habe ich ein Buch, Papier zum Schreiben, zwei Kugelschreiber, Buntstifte, Bleistifte und einen Radiergummi. Das Lineal brauche ich für Mathematik. Da bin ich nicht gut. Ich verstehe die Aufgaben nicht richtig.\n\nIn der Pause ist es immer lustig. Wir essen und trinken etwas. In einer großen Pause gehen wir in den Hof und spielen Fußball. Diese Pause ist immer zu kurz.\n\nIch mag nicht alle Schulfächer gleich gerne. Sport ist mein Lieblingsfach. Sport könnte jeden Tag sein. Deutsch ist eine schwere Sprache. Ich muss viele Übungen machen. Dann kann ich es bald besser. Englisch spreche ich gut. Ich mache nur wenige Fehler. Auch Biologie und Kunst habe ich gerne. Biologie ist interessant. Ich mag Tiere. Auch Geschichte interessiert mich sehr.\n\nVor den Ferien schreiben wir noch zwei Schularbeiten. Eine in Deutsch und eine in Englisch. Ich hoffe, ich bekomme eine gute Note.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wie viele Schüler sind in der Klasse?", "options": ["Genau dreißig Schüler", "Mehr als dreißig Schüler", "Etwa zwanzig Schüler", "Weniger als zwanzig Schüler"], "answer": 0}, {"type": "mc", "q": "Wie heißt der Klassenkamerad?", "options": ["Peter", "Michael", "Ahmed", "Florian"], "answer": 3}, {"type": "mc", "q": "Was ist das Lieblingsfach?", "options": ["Deutsch", "Mathematik", "Sport", "Geschichte"], "answer": 2}, {"type": "mc", "q": "Wie viele Schularbeiten werden noch geschrieben?", "options": ["Keine", "Eine", "Zwei", "Drei"], "answer": 2}, {"type": "mc", "q": "Was ist im Rucksack?", "options": ["Eine Jacke", "Ein Ball", "Ein Buch", "Ein Brot"], "answer": 2}, {"type": "tf", "q": "In der großen Pause spielen die Schüler im Hof Fußball.", "answer": true}, {"type": "tf", "q": "Der Erzähler versteht Mathematik sehr gut.", "answer": false}, {"type": "tf", "q": "Die große Pause ist dem Erzähler zu lang.", "answer": false}, {"type": "order", "q": "Schule und Ferien", "options": ["In die Ferien fahren", "Im Klassenzimmer sitzen", "Vor den Ferien zwei Schularbeiten schreiben", "In der großen Pause Fußball spielen"], "answer": ["Im Klassenzimmer sitzen", "In der großen Pause Fußball spielen", "Vor den Ferien zwei Schularbeiten schreiben", "In die Ferien fahren"]}, {"type": "order", "q": "Deutsch lernen", "options": ["Eine Schularbeit in Deutsch schreiben", "Viele Deutschübungen machen", "Auf eine gute Note hoffen", "Deutsch bald besser können"], "answer": ["Viele Deutschübungen machen", "Deutsch bald besser können", "Eine Schularbeit in Deutsch schreiben", "Auf eine gute Note hoffen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
