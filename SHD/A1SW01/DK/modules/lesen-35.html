<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Der Samstagsmarkt", "mode": "lesen", "text": "Jeden Samstag findet im Herzen der Innenstadt ein animierter Markt statt. Die vielfältigen Marktstände offerieren eine Fülle an frischen Nahrungsmitteln, handgefertigten Erzeugnissen und Kunsthandwerk. Die passionierten Verkäufer präsentieren mit Stolz ihre vielseitigen Waren, während die Kundschaft anmutig zwischen den Ständen flaniert. Viele führen ihre geräumigen Einkaufstaschen mit sich, um erlesenes Obst, Gemüse und andere Gaumenfreuden zu erwerben. Die Marktbesucher haben ferner die Gelegenheit, regionale Delikatessen zu degustieren. Einige Händler offerieren Kostproben ihrer exquisiten Produkte, und die Anwesenden erfreuen sich an der kulinarischen Finesse. Der Markt erweist sich nicht nur als Anlaufstelle für Einkäufe, sondern auch als zentraler Treffpunkt für die lokale Gemeinschaft. Die Menschen pflegen angeregte Gespräche, teilen ihre Einkaufsgeheimnisse und ergötzen sich an der lebendigen Atmosphäre. Nach dem beschaulichen Marktbummel suchen zahlreiche Besucher die benachbarten Cafés und Restaurants auf, um sich zu entspannen und den Samstag in vollen Zügen zu genießen.", "source": "", "questions": [{"type": "mc", "q": "Wo findet der Markt statt?", "options": ["Am Stadtrand", "Im Park", "Im Herzen der Innenstadt", "Vor der Schule"], "answer": 2}, {"type": "mc", "q": "Wie oft findet der Markt statt?", "options": ["Jeden Sonntag", "Einmal im Monat", "Jeden Tag", "Jeden Samstag"], "answer": 3}, {"type": "mc", "q": "Was bieten die Marktstände an?", "options": ["Frische Lebensmittel, handgefertigte Waren und Kunsthandwerk", "Autos und Möbel", "Kleidung und Schuhe", "Nur Obst"], "answer": 0}, {"type": "mc", "q": "Warum haben viele Besucher Einkaufstaschen dabei?", "options": ["Sie verkaufen eigene Waren.", "Sie kaufen Obst, Gemüse und andere Leckereien.", "Es regnet.", "Sie gehen danach in die Schule."], "answer": 1}, {"type": "mc", "q": "Was bieten einige Händler den Besuchern an?", "options": ["Kostenlose Taschen", "Livemusik", "Kostproben ihrer Produkte", "Kaffee und Kuchen"], "answer": 2}, {"type": "mc", "q": "Wohin gehen viele Besucher nach dem Marktbummel?", "options": ["Nach Hause", "In ein Museum", "Zur Arbeit", "In benachbarte Cafés und Restaurants"], "answer": 3}, {"type": "mc", "q": "Was bedeutet „flanieren“ im Text?", "options": ["gemütlich spazieren gehen", "schnell rennen", "laut sprechen", "Waren verkaufen"], "answer": 0}, {"type": "mc", "q": "Was bedeutet „degustieren“ im Text?", "options": ["bezahlen", "probieren", "verpacken", "verkaufen"], "answer": 1}, {"type": "tf", "q": "Der Markt ist nur zum Einkaufen da.", "answer": false}, {"type": "tf", "q": "Die Verkäufer sind stolz auf ihre Waren.", "answer": true}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
