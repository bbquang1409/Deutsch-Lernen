function renderReport(){let e=0,f=0,attempt=0;for(let i=0;i<DATA.emails.length;i++){let r=store.email[i];if(r){e+=Object.values(r.checked||{}).filter(x=>x==='good').length;attempt+=Object.keys(r.answers||{}).filter(j=>r.answers[j]?.trim()).length}}for(let i=0;i<DATA.forms.length;i++){let r=store.form[i];if(r){f+=Object.values(r.checked||{}).filter(x=>x==='good').length;attempt+=Object.keys(r.answers||{}).filter(j=>r.answers[j]?.trim()).length}}$('main').innerHTML=`<div class="kicker">Lernpass · nur lokal</div><h2>Dein Lernfortschritt</h2><p class="sub">Deine Eingaben bleiben auf diesem Gerät und in diesem Browser gespeichert.</p><div class="results"><div class="result"><strong>${Object.values(store.guide||{}).filter(Boolean).length}/8</strong><span>Lernkarten verstanden</span></div><div class="result"><strong>${e}/120</strong><span>Satzbausteine erkannt</span></div><div class="result"><strong>${f}/75</strong><span>Formularfelder richtig</span></div><div class="result"><strong>${attempt}</strong><span>ausgefüllte Eingaben</span></div></div><div class="prompt"><strong>HINWEIS ZUR AUSWERTUNG</strong><p>„Erkannt“ heißt Übereinstimmung mit hinterlegten Musterlösungen. Es ist keine amtliche Prüfungsnote und keine vollständige Beurteilung deiner E-Mail.</p></div><div class="actions"><button class="btn primary" id="export">Lernpass als TXT exportieren</button><button class="btn" id="reset">Alle Eingaben löschen</button></div>`;$('export').onclick=()=>{let txt=`SHD Schreibwerkstatt A1+\nDatum: ${new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}\nSatzbausteine erkannt: ${e}/120\nFormularfelder richtig: ${f}/75\nAusgefüllte Eingaben: ${attempt}\n\nLokal gespeichert; keine automatische Synchronisierung.\nRegelbasierter Abgleich, keine Prüfungsnote.\n`;let url=URL.createObjectURL(new Blob([txt],{type:'text/plain;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='SHD-Schreibwerkstatt-Lernpass.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)};$('reset').onclick=()=>{if(confirm('Alle Antworten und Fortschritte auf diesem Gerät wirklich löschen?')){store={email:{},form:{},guide:{}};persist();render()}}}
function updateCount(){$('globalCount').textContent=score()}function render(){document.body.classList.toggle('start-reading',state.tab==='guide');document.querySelector('.layout').classList.toggle('single-column',state.tab==='guide'||state.tab==='report');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));renderSide();clearInterval(tint);if(state.tab==='email')renderEmail();else if(state.tab==='form')renderForm();else if(state.tab==='guide')renderGuide();else renderReport();updateCount();window.scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.idx=0;render()});render();
</script></body></html>
