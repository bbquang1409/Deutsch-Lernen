 if(single){const f=it.fields[0];el.innerHTML='<button class="mini" type="button" aria-label="Abspielen">▶</button><div class="mid"><label class="lab">'+esc(it.label)+'</label><input autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res1"></div></div><div class="sub" style="flex-direction:column;margin:0"><button class="slow" type="button" title="Langsam">🐢</button><button class="slow tip" type="button" title="Tipp">💡</button></div>';
  btn=$('.mini',el);res=$('.res1',el);inputs=[$('input',el)];$('.slow',el).onclick=()=>playClip(it.audio,.7,btn);$('.tip',el).onclick=hint;
  inputs[0].addEventListener('keydown',e=>{if(e.key=='Enter')el._c()});
  el._c=()=>{const g=check(f,inputs[0].value);inputs[0].style.borderColor=g?'var(--ok)':'var(--amber)';res.innerHTML=g?'<span class="gut">✓ richtig</span>':'<span class="fast">→ '+esc(ansTxt(f))+(it.script&&it.script!=f.ans?' <span class="lab">('+esc(it.script)+')</span>':'')+'</span>';const r={ok:g?1:0,total:1};done(r);return r};
 }else{el.innerHTML='<div class="q">'+esc(it.label)+'</div><button class="hear" type="button">▶ Hören</button><div class="sub"><button class="slow" type="button">🐢 Langsam</button><button class="slow tip" type="button">💡 Tipp</button></div><div class="fs">'+it.fields.map(f=>'<div><label>'+esc(f.lab)+'<input autocomplete="off" autocapitalize="off" spellcheck="false"></label><span class="ans">→ '+esc(ansTxt(f))+'</span></div>').join('')+'</div><div class="row"><button class="txb" type="button">Text zeigen</button></div><p class="lab tx" hidden></p>'+(it.hint?'<p class="lab">💡 '+esc(it.hint)+'</p>':'');
  btn=$('.hear',el);inputs=$$('.fs input',el);$$('.slow',el)[0].onclick=()=>playClip(it.audio,.7,btn);$('.tip',el).onclick=hint;const tx=$('.tx',el);tx.textContent=it.script;$('.txb',el).onclick=()=>{tx.hidden=!tx.hidden};
  el._c=()=>{let ok=0;$$('.fs>div',el).forEach((w,k)=>{const g=check(it.fields[k],inputs[k].value);w.classList.toggle('ok',g);w.classList.toggle('bad',!g);if(g)ok++});const r={ok,total:it.fields.length};done(r);return r}}
 btn.onclick=()=>playClip(it.audio,1,btn);return {el,check:()=>el._c()}}
function trainer(){head('Teil 1 trainieren','Namen · Zahlen · Telefon · Tabellen','#/');card('So üben Sie','Fangen Sie bei Stufe A an. Jede Aufgabe: so oft hören, wie Sie möchten. „🐢“ = langsam, „💡“ = Tipp. Nicht sicher? Schreiben Sie trotzdem etwas!');
 Object.keys(STAGES).forEach(k=>{const ids=TR.map((x,i)=>i).filter(i=>TR[i].stage==k),dn=ids.filter(i=>store.get('d_'+i)).length,a=mk('a','sit');a.href='#/d/'+k;a.innerHTML='<span class="n">'+k+'</span><span><b>'+esc(STAGES[k].t)+'</b><small>'+esc(STAGES[k].d)+'</small></span><span class="chip'+(dn==ids.length?' ok':'')+'" style="margin-left:auto">'+dn+'/'+ids.length+'</span>';app.appendChild(a)})}
function stage(k){const S=STAGES[k];head('Stufe '+k+' · '+S.t,S.d,'#/d');const c=card('Tipps','');S.tips.forEach(t=>c.appendChild(mk('p','hint','• '+esc(t))));if(S.alpha)c.appendChild(alphabet());
 const idx=TR.map((x,i)=>i).filter(i=>TR[i].stage==k),subs=[...new Set(idx.map(i=>TR[i].sub))],all=[];
 subs.forEach(sub=>{let list=idx.filter(i=>TR[i].sub==sub);if(TR[list[0]].shuffle)list=shuffle(list);const cc=card(sub,'');list.forEach(i=>{const r=trItem(i);cc.appendChild(r.el);all.push(r)})});
 const c2=card('','');const b=mk('button','go','Alle prüfen'),out=mk('p','score');b.onclick=()=>{let ok=0,t=0;all.forEach(r=>{const x=r.check();ok+=x.ok;t+=x.total});out.textContent=ok+' von '+t+' richtig'};c2.append(b,out)}
function route(){if(tts&&speechSynthesis)speechSynthesis.cancel();if(cur){cur.pause();cur=null}const h=location.hash.replace(/^#\/?/,'').split('/');
 const home_=!(h[0]=='s'||h[0]=='u'||h[0]=='pt'||h[0]=='d'||h[0]=='test');if(h[0]=='s'&&D.sitzungen.find(x=>x.n==+h[1]))sitzung(+h[1]);else if(h[0]=='u'&&D.units[h[1]])unit(h[1],h[2]||1);else if(h[0]=='pt'&&D.pt.find(x=>x.id==+h[1]))pt(+h[1]);else if(h[0]=='d'&&STAGES[h[1]])stage(h[1]);else if(h[0]=='d')trainer();else if(h[0]=='test')test();else home();if(!home_||app.children.length>2){if(location.hash.length>2&&location.hash!='#/')app.appendChild(mk('div','foot','<a class="btn go big" href="#/">← Zurück zur Übersicht</a>'))}}
addEventListener('hashchange',route);route();
</script></body></html>
