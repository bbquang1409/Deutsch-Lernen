<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Der menschliche Körper", "mode": "lesen", "text": "Der Mensch hat einen Körper. Die drei Teile des Körpers heißen: Der Kopf, der Rumpf und die Glieder. Die Glieder sind die Arme und die Beine. An den Armen sind die Hände, an den Beinen sind die Füße. Jede Hand hat fünf Finger; sie heißen: Der Daumen, der Zeigefinger, der Mittelfinger, der Ringfinger und der kleine Finger. Jeder Finger hat auch einen Nagel, das ist der Fingernagel.\n\nDer Fuß hat fünf Zehen. Jede Zehe hat auch einen Nagel, das ist der Zehennagel. Auf dem Kopf sind die Haare. An beiden Seiten des Kopfes sind die Ohren. Im Gesicht sind zwei Augen, eine Nase und ein Mund. Im Mund sind die Zähne und die Zunge. Zwischen dem Kopf und dem Rumpf ist der Hals.\n\nWir sehen mit den Augen und hören mit den Ohren. Wir riechen mit der Nase, schmecken mit der Zunge und fühlen mit der Haut. Wir essen mit dem Mund und beißen mit den Zähnen. Wir sprechen auch mit dem Mund und mit der Zunge.\n\nDer Mensch hat auch innere Organe. Diese sind: Das Gehirn, das Herz, die Lungen, die Leber, die Galle, die Nieren, der Magen und die Gedärme. Das Herz regelt den Blutkreislauf. Die Lunge reinigt das Blut durch die frische Luft, die der Mensch durch die Nase einatmet. Die verbrauchte Luft atmet der Mensch wieder aus.\n\nDie Verdauung der Nahrung geschieht durch den Magen und die Gedärme. Auch die Leber mit der Galle hilft bei der Verdauung mit. Die Niere scheidet die unbrauchbaren und oft schädlichen Stoffe aus dem Körper aus. Alle Tätigkeiten des Organismus regelt das Gehirn durch das Nervensystem; es erstreckt sich, vom Gehirn ausgehend, über den ganzen Körper.\n\nWenn Schäden im Organismus auftreten, dann ist der Mensch krank. Die Ursache daran ist oft ungesunde Ernährung und schlechte Wohnverhältnisse. Auch die Umweltverschmutzung, das Ergebnis der modernen Zeit, ruft Störungen im menschlichen Organismus hervor.", "source": "", "questions": [{"type": "mc", "q": "Welche drei Teile hat der Körper?", "options": ["Kopf, Hals und Beine", "Arme, Beine und Hände", "Kopf, Bauch und Rücken", "Kopf, Rumpf und Glieder"], "answer": 3}, {"type": "mc", "q": "Was sind die Glieder?", "options": ["Die Arme und die Beine", "Die Finger", "Der Kopf und der Hals", "Die Organe"], "answer": 0}, {"type": "mc", "q": "Wie viele Zehen hat ein Fuß?", "options": ["Zwei", "Fünf", "Zehn", "Vier"], "answer": 1}, {"type": "mc", "q": "Womit riechen wir?", "options": ["Mit den Ohren", "Mit der Zunge", "Mit der Nase", "Mit der Haut"], "answer": 2}, {"type": "mc", "q": "Womit schmecken wir?", "options": ["Mit der Nase", "Mit der Haut", "Mit den Augen", "Mit der Zunge"], "answer": 3}, {"type": "mc", "q": "Was macht die Lunge?", "options": ["Sie reinigt das Blut durch frische Luft.", "Sie regelt den Blutkreislauf.", "Sie scheidet schädliche Stoffe aus.", "Sie hilft bei der Verdauung."], "answer": 0}, {"type": "mc", "q": "Was macht das Herz?", "options": ["Es reinigt die Luft.", "Es regelt den Blutkreislauf.", "Es hilft bei der Verdauung.", "Es regelt das Nervensystem."], "answer": 1}, {"type": "mc", "q": "Welches Organ regelt alle Tätigkeiten des Organismus?", "options": ["Das Herz", "Die Leber", "Das Gehirn", "Die Niere"], "answer": 2}, {"type": "tf", "q": "Die Niere hilft zusammen mit der Leber bei der Verdauung.", "answer": false}, {"type": "tf", "q": "Auch Umweltverschmutzung kann den Menschen krank machen.", "answer": true}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
