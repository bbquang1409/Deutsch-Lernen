<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Herr Lorenz braucht ein Auto", "mode": "lesen", "text": "Herr Lorenz ist Techniker. Er kommt aus Hamburg und wohnt jetzt in Berlin. Er arbeitet dort. Aber er fährt auch sehr oft nach Hamburg, seine Familie wohnt noch da. Er braucht deshalb ein Auto.\n\nHeute besucht er Herrn Müller. Herr Müller ist sein Freund. \"Klaus\", sagt er, \"ich fahre sehr oft nach Hamburg und brauche deswegen ein Auto. Wo kann ich in Berlin ein Autogeschäft finden? Kennst du ein Geschäft?\"\n\n\"Ja, ich kenne ein Geschäft. Der Besitzer, Thomas Kohl, ist mein Freund. Er verkauft Wagen aus Deutschland, aus Italien, aus Frankreich und auch aus Japan\", antwortet Herr Müller. \"Hat er auch Kleinwagen?\" \"Natürlich.\" \"Das ist gut. Viele Autos sind teuer, aber Kleinwagen sind billig. Ich habe nicht viel Geld! Gehen wir jetzt zusammen in das Geschäft?\"\n\nDie zwei Freunde gehen in die Stadt und finden das Geschäft.\n\nDer Besitzer kommt. Er sagt: \"Guten Tag, Klaus! Was wünschst du?\" \"Guten Tag, Thomas. Hier ist mein Freund Paul Lorenz. Er braucht ein Auto. Hast du Kleinwagen?\"\n\n\"Natürlich. Hier finden Sie viele Autos, Herr Lorenz. Dort ist ein Kleinwagen. Der VW Golf. Sein Motor ist sehr gut und braucht wenig Benzin\", antwortet Herr Kohl.\n\nHerr Lorenz sagt: \"Ich kenne die Marke; sie ist gut. Ich kaufe das Auto vielleicht. Aber ich frage zuerst meine Frau.\"\n\nDann sagen Herr Lorenz und Herr Müller: \"Auf Wiedersehen!\" und gehen.", "source": "", "questions": [{"type": "mc", "q": "Woher kommt Herr Lorenz?", "options": ["Aus Berlin", "Aus Hamburg", "Aus Hannover", "Aus Italien"], "answer": 1}, {"type": "mc", "q": "Was ist Herr Lorenz von Beruf?", "options": ["Autoverkäufer", "Lehrer", "Techniker", "Arzt"], "answer": 2}, {"type": "mc", "q": "Warum fährt Herr Lorenz oft nach Hamburg?", "options": ["Er arbeitet dort.", "Sein Freund wohnt dort.", "Er will dort ein Auto kaufen.", "Seine Familie wohnt noch dort."], "answer": 3}, {"type": "mc", "q": "Wer ist Thomas Kohl?", "options": ["Der Besitzer des Autogeschäfts", "Ein Techniker", "Der Bruder von Herrn Lorenz", "Ein Polizist"], "answer": 0}, {"type": "mc", "q": "Warum möchte Herr Lorenz einen Kleinwagen?", "options": ["Kleinwagen sind schnell.", "Kleinwagen sind billig und er hat nicht viel Geld.", "Er hat nur eine kleine Garage.", "Seine Frau mag Kleinwagen."], "answer": 1}, {"type": "mc", "q": "Welches Auto empfiehlt Herr Kohl?", "options": ["Einen Fiat", "Einen Toyota", "Einen VW Golf", "Einen Renault"], "answer": 2}, {"type": "mc", "q": "Warum empfiehlt Herr Kohl dieses Auto?", "options": ["Es ist das billigste Auto.", "Es ist ein Auto aus Japan.", "Es ist neu und rot.", "Der Motor ist sehr gut und braucht wenig Benzin."], "answer": 3}, {"type": "tf", "q": "Herr Lorenz kauft den VW Golf sofort.", "answer": false}, {"type": "tf", "q": "Das Autogeschäft verkauft nur deutsche Autos.", "answer": false}, {"type": "mc", "q": "Was macht Herr Lorenz, bevor er das Auto kauft?", "options": ["Er fragt zuerst seine Frau.", "Er ruft Herrn Kohl an.", "Er fährt nach Hamburg.", "Er verkauft sein altes Auto."], "answer": 0}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
