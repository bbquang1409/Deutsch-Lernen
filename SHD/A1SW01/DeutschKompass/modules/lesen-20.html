<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Urlaub in den Bergen", "mode": "lesen", "level": "A2", "text": "Herr und Frau Meyer fahren oft in die Berge. Berge gibt es in Deutschland, Österreich, Italien und der Schweiz. Ihr Reiseziel ist in diesem Jahr die Schweiz. Dort kann man viel wandern. In einem Berghotel haben sie ein Zimmer gebucht.\n\n\"Wie wollen wir hinfahren? Mit dem Auto oder mit dem Zug\", fragt Herr Meyer seine Frau. \"Ein Flugzeug kommt ja nicht in Frage. Dort ist kein Flughafen.\"\n\n\"Mit dem Auto ist es sehr bequem\", antwortet Frau Meyer. \"Aber es gibt auf der Autobahn sicher einen langen Stau. Dann wird die Anreise sehr anstrengend. Ich denke, wir sollten den Zug nehmen.\"\n\nEine Woche später steigen Herr und Frau Meyer an einem kleinen Bahnhof in der Schweiz aus dem Zug. Ein Taxi wartet bereits und bringt das Ehepaar zum Berghotel.\n\nAn der Rezeption werden ihnen die Zimmerschlüssel überreicht. Ein Bediensteter zeigt dem Ehepaar Meyer ihr Zimmer. Darin befindet sich ein Doppelbett und ein Schrank.\n\nHerr Meyer ist unzufrieden mit dem Hotelzimmer. Es ist viel zu klein. \"Wir haben ein großes Zimmer gebucht. Dieser Raum gefällt uns nicht. Wir möchten ein anderes Zimmer haben.\"\n\nDurch seine Beschwerde erhält das Ehepaar sofort ein anderes Zimmer. Herr und Frau Meyer freuen sich. Sie haben ein großes Zimmer mit einem schönen Ausblick auf die schneebedeckten Berge.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Welches Reiseziel wählt Familie Meyer in diesem Jahr?", "options": ["Österreich", "Die Schweiz", "Deutschland", "Italien"], "answer": 1}, {"type": "mc", "q": "Womit fährt Familie Meyer in den Urlaub?", "options": ["Mit dem Auto", "Mit dem Bus", "Mit dem Taxi", "Mit dem Zug"], "answer": 3}, {"type": "mc", "q": "Wo steigen Herr und Frau Meyer aus dem Zug?", "options": ["Am Flughafen", "An einer kleinen Raststätte", "An einem großen Hotel", "An einem kleinen Bahnhof"], "answer": 3}, {"type": "mc", "q": "Was erhalten sie an der Rezeption des Hotels?", "options": ["Einen Zimmerschlüssel", "Einen Brief", "Eine Fahrkarte", "Einen schönen Blumenstrauß"], "answer": 0}, {"type": "mc", "q": "Warum ist Herr Meyer unzufrieden?", "options": ["Das Zimmer ist zu groß.", "Das Zimmer ist zu klein.", "Es gibt kein freies Zimmer.", "Das Hotel ist zu klein."], "answer": 1}, {"type": "tf", "q": "Familie Meyer fliegt in die Schweiz.", "answer": false}, {"type": "tf", "q": "Frau Meyer möchte lieber mit dem Zug fahren.", "answer": true}, {"type": "tf", "q": "Das neue Zimmer hat einen schönen Ausblick auf die Berge.", "answer": true}, {"type": "order", "q": "Die Anreise", "options": ["Mit dem Zug fahren", "Den Zimmerschlüssel bekommen", "Das Reiseziel wählen", "Vom Taxi zum Hotel gebracht werden"], "answer": ["Das Reiseziel wählen", "Mit dem Zug fahren", "Vom Taxi zum Hotel gebracht werden", "Den Zimmerschlüssel bekommen"]}, {"type": "order", "q": "Das Zimmer", "options": ["Sich über den Ausblick freuen", "Das erste Zimmer sehen", "Ein anderes Zimmer bekommen", "Sich beschweren"], "answer": ["Das erste Zimmer sehen", "Sich beschweren", "Ein anderes Zimmer bekommen", "Sich über den Ausblick freuen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
