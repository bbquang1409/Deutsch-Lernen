<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Wandern in der Natur", "mode": "lesen", "text": "Im Urlaub fahren wir eine Woche zum Wandern in die Berge. Dort ist die Luft besser als in der Stadt. Wir wandern zu einem See und wollen dort mit einem Boot fahren. Auf dem Wanderweg zum See gehen wir zuerst lange durch einen dunklen Wald. Im Wald sind viele Bäume und es riecht nach Erde. Weil wir nicht laut sind, sehen wir ein Reh und beobachten es. Wir kommen an einem großen Felsen vorbei. Auf dem Weg liegen viele Steine und wir brauchen gute Wanderschuhe, damit wir uns nicht verletzen.\n\nNach dem Wald kommen wir auf Felder und Wiesen. Das Gras auf der Wiese ist Futter für die Tiere von den Bauern. Auch schöne Blumen wachsen dort und wir pflücken einen kleinen Blumenstrauß beim Heimweg. Zum See führt ein kleiner Bach. In dem Bach gibt es Fische. Ich möchte dort gerne angeln.\n\nNach dem Urlaub in den Bergen fliegt die ganze Familie noch ein paar Tage ans Meer. Der Strand ist ganz flach und das Wasser ist nicht tief. Die Kinder spielen gerne im feinen Sand. Die Sonne ist sehr stark und man braucht Sonnencreme. Am Meer bläst immer Wind. Das ist bei der Hitze angenehm. Am Meer ist ein anderes Klima als in der Stadt und die Luft ist sehr feucht. Das Wetter ist fast immer gut und es gibt selten Regen.", "source": "", "questions": [{"type": "mc", "q": "Wie lange fährt die Familie zum Wandern in die Berge?", "options": ["Eine Woche", "Zwei Wochen", "Ein Wochenende", "Einen Tag"], "answer": 0}, {"type": "mc", "q": "Wohin wandern sie?", "options": ["Zu einem Fluss", "Zu einem See", "Zu einer Berghütte", "Zu einem Dorf"], "answer": 1}, {"type": "mc", "q": "Was möchten sie am See machen?", "options": ["Schwimmen", "Picknicken", "Mit einem Boot fahren", "Zelten"], "answer": 2}, {"type": "mc", "q": "Was sehen sie im Wald?", "options": ["Einen Bären", "Einen Fuchs", "Einen Hirsch", "Ein Reh"], "answer": 3}, {"type": "mc", "q": "Warum brauchen sie gute Wanderschuhe?", "options": ["Auf dem Weg liegen viele Steine.", "Es regnet immer.", "Der Weg ist sehr weit.", "Es liegt Schnee."], "answer": 0}, {"type": "mc", "q": "Was machen sie auf dem Heimweg?", "options": ["Sie angeln Fische.", "Sie pflücken einen kleinen Blumenstrauß.", "Sie kaufen Käse.", "Sie fahren mit dem Boot."], "answer": 1}, {"type": "tf", "q": "Im Bach gibt es Fische.", "answer": true}, {"type": "tf", "q": "Nach den Bergen fliegt die Familie noch ein paar Tage ans Meer.", "answer": true}, {"type": "tf", "q": "Am Meer regnet es oft.", "answer": false}, {"type": "mc", "q": "Was bedeutet „feucht“ in „die Luft ist sehr feucht“?", "options": ["sehr warm", "ganz sauber", "nicht trocken", "ohne Wind"], "answer": 2}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
