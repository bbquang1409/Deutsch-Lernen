<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Mein Tag", "mode": "lesen", "level": "A2", "text": "Ich bin Anna, bin 16 Jahre alt und Schülerin. Morgens stehe ich um kurz vor 7 Uhr auf. Aufwachen kann ich nicht von allein. Ein Wecker klingelt mich aus dem Schlaf. Ich stehe auf und muss als erstes meistens auf die Toilette gehen. Ich wasche mir das Gesicht. Dann dusche ich, zuerst ganz warm und am Schluss mit kaltem Wasser. So werde ich richtig wach. Zähne putzen muss auch sein, anschließend ziehe ich mich an. Meine Kleider habe ich mir schon am Abend davor zurecht gelegt. Ich will morgens keine Zeit verlieren. So kann ich ein bisschen später aufstehen.\n\nDas Frühstück lasse ich nie aus, ich habe Hunger am Morgen. Meistens esse ich Müsli oder Toast mit Marmelade. Dazu trinke ich Tee oder Kaffee. Bevor ich in die Schule gehe, muss ich noch mein Bett machen. Das dauert aber selten länger als eine oder zwei Minuten. Dann renne ich schon los zu meinem Schulbus.\n\nNach der Schule esse ich zu Mittag und komme am Nachmittag heim. Dann muss ich meistens noch Hausaufgaben machen. Vor dem Abendessen habe ich noch Zeit um zu spielen oder um Freunde zu treffen. Dann essen wir gemeinsam zu Abend. Bevor ich ins Bett gehen, schaue ich ein bisschen fern. Dann gehe ich schlafen und schlafe von 22 Uhr bis morgens um 7.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wann steht Anna auf?", "options": ["Kurz vor 7 Uhr", "Kurz nach 7 Uhr", "Nie vor 7 Uhr", "Immer nach 7 Uhr"], "answer": 0}, {"type": "mc", "q": "Was isst Anna zum Frühstück?", "options": ["Cornflakes und Toast mit Butter", "Müsli oder Toast mit Marmelade", "Brot mit Käse oder Wurst", "Nichts"], "answer": 1}, {"type": "mc", "q": "Was macht sie nicht morgens, bevor sie zur Schule geht?", "options": ["Duschen", "Zur Toilette gehen", "Das Bett machen", "Hausaufgaben"], "answer": 3}, {"type": "mc", "q": "Wann kommt sie nach Hause?", "options": ["Kurz vor dem Abendessen", "Nach dem Abendessen", "Am Nachmittag", "Nachdem sie die Hausaufgaben gemacht hat"], "answer": 2}, {"type": "mc", "q": "Was macht sie nach den Hausaufgaben?", "options": ["Schlafen", "Sport", "Freunde treffen", "Lernen"], "answer": 2}, {"type": "tf", "q": "Anna duscht zuerst warm und am Schluss kalt.", "answer": true}, {"type": "tf", "q": "Anna muss vor der Schule noch ihr Bett machen.", "answer": true}, {"type": "tf", "q": "Anna kann ohne Wecker aufwachen.", "answer": false}, {"type": "order", "q": "Am Morgen", "options": ["Zähne putzen", "Aufstehen", "Sich anziehen", "Duschen"], "answer": ["Aufstehen", "Duschen", "Zähne putzen", "Sich anziehen"]}, {"type": "order", "q": "Der Tag", "options": ["Hausaufgaben machen", "Frühstücken", "Fernsehen und schlafen gehen", "Zum Schulbus rennen"], "answer": ["Frühstücken", "Zum Schulbus rennen", "Hausaufgaben machen", "Fernsehen und schlafen gehen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
