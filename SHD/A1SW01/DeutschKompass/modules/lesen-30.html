<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Sport", "mode": "lesen", "text": "In Deutschland interessieren sich sehr viele Menschen für Sport. In den Zeitungen, im Radio und im Fernsehen wird regelmäßig über Sport berichtet. Besonders beliebt bei den Zuschauern sind Sportarten wie Fußball oder Tennis, wenn sie im Fernsehen übertragen werden.\n\nBeim Fußball spielen zwei Mannschaften gegeneinander und versuchen, einen Ball in das Tor zu schießen. Ein Team besteht aus 10 Spielern und einem Tormann. Mehrere Schiedsrichter achten darauf, dass alle Spieler die Regeln einhalten.\n\nBeim Tennis spielen zwei gegeneinander und versuchen mit einem Schläger einen Ball so über ein Netz zu spielen, dass der andere ihn nicht erwischt. Man sammelt Punkte, das Spiel besteht aus mehreren Matches.\n\nWas die Deutschen sonst noch gern im Fernsehen anschauen: Leichtathletik, Basketball, Handball, Eishockey und Formel 1. Das letzte ist Motorsportrennen, bei dem die Fahrer mit speziellen Autos sehr schnell viele Runden auf eigenen Strecken fahren. Der schnellste gewinnt.\n\nDie beliebtesten Sportarten der Deutschen, die sie selbst ausüben, sind: Schwimmen, Fahrrad fahren, Fußball und Tennis spielen, Golf spielen, Reiten und auch Ski fahren. Viele betreiben auch Fitness in ihrer Freizeit, meist in eigenen Fitnesscentern.\n\nBeim Golf wird ein kleiner, harter Ball mit einem langen Schläger von einem Abschlagspunkt oft sehr weit über Hügel und Wiesen gespielt. Er soll in einem bestimmten Loch landen. Je weniger Schläge ein Spieler dazu braucht, desto besser ist er.\n\nViele Deutsche gehen im Winter auch Ski fahren. Auch in Deutschland gibt es viele Berge, wo Lifte die Skifahrer auf die speziell angelegten Pisten bringen. Viele fahren auch in die benachbarten Länder Österreich und Schweiz, dort gibt es sehr viele große Skigebiete.", "source": "", "questions": [{"type": "mc", "q": "Was passiert beim Golf?", "options": ["Lifte bringen die Sportler auf Pisten.", "Ein Spieler schlägt einen harten Ball mit einem langen Schläger.", "Zwei Spieler schlagen Bälle über ein Netz.", "Zwei Teams versuchen, Tore zu schießen."], "answer": 1}, {"type": "mc", "q": "Bei welchen Sportarten braucht man einen Schläger?", "options": ["Fußball und Reiten", "Basketball und Formel 1", "Tennis und Golf", "Skifahren und Schwimmen"], "answer": 2}, {"type": "mc", "q": "Welche Sportarten sehen die Zuschauer im Fernsehen besonders gern?", "options": ["Radrennen und Schwimmen", "Golf und Reiten", "Skifahren und Eishockey", "Fußball und Tennis"], "answer": 3}, {"type": "mc", "q": "Welche Sportart machen die Deutschen in der Freizeit NICHT selbst (laut Text)?", "options": ["Formel 1", "Fußball", "Schwimmen", "Tennis"], "answer": 0}, {"type": "mc", "q": "Wie viele Personen spielen in einem Fußballteam?", "options": ["11 Spieler und ein Tormann", "10 Spieler und ein Tormann", "10 Spieler und zwei Tormänner", "20 Spieler"], "answer": 1}, {"type": "mc", "q": "Was ist die Formel 1?", "options": ["Eine Ballsportart", "Eine Wintersportart", "Ein Motorsportrennen", "Ein Fitnessprogramm"], "answer": 2}, {"type": "mc", "q": "Wann ist ein Golfspieler besser?", "options": ["Wenn er mehr Schläge braucht", "Wenn er schneller läuft", "Wenn er einen kürzeren Schläger hat", "Wenn er weniger Schläge braucht"], "answer": 3}, {"type": "tf", "q": "Viele Deutsche fahren zum Skifahren auch nach Österreich und in die Schweiz.", "answer": true}, {"type": "tf", "q": "Beim Tennis spielen zwei Mannschaften gegeneinander.", "answer": false}, {"type": "tf", "q": "In Deutschland gibt es keine Berge zum Skifahren.", "answer": false}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
