<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Der Wecker", "mode": "diktat", "audio": "../assets/audio/diktat-02.mp3", "questions": [], "sentences": ["Der Zug fährt um halb neun ab.", "Ich brauche eine Fahrkarte nach Berlin.", "Am Bahnhof wartet meine Mutter.", "Die Fahrt dauert zwei Stunden."], "fullText": "Heute früh habe ich den Wecker nicht gehört. Deshalb bin ich zu spät aufgewacht und hatte nur ein paar Minuten fürs Frühstück. Ich habe ein Butterbrot gegessen und mich schnell angezogen. Dabei habe ich nicht bemerkt, dass meine Strümpfe nicht zusammenpassen. Der linke Strumpf war gelb und der rechte war rot. Mein Bruder hat das natürlich sofort gesehen. Er fand das lustig. Aber ich hatte keine Zeit mehr, um mich noch einmal umzuziehen. Es war schon so spät, dass ich zur Bushaltestelle rennen musste. Was für ein Tag!", "level": "A1+"}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
