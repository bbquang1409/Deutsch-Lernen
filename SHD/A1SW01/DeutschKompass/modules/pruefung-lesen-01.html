<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Prüfung 1", "mode": "lesen", "exam": true, "minutes": 10, "text": "TEIL 1 · Kurze Texte\n\nText 1 (E-Mail)\nLiebe Sabine, ich komme am Freitag nicht zum Deutschkurs. Ich habe um 16 Uhr einen Termin beim Zahnarzt. Kannst du mir bitte die Hausaufgaben schicken? Am Samstag habe ich Zeit. Wir können zusammen bei mir zu Hause lernen. Bring bitte dein Wörterbuch mit. Viele Grüße, Tom\n\nText 2 (Aushang)\nAchtung! Das Schwimmbad ist vom 1. bis 14. August geschlossen. Wir renovieren die Umkleidekabinen. Ab dem 15. August sind wir wieder wie immer für Sie da: Montag bis Freitag 8–21 Uhr, Samstag und Sonntag 9–18 Uhr. Kinder unter 6 Jahren dürfen nur mit Erwachsenen ins Wasser. Ihr Schwimmbad-Team\n\nTEIL 2 · Anzeigen\n\nA  Café Sonne – Frühstück ab 7 Uhr. Täglich frische Brötchen, Kaffee und Tee. Montag Ruhetag.\nB  Sprachcafé jeden Mittwoch um 18 Uhr in der Stadtbibliothek. Sprich Deutsch mit anderen Leuten! Kostenlos.\nC  Fahrrad zu verkaufen: Damenrad, 3 Jahre alt, 90 Euro. Telefon 0170 5551234 (nach 17 Uhr).\nD  Ärztehaus am Markt: Dr. Weiß, Allgemeinmedizin. Sprechstunde Mo–Fr 8–12 Uhr, Di und Do auch 15–18 Uhr.\nE  Billig umziehen! Wir helfen mit Transporter und Kartons. Ab 50 Euro. Rufen Sie an: 030 998877.\n\nTEIL 3 · Lückentext (Postkarte)\n\nLiebe Oma, viele Grüße aus Italien! Wir sind [1] Dienstag hier und es gefällt uns sehr gut. Das Wetter ist toll, die Sonne [2] jeden Tag. Heute [3] wir an den Strand und essen später Pizza. Bis bald, Anna", "questions": [{"type": "tf", "q": "Tom kommt am Freitag nicht zum Deutschkurs.", "answer": true, "part": "Teil 1: Kurze Texte"}, {"type": "tf", "q": "Tom und Sabine lernen am Samstag in der Schule.", "answer": false, "part": "Teil 1: Kurze Texte"}, {"type": "tf", "q": "Das Schwimmbad ist im August zwei Wochen lang geschlossen.", "answer": true, "part": "Teil 1: Kurze Texte"}, {"type": "tf", "q": "Am Sonntag öffnet das Schwimmbad schon um 8 Uhr.", "answer": false, "part": "Teil 1: Kurze Texte"}, {"type": "mc", "q": "Maria möchte mit anderen Menschen Deutsch sprechen. Sie hat wenig Geld. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 1, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Herr Kaya braucht am Dienstagnachmittag einen Arzt. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 3, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Lena zieht nächste Woche um und hat kein Auto. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 4, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Lücke 1", "options": ["vor", "in", "seit"], "answer": 2, "part": "Teil 3: Lückentext"}, {"type": "mc", "q": "Lücke 2", "options": ["scheint", "scheinen", "schien"], "answer": 0, "part": "Teil 3: Lückentext"}, {"type": "mc", "q": "Lücke 3", "options": ["geht", "gingen", "gehen"], "answer": 2, "part": "Teil 3: Lückentext"}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
