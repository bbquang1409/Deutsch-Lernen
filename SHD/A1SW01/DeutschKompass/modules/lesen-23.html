<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Frühling in Deutschland", "mode": "lesen", "text": "Der Frühling ist die erste von vier Jahreszeiten. Die anderen drei sind der Sommer, der Herbst und der Winter. Der Frühling beginnt Ende März. Dann ist der Tag so lang wie die Nacht. Es ist wärmer als im Winter. Die Sonne scheint länger. Die Blumen blühen wieder. Die Bäume bekommen neue Blätter und manche auch Blüten. Das Gras wächst. Der Frühling ist sehr schön, wenn viele Bäume blühen. Die Apfelbäume zeigen damit, dass der Winter wirklich vorbei ist.\n\nAlle Menschen freuen sich auf den Sommer. Die Tage werden immer länger und heller. Die Kinder spielen draußen. Auch die Erwachsenen sind jetzt gerne im Park, im Straßencafé, im Garten. Der Frühling macht die Leute glücklich, denn der Winter in Deutschland dauert viele Monate. Dann ist es kalt. Es gibt nur wenig Tageslicht. Es regnet oft. In den Bergen schneit es. Es fällt nicht mehr viel Schnee. Das Klima ist auf der ganzen Erde wärmer geworden.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wann beginnt der Frühling?", "options": ["im Februar", "Ende März", "im Mai", "am 1. Januar"], "answer": 1}, {"type": "mc", "q": "Was macht die Leute glücklich?", "options": ["es regnet endlich wieder", "die Tage werden kürzer", "die Bäume verlieren ihre Blätter", "die Tage werden länger"], "answer": 3}, {"type": "mc", "q": "Woran merkt man, dass der Winter wirklich vorbei ist?", "options": ["überall wachsen Sonnenblumen", "das Gras wird grün", "die Apfelbäume blühen", "die Kinder spielen im Straßencafé"], "answer": 2}, {"type": "mc", "q": "Worauf freuen sich Kinder und Erwachsene im Frühling?", "options": ["auf den Sommer", "auf den Herbst", "auf den Winter", "auf den Schnee"], "answer": 0}, {"type": "mc", "q": "Wie heißen die Jahreszeiten?", "options": ["Regen, Apfelbäume, Winter, Gras", "Sommer, Blumen, Garten, Sonne", "Frühling, Sommer, Herbst, Winter", "Schnee, Herbst, Park, Blüten"], "answer": 2}, {"type": "mc", "q": "Was blüht im Frühling?", "options": ["Bäume und Blumen", "Gras und Café", "Kaffee und Tee", "Kinder und Erwachsene"], "answer": 0}, {"type": "tf", "q": "Am Anfang des Frühlings ist der Tag so lang wie die Nacht.", "answer": true}, {"type": "tf", "q": "Im deutschen Winter gibt es viel Tageslicht.", "answer": false}, {"type": "tf", "q": "In den Bergen fällt heute noch genauso viel Schnee wie früher.", "answer": false}, {"type": "mc", "q": "Was bedeutet „blühen“ im Text?", "options": ["Blumen werden gegossen.", "Blumen und Bäume bekommen Blüten.", "Blumen werden gepflückt.", "Blumen sterben."], "answer": 1}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
