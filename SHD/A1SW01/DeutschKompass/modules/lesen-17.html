<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Meine Woche", "mode": "lesen", "level": "A2", "text": "Von Montag bis Freitag besuche ich vormittags die Schule. Der Unterricht dauert meistens bis um 13 Uhr. Manchmal habe ich nach der Mittagspause noch einmal Unterricht. In der Mittagspause können wir essen oder uns ausruhen. Viele machen auch ihre Hausaufgaben in der Mittagspause. Nach der Schule muss ich die Hausaufgaben machen. Dafür brauche ich meistens nicht sehr viel Zeit. Oft nur eine Stunde. Danach habe ich Freizeit und kann machen, was ich möchte. Montags gehe ich am Nachmittag zum Sport. Ich spiele Tennis. Viele meiner Freunde machen Sport nach der Schule. Manche haben auch Musikunterricht.\n\nDienstag und Donnerstag gehe ich außerdem zum Fußballtraining. Ich spiele mit meinem Bruder und vielen Freunden in einer Mannschaft. Am Samstag oder am Sonntag sind oft Spiele gegen die anderen Fußballvereine, das macht am meisten Spaß.\n\nAbends esse ich gemeinsam mit meiner Familie. Anschließend kann ich noch ein wenig am Computer spielen oder mir einen Film ansehen. Während der Woche gehe ich selten nach 22 Uhr schlafen, weil ich früh am Morgen aufstehen muss. Denn die Schule beginnt bei mir schon um 7:45 Uhr. Mittwoch nachmittags habe ich kein besonderes Programm, meistens treffe ich Freunde oder mache Erledigungen mit meiner Mutter.\n\nSamstag und Sonntag ist keine Schule. Aber oft muss ich für Schularbeiten oder Tests lernen. So habe ich meistens auch am Wochenende etwas für die Schule zu erledigen. Aber es bleibt doch Zeit für einen Besuch bei meiner Großmutter. Manchmal sind wir auch bei meinem Onkel zum Essen eingeladen oder wir machen einen Ausflug aufs Land.", "source": "lingua.com", "questions": [{"type": "mc", "q": "An welchen Tagen hat der Erzähler keine Schule?", "options": ["Am Dienstag und Donnerstag", "Am Montag", "Von Montag bis Freitag", "Am Samstag und Sonntag"], "answer": 3}, {"type": "mc", "q": "Wann geht der Erzähler während der Woche schlafen?", "options": ["Um 20 Uhr", "Nach 22 Uhr", "Vor 22 Uhr", "Um 7:45"], "answer": 2}, {"type": "mc", "q": "Was unternimmt der Erzähler am Wochenende?", "options": ["Er spielt Tennis.", "Er macht Ausflüge oder besucht die Großmutter.", "Er schaut Filme.", "Er spielt am Computer."], "answer": 1}, {"type": "mc", "q": "Was unternimmt der Erzähler mit seinen Freunden?", "options": ["Er lernt mit ihnen am Wochenende.", "Er ist bei ihnen zum Essen eingeladen.", "Er spielt mit Freunden Fußball.", "Er macht mit ihnen die Hausaufgaben."], "answer": 2}, {"type": "mc", "q": "Wie lange braucht er für seine Hausaufgaben?", "options": ["Nie länger als bis 13 Uhr.", "Meistens nicht länger als eine Stunde.", "Selten bis 20 Uhr.", "Oft bis 22 Uhr."], "answer": 1}, {"type": "tf", "q": "Dienstag und Donnerstag hat der Erzähler Fußballtraining.", "answer": true}, {"type": "tf", "q": "Am Wochenende muss der Erzähler nie für die Schule lernen.", "answer": false}, {"type": "tf", "q": "Der Erzähler spielt mit seinem Bruder in einer Mannschaft.", "answer": true}, {"type": "order", "q": "Ein Schultag", "options": ["Freizeit haben", "Schule besuchen", "Mit der Familie zu Abend essen", "Hausaufgaben machen"], "answer": ["Schule besuchen", "Hausaufgaben machen", "Freizeit haben", "Mit der Familie zu Abend essen"]}, {"type": "order", "q": "Die Woche", "options": ["Mittwochs Freunde treffen", "Am Wochenende die Großmutter besuchen", "Montags Tennis spielen", "Dienstags Fußballtraining haben"], "answer": ["Montags Tennis spielen", "Dienstags Fußballtraining haben", "Mittwochs Freunde treffen", "Am Wochenende die Großmutter besuchen"]}]}</script><script src="../assets/js/manifest.js"></script><script src=".
