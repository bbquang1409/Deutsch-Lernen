<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Neu in der Stadt", "mode": "lesen", "level": "A2", "text": "Ich bin vor einem Monat in diese Stadt gezogen, um zu studieren. Ich wohne zusammen mit drei anderen Mädchen in einer Wohngemeinschaft. Unsere Wohnung ist nicht weit von der Universität entfernt, ich muss nur drei Stationen mit der U-Bahn fahren.\n\nWenn das Wetter schön ist, gehe ich manchmal zu Fuß. Die Professoren an der Universität sind sehr nett, manche sind aber auch streng. Die Vorlesungen, die schon früh beginnen, mag ich nicht so gerne. Ich schlafe lieber lange. Mittags esse ich mit meinen Freundinnen in der Mensa. Das Essen ist nicht sehr gut, aber es kostet nicht viel.\n\nIn meiner Freizeit lese ich gerne, in meinem Zimmer stehen viele Bücher. Manchmal gehe ich in den Zoo und beobachte die Tiere. Früher hatte ich zwei Katzen, aber in der WG sind keine Haustiere erlaubt. Wenn ich das Studium abgeschlossen habe, möchte ich als Tierärztin im Zoo arbeiten.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Warum bin ich in die Stadt gezogen?", "options": ["Weil ich gerne lese", "Weil ich studiere", "Weil ich in einer Wohngemeinschaft wohne", "Weil ich manchmal in den Zoo gehe"], "answer": 1}, {"type": "mc", "q": "Wann gehe ich zu Fuß zur Universität?", "options": ["Wenn es nicht regnet, stürmt oder schneit", "Wenn die Vorlesungen früh beginnen", "Wenn die Professoren streng sind", "Wenn ich Hunger habe"], "answer": 0}, {"type": "mc", "q": "Wie ist das Essen in der Mensa?", "options": ["Es ist sehr gut", "Es ist billig", "Es ist vegetarisch", "Es ist gesund"], "answer": 1}, {"type": "mc", "q": "Was ist in der WG verboten?", "options": ["Bücher", "Haustiere", "Schuhe", "Fahrräder"], "answer": 1}, {"type": "mc", "q": "Wo möchte ich später arbeiten?", "options": ["An der Universität", "In der Mensa", "Im Zoo", "In der U-Bahn"], "answer": 2}, {"type": "tf", "q": "Die Erzählerin mag frühe Vorlesungen nicht so gern.", "answer": true}, {"type": "tf", "q": "Die Wohnung ist weit von der Universität entfernt.", "answer": false}, {"type": "tf", "q": "Früher hatte die Erzählerin einen Hund.", "answer": false}, {"type": "order", "q": "Der Weg zum Beruf", "options": ["In der Mensa essen", "In die Stadt ziehen", "Als Tierärztin im Zoo arbeiten", "Vorlesungen besuchen"], "answer": ["In die Stadt ziehen", "Vorlesungen besuchen", "In der Mensa essen", "Als Tierärztin im Zoo arbeiten"]}, {"type": "order", "q": "Tiere", "options": ["Im Zoo Tiere beobachten", "Zwei Katzen haben", "Tierärztin werden wollen", "In die WG ziehen"], "answer": ["Zwei Katzen haben", "In die WG ziehen", "Im Zoo Tiere beobachten", "Tierärztin werden wollen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
