<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Otto besucht den Arzt", "mode": "lesen", "text": "Die Jungen spielen Fußball zusammen im Park. Otto spielt gut. Aber plötzlich kommt nicht der Ball, sondern ein Stein und trifft seinen Kopf.\n\nOtto läuft nach Hause. Die Mutter bringt eine Binde für den Sohn und bindet sie um seinen Kopf. Der Vater sagt: \"Die Wunde ist groß. Wir besuchen zusammen den Arzt.\" Aber Otto ist stolz; er findet den Weg ohne den Vater. Er geht durch die Bahnhofstraße und dann um die Ecke in die Mozartstraße. Dort ist der Arzt.\n\nOtto wartet fast eine Stunde. Viele Männer, Frauen und Kinder besuchen den Arzt; denn er ist gut. Endlich kommt eine Schwester und ruft Otto.\n\nEr geht in das Sprechzimmer. Der Arzt fragt: \"Was hast du, mein Junge?\" - \"Ich habe eine Kopfwunde, Herr Doktor\", antwortet Otto. Der Arzt nimmt die Binde ab und betrachtet die Wunde durch ein Vergrößerungsglas. Dann sagt er: \"Die Wunde ist nicht gefährlich, aber sie ist schmutzig.\"\n\nEr nimmt Jod und wäscht die Wunde. Das schmerzt, aber Otto erträgt den Schmerz ohne einen Laut.\n\n\"Ich kenne die Fußballspieler\", sagt der Arzt, \"sie sind immer tapfer. Jetzt macht die Schwester wieder eine Binde um deinen Kopf, und dann gehst du nach Hause. Aber die Jungen spielen vierzehn Tage ohne ihren Freund Otto Fußball! Fertig! Hier sind noch Tabletten gegen Kopfschmerzen und ein Brief für deinen Vater.\"\n\n\"Danke schön, Herr Doktor. Auf Wiedersehen!\", sagt Otto.", "source": "", "questions": [{"type": "mc", "q": "Was trifft Ottos Kopf?", "options": ["Der Ball", "Ein Schläger", "Ein Ast", "Ein Stein"], "answer": 3}, {"type": "mc", "q": "Was macht die Mutter?", "options": ["Sie bindet eine Binde um Ottos Kopf.", "Sie ruft den Arzt an.", "Sie kocht Tee.", "Sie bringt Otto zum Arzt."], "answer": 0}, {"type": "mc", "q": "Wie kommt Otto zum Arzt?", "options": ["Mit dem Vater im Auto", "Allein zu Fuß – er findet den Weg ohne den Vater.", "Mit dem Bus", "Mit seinen Freunden"], "answer": 1}, {"type": "mc", "q": "In welcher Straße ist der Arzt?", "options": ["In der Bahnhofstraße", "In der Goethestraße", "In der Mozartstraße", "Im Park"], "answer": 2}, {"type": "mc", "q": "Wie lange wartet Otto?", "options": ["Zehn Minuten", "Zwei Stunden", "Gar nicht", "Fast eine Stunde"], "answer": 3}, {"type": "tf", "q": "Die Wunde ist gefährlich.", "answer": false}, {"type": "tf", "q": "Otto schreit laut, als der Arzt die Wunde wäscht.", "answer": false}, {"type": "tf", "q": "Otto bekommt Tabletten gegen Kopfschmerzen und einen Brief für seinen Vater.", "answer": true}, {"type": "mc", "q": "Was bedeutet „tapfer“ im Text?", "options": ["mutig", "laut", "schnell", "krank"], "answer": 0}, {"type": "order", "q": "Ottos Nachmittag", "options": ["Der Arzt wäscht die Wunde.", "Ein Stein trifft Ottos Kopf.", "Otto spielt Fußball.", "Die Mutter bindet eine Binde um den Kopf."], "answer": ["Otto spielt Fußball.", "Ein Stein trifft Ottos Kopf.", "Die Mutter bindet eine Binde um den Kopf.", "Der Arzt wäscht die Wunde."]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
