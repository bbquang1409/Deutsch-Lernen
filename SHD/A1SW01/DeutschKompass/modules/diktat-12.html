<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Ostern", "mode": "diktat", "level": "B1", "audio": "../assets/audio/diktat-12.mp3", "questions": [], "sentences": ["Das Osterfest ist das wichtigste Fest der Christen.", "Diese werden überall im Garten verteilt.", "Zu Ostern wird es überall fröhlich und bunt und die Menschen freuen sich."], "fullText": "Das Osterfest ist das wichtigste Fest der Christen. Es gibt viele Traditionen. Dazu zählt zum Beispiel das Färben und Verstecken der Ostereier. Diese werden überall im Garten verteilt. Oft sind diese in kleinen, mit Ostergras gefüllten Nestern versteckt. Den Kindern bereitet es am Ostersonntag sehr viel Freude, die Ostereier und Nester zu suchen. Zur Feier des Osterfestes gibt es bei vielen Familien ein großes Osterfrühstück. Dabei werden die bunten Eier verspeist und oft wird auch ein Osterlamm gebacken. Zu Ostern wird es überall fröhlich und bunt und die Menschen freuen sich.", "source": "lingua.com"}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
