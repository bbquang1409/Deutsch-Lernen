ze Texte"}, {"type": "tf", "q": "Der Zug nach Hamburg kommt später als geplant.", "answer": true, "part": "Teil 1: Kurze Texte"}, {"type": "mc", "q": "Der 13-jährige Ben spielt gern Fußball und sucht ein Team. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 2, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Frau Meier will am Freitag nach Berlin fahren, aber sie hat kein Auto. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 1, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Familie Yilmaz hat keine Zeit zu kochen und möchte heute Abend Essen nach Hause bestellen. Welche Anzeige passt?", "options": ["Anzeige A", "Anzeige B", "Anzeige C", "Anzeige D", "Anzeige E"], "answer": 3, "part": "Teil 2: Anzeigen"}, {"type": "mc", "q": "Lücke 1", "options": ["bin", "war", "habe"], "answer": 1, "part": "Teil 3: Lückentext"}, {"type": "mc", "q": "Lücke 2", "options": ["gelacht", "lachen", "lacht"], "answer": 0, "part": "Teil 3: Lückentext"}, {"type": "mc", "q": "Lücke 3", "options": ["hat", "ist", "wird"], "answer": 0, "part": "Teil 3: Lückentext"}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
