<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Das Geburtstagsfest", "mode": "diktat", "audio": "../assets/audio/diktat-05.mp3", "questions": [], "sentences": ["Heute ist das Wetter sehr schön.", "Wir fahren mit dem Fahrrad zum See.", "Am Nachmittag gehen wir spazieren.", "Morgen bleiben wir lieber zu Hause."], "fullText": "Könnt ihr euch vorstellen, was mein schönstes Geburtstagsfest war? Es war mein Geburtstag letztes Jahr. Alle Verwandten und Freunde waren eingeladen und kamen zum Feiern zu uns. Wir haben guten Kuchen gebacken und viele feine Speisen vorbereitet. Es sollte ein leckeres Festmahl zum Geburtstag werden. Plötzlich geschah etwas Unerwartetes. Der Strom fiel aus. Das Essen war noch nicht fertig und alle Lichter gingen aus. Wir waren in großer Sorge um die Feier. Keine Panik, sagte mein Vater. Wir rufen einfach den Pizzadienst an. So saßen wir schließlich bei Kerzenschein gemütlich zusammen und aßen die leckere Pizza vom Italiener. Der Stress war vergessen und alle waren glücklich.", "level": "A1+"}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
