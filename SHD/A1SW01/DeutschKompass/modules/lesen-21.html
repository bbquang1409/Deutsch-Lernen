<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Gesundheit: Beim Arzt", "mode": "lesen", "level": "B1", "text": "Peter ist krank. Er geht zum Arzt.\n\n\"Was fehlt Ihnen?\", fragt der Arzt. \"Ich habe Husten, Schnupfen und Fieber\", sagt Peter. \"Wie lange sind Sie schon krank?\" - \"Seit gestern.\"\n\nDer Arzt hört seine Lunge ab, misst seine Temperatur und sieht in seinen Mund. \"Sie haben eine schlimme Erkältung. Rauchen Sie?\" - \"Nein, ich rauche nicht.\"\n\n\"Das ist gut, Rauchen ist nicht gesund. Haben Sie Allergien?\" - \"Nein, ich habe keine Allergien.\"\n\nDer Arzt gibt Peter ein Rezept. \"Ich verschreibe Ihnen Medikamente, die holen Sie bitte aus der Apotheke. Nehmen Sie morgens eine Tablette und am Abend einen Löffel Hustensaft.\" \"Darf ich morgen Fußball spielen?\"\n\n\"Nein, das dürfen Sie nicht. Sie müssen drei Tage im Bett bleiben und sollten viel Tee mit Honig trinken. In einer Woche dürfen Sie wieder Fußball spielen. Ich wünsche Ihnen gute Besserung!\"", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wie lange ist Peter schon krank?", "options": ["Seit drei Tagen", "Seit einer Woche", "Seit gestern", "Seit vorgestern"], "answer": 2}, {"type": "mc", "q": "Was macht der Arzt?", "options": ["Er misst seinen Blutdruck.", "Er sieht in seine Ohren.", "Er hört seine Lunge ab.", "Er gibt ihm eine Spritze."], "answer": 2}, {"type": "mc", "q": "Was soll Peter aus der Apotheke holen?", "options": ["Medikamente", "Ein Rezept", "Tee", "Zigaretten"], "answer": 0}, {"type": "mc", "q": "Was darf Peter morgen nicht?", "options": ["Im Bett bleiben", "Tee mit Honig trinken", "Fußball spielen", "Schlafen"], "answer": 2}, {"type": "mc", "q": "Wann soll Peter den Hustensaft nehmen?", "options": ["Am Abend", "Zweimal täglich", "Drei Tage", "Am Morgen"], "answer": 0}, {"type": "tf", "q": "Peter hat Fieber.", "answer": true}, {"type": "tf", "q": "Peter muss drei Tage im Bett bleiben.", "answer": true}, {"type": "tf", "q": "Peter raucht.", "answer": false}, {"type": "order", "q": "Beim Arzt", "options": ["Der Arzt fragt nach Allergien", "Der Arzt gibt Peter ein Rezept", "Der Arzt hört die Lunge ab", "Der Arzt fragt, ob Peter raucht"], "answer": ["Der Arzt hört die Lunge ab", "Der Arzt fragt, ob Peter raucht", "Der Arzt fragt nach Allergien", "Der Arzt gibt Peter ein Rezept"]}, {"type": "order", "q": "Nach dem Arzt", "options": ["Wieder Fußball spielen dürfen", "Zum Arzt gehen", "Drei Tage im Bett bleiben", "Medikamente aus der Apotheke holen"], "answer": ["Zum Arzt gehen", "Medikamente aus der Apotheke holen", "Drei Tage im Bett bleiben", "Wieder Fußball spielen dürfen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
