<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Der Flughafen", "mode": "lesen", "text": "Herr Brandt, ein Freund von Herrn Nam, arbeitet drei Wochen für seine Firma in Rom. Heute erhält Nam einen Brief. Herr Brandt schreibt: \"Meine Arbeit in Rom ist bald fertig; dann komme ich nach Berlin. Mein Ankunftstag ist der 10. November. Das Flugzeug fliegt direkt von Rom nach Berlin. Ich komme abends um 18.50 Uhr in Tegel an.\"\n\nDer 10. November ist ein Freitag, und freitags hat Nam keinen Unterricht. Er fährt schon um 17.45 Uhr nach Tegel. Er kennt den Flughafen gut; denn er ist nicht das erste Mal hier.\n\n\"Bitte\", fragt Nam einen Mann in Uniform, \"kommt das Flugzeug aus Rom abends pünktlich an?\"\n\n\"Unsere Flugzeuge sind fast immer pünktlich\", antwortet der Angestellte. \"Heute starten und landen fünfzig Flugzeuge. Sehen Sie, dort fliegt das Flugzeug nach Athen, und hier kommt das Flugzeug aus Paris. Es ist das dreiundvierzigste und landet um zwanzig Minuten nach sechs.\"\n\n\"Wo sehe ich die Landung gut?\" fragt Nam.\n\n\"Hier, durch dieses Fenster sehen Sie die Landung und den Start sehr gut.\" Nam wartet noch eine halbe Stunde. Er sieht die Flugzeuge aus New York und Köln.\n\nSchon um Viertel vor sieben landet das Flugzeug aus Rom. Die Arbeiter bringen eine Treppe und machen die Tür auf. Ungefähr siebzig Personen steigen aus. Endlich sieht Nam auch seinen Freund. Er sagt: \"Willkommen in Berlin!\" Dann fahren sie nach Hause.", "source": "", "questions": [{"type": "mc", "q": "Wie lange arbeitet Herr Brandt in Rom?", "options": ["Eine Woche", "Drei Monate", "Drei Wochen", "Ein Jahr"], "answer": 2}, {"type": "mc", "q": "Wann kommt Herr Brandt in Berlin an?", "options
