<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Der Weg zur Post", "mode": "lesen", "level": "A2", "text": "Marco ist neu in der Stadt. Er hat gestern einen Brief an seine Eltern geschrieben, heute möchte er ihn zur Post bringen. Aber wo ist die Post? Marco hat die Adresse im Internet nicht gefunden. Er muss jemanden fragen. An der Bushaltestelle steht ein alter Mann.\n\n\"Entschuldigung, wo ist bitte die Post?\", fragt Marco höflich. \"In der Goethestraße\", antwortet der alte Mann. \"Muss ich mit dem Bus fahren oder kann ich zu Fuß gehen?\", fragt Marco. \"Dieser Bus hält direkt vor der Post. Sie müssen bei der dritten Station aussteigen\", sagt der alte Mann. \"Ich möchte lieber zu Fuß gehen. Wie komme ich zur Goethestraße?\", fragt Marco. \"Sie gehen diese Straße geradeaus und biegen an der ersten Kreuzung rechts ab. Nach ungefähr 500 Metern kommen Sie an eine Ampel. Dort überqueren Sie die Straße und biegen nach links in die Schillerstraße ein. An der nächsten Kreuzung gehen Sie nach rechts in die Goethestraße. Dort ist die Post.\" \"Vielen Dank!\", sagt Marco und geht los.", "source": "lingua.com", "questions": [{"type": "mc", "q": "Wo hat Marco die Adresse der Post nicht gefunden?", "options": ["Im Telefonbuch", "Auf dem Stadtplan", "Im Internet", "Auf dem Busfahrplan"], "answer": 2}, {"type": "mc", "q": "Was möchte Marco auf der Post machen?", "options": ["Telefonieren", "Einen Brief abschicken", "Briefpapier kaufen", "Nach dem Weg fragen"], "answer": 1}, {"type": "mc", "q": "Wo hält der Bus?", "options": ["In der Schillerstraße", "An der ersten Kreuzung", "Nach 500 Metern", "Vor der Post"], "answer": 3}, {"type": "mc", "q": "Wie oft muss Marco die Straße überqueren?", "options": ["Einmal", "Zweimal", "Dreimal", "Viermal"], "answer": 0}, {"type": "mc", "q": "Was muss Marco an der ersten Kreuzung tun?", "options": ["Nach links abbiegen", "Nach rechts abbiegen", "Geradeaus weitergehen", "Aus dem Bus aussteigen"], "answer": 1}, {"type": "tf", "q": "Marco hat die Adresse der Post im Internet gefunden.", "answer": false}, {"type": "tf", "q": "Marco fährt mit dem Bus zur Post.", "answer": false}, {"type": "tf", "q": "Der alte Mann steht an der Bushaltestelle.", "answer": true}, {"type": "order", "q": "Der Weg", "options": ["An der Ampel die Straße überqueren und links abbiegen", "Die Straße geradeaus gehen", "An der nächsten Kreuzung rechts in die Goethestraße gehen", "An der ersten Kreuzung rechts abbiegen"], "answer": ["Die Straße geradeaus gehen", "An der ersten Kreuzung rechts abbiegen", "An der Ampel die Straße überqueren und links abbiegen", "An der nächsten Kreuzung rechts in die Goethestraße gehen"]}, {"type": "order", "q": "Marcos Weg zur Post", "options": ["Zur Post gehen", "Den Brief schreiben", "Den alten Mann fragen", "Im Internet die Adresse suchen"], "answer": ["Den Brief schreiben", "Im Internet die Adresse suchen", "Den alten Mann fragen", "Zur Post gehen"]}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
