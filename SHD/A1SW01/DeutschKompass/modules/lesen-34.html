<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>DeutschKompass</title><link rel="stylesheet" href="../assets/css/app.css"></head><body><main id="app"></main><script id="lesson-data" type="application/json">{"title": "Die Klugheit des Bauern", "mode": "lesen", "text": "Der Bauer lebt mit seiner Familie auf einem großen Bauernhof in einem kleinen Dorf. Dort züchtet er verschiedene Tiere. Außer Haustieren und Geflügel hat er aber auch Kühe, Ziegen, Schafe und einen Büffel. Sein Bauernhof ist umgeben von weiten Feldern, auf diesen Feldern baut er Getreide und Gemüse an. Jeden Tag kümmert er sich um die Tiere und die Felder. Der Bauer ist bekannt für seine jahrelange Erfahrung in der Landwirtschaft.\n\nAn einem Morgen kommt er in seinen Stall und findet seinen Büffel nicht. Die Stalltür steht offen, und das Schloss ist entzwei. \"Das ist die Tat eines Diebes\", sagt er zu seinem Sohn. \"Gehen wir auf den Markt! Vielleicht will der Dieb unseren Büffel dort verkaufen.\"\n\nSo geht der Bauer mit dem Jungen auf den Markt. Dort sagt er zu seinem Sohn: \"Du gehst nach links, und ich gehe nach rechts. Dann müssen wir unseren Büffel finden.\"\n\nDer Sohn des Bauern sucht gar nicht lange, da findet er schon den Büffel. Schnell holt er seinen Vater. Dieser ruft einen Polizisten und sagt: \"Das ist mein Büffel, und der Verkäufer ist ein Dieb!\" Aber der Verkäufer antwortet wütend: \"Beleidigen Sie mich nicht! Ich habe diesen Büffel schon seit drei Jahren!\"\n\nDa fragt der Polizist den Bauern: \"Können Sie Ihre Behauptung beweisen?\" \"Das ist sehr leicht\", sagt der Bauer. Schnell legt er seine Hände über die Augen des Büffels und fragt den Verkäufer: \"Ist das Tier rechts oder links blind?\" Der Mann antwortet: \"Natürlich rechts!\"\n\n\"Falsch!\" lacht der Bauer. \"Ach nein\", sagt der Dieb jetzt aufgeregt, \"ich will sagen, der Büffel kann rechts sehen und ist links blind!\" \"Auch das ist falsch\", ruft der Bauer und nimmt seine Hände von den Augen des Tieres. \"Mein Büffel ist gar nicht blind! Genügt Ihnen dieser Beweis, Herr Wachtmeister?\"\n\n\"Ja\", antwortet der Polizist. \"Nehmen Sie Ihren Büffel und gehen Sie mit ihm nach Hause! – Sie aber\", sagt er zu dem Dieb, \"kommen Sie mit mir aufs Revier!\"", "source": "", "questions": [{"type": "mc", "q": "Wo lebt der Bauer?", "options": ["In einer Stadt", "Auf einem großen Bauernhof in einem kleinen Dorf", "In einem Berghaus", "Am Meer"], "answer": 1}, {"type": "mc", "q": "Welche Tiere hat der Bauer außer Haustieren und Geflügel?", "options": ["Pferde, Schweine und Esel", "Hunde und Katzen", "Kühe, Ziegen, Schafe und einen Büffel", "Elefanten und Affen"], "answer": 2}, {"type": "mc", "q": "Was findet der Bauer am Morgen im Stall nicht?", "options": ["Seinen Sohn", "Seinen Hund", "Seine Kühe", "Seinen Büffel"], "answer": 3}, {"type": "mc", "q": "Was glaubt der Bauer?", "options": ["Ein Dieb will den Büffel auf dem Markt verkaufen.", "Der Büffel ist krank geworden.", "Sein Sohn hat den Büffel verkauft.", "Der Büffel ist von selbst gegangen."], "answer": 0}, {"type": "mc", "q": "Wer findet den Büffel zuerst?", "options": ["Der Bauer", "Der Sohn des Bauern", "Der Polizist", "Der Verkäufer"], "answer": 1}, {"type": "mc", "q": "Was behauptet der Verkäufer?", "options": ["Er hat den Büffel gestern gekauft.", "Der Büffel gehört dem Polizisten.", "Er hat den Büffel schon seit drei Jahren.", "Er hat den Büffel gefunden."], "answer": 2}, {"type": "mc", "q": "Wie beweist der Bauer, dass der Büffel ihm gehört?", "options": ["Er zeigt ein Foto.", "Er ruft seine Frau.", "Er zeigt einen Kaufvertrag.", "Er hält die Hände über die Augen des Büffels und fragt, welches Auge blind ist."], "answer": 3}, {"type": "mc", "q": "Warum sind beide Antworten des Verkäufers falsch?", "options": ["Der Büffel ist gar nicht blind.", "Der Büffel ist schon sehr alt.", "Der Verkäufer kennt den Bauern.", "Der Büffel kann nur links sehen."], "answer": 0}, {"type": "tf", "q": "Der Verkäufer gibt zwei verschiedene Antworten.", "answer": true}, {"type": "mc", "q": "Was passiert mit dem Dieb am Ende?", "options": ["Er bekommt den Büffel.", "Er muss mit dem Polizisten aufs Revier.", "Er geht nach Hause.", "Er zahlt dem Bauern Geld."], "answer": 1}]}</script><script src="../assets/js/manifest.js"></script><script src="../assets/js/core.js"></script><script src="../assets/vendor/three.min.js"></script><script src="../assets/js/scene3d.js"></script><script src="../assets/js/lesson.js"></script></body></html>
