<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Umgangssprache vs. Gehobenes Deutsch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--paper:#f6f3ea;--paper-2:#eeead9;--line:#d9d2b8;--ink:#1f2d3a;--ink-soft:#5c6a72;--gold:#9c7a22;--gold-bg:#f1e6c2;--crimson:#8a3a2c;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  header{max-width:820px;margin:0 auto;padding:34px 5vw 18px;border-bottom:2px solid var(--gold);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(24px,5vw,34px);margin:0 0 10px;}
  h1 em{font-style:italic;color:var(--gold);font-weight:500;}
  .sub{font-size:14.5px;line-height:1.6;color:var(--ink-soft);max-width:620px;margin:0;}
  nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);}
  .navrow{max-width:820px;margin:0 auto;padding:10px 5vw;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:none;text-decoration:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:#fffdf6;}
  main{max-width:820px;margin:0 auto;padding:6px 5vw 60px;}
  section{padding-top:26px;}
  section h2{font-family:'Fraunces',serif;font-size:20px;margin:0 0 4px;}
  section h2 span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:2px;margin-right:8px;}
  .pair{background:#fffdf6;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px;}
  .row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;}
  .row + .row{border-top:1px dashed var(--line);}
  .tag{flex:none;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:3px 7px;border-radius:4px;margin-top:2px;}
  .tag.cas{background:#f3e3dd;color:var(--crimson);}
  .tag.form{background:var(--gold-bg);color:var(--gold);}
  .txt{flex:1;font-size:14.5px;line-height:1.5;}
  .txt.formal{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:16px;color:var(--ink);}
  .speak{border:none;background:none;cursor:pointer;font-size:13px;color:var(--gold);opacity:.8;padding:2px 4px;flex:none;}
  .note{font-size:12.5px;line-height:1.5;color:var(--ink-soft);font-style:italic;margin:8px 0 0;}
  .vn-btn{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:20px;cursor:pointer;}
  .vn-btn:active{background:var(--gold);color:#fff;}
  .vn{display:none;font-size:12.5px;line-height:1.5;color:var(--crimson);background:#fbeee9;border-left:2px solid var(--crimson);padding:6px 9px;margin-top:6px;}
  .vn.open{display:block;}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Register-Wechsel</div>
  <h1><em>Umgangssprache</em> vs. Gehobenes Deutsch</h1>
  <p class="sub">64 Satzpaare in 8 Themen — links, wie man es locker unter Freunden sagt, rechts die gehobene Version für Beruf, Behörde oder Prüfung.</p>
</header>
<nav><div class="navrow" id="nav"></div></nav>
<main id="main"></main>

<script src="js/c1-data-core.js"></script>
<script src="data/umgangssprache.js"></script>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
const src=C1Data.get('umgangssprache');
const items=src?src.items:[];
const themes=[];items.forEach(i=>{if(themes.indexOf(i.theme)<0)themes.push(i.theme);});
document.getElementById('nav').innerHTML=themes.map((t,i)=>`<a href="#t${i}">${esc(t)}</a>`).join('');
let uid=0;
document.getElementById('main').innerHTML=themes.map((th,i)=>{
  const cards=items.filter(x=>x.theme===th).map(x=>{
    const id='vn'+(uid++);
    return `<div class="pair">
      <div class="row"><span class="tag cas">Umgangssprache</span><div class="txt">${esc(x.casual)}</div><button class="speak" type="button" data-say="${esc(x.casual)}">🔊</button></div>
      <div class="row"><span class="tag form">Gehoben</span><div class="txt formal">${esc(x.formal)}</div><button class="speak" type="button" data-say="${esc(x.formal)}">🔊</button></div>
      <p class="note">${esc(x.note)}</p>
      <button class="vn-btn" type="button" data-t="${id}">VN</button>
      <div class="vn" id="${id}">${esc(x.vn)}</div>
    </div>`;}).join('');
  return `<section id="t${i}"><h2><span>${String(i+1).padStart(2,'0')}</span>${esc(th)}</h2>${cards}</section>`;
}).join('');
document.getElementById('main').addEventListener('click',e=>{
  const v=e.target.closest('.vn-btn');if(v){document.getElementById(v.dataset.t).classList.toggle('open');return;}
  const s=e.target.closest('.speak');if(s){speak(s.dataset.say);}
});
</script>
</body>
</html>
