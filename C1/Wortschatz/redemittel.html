<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Redemittel für Diskussionen — B2 · C1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{color-scheme:light;--paper:#f6f3ea;--paper-2:#eeead9;--line:#d9d2b8;--ink:#1f2d3a;--ink-soft:#5c6a72;--gold:#9c7a22;--gold-bg:#f1e6c2;--crimson:#8a3a2c;}
  *{box-sizing:border-box;}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  header{max-width:820px;margin:0 auto;padding:34px 5vw 18px;border-bottom:2px solid var(--gold);}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(26px,5vw,36px);margin:0 0 10px;}
  h1 em{font-style:italic;color:var(--gold);font-weight:500;}
  .sub{font-size:14.5px;line-height:1.6;color:var(--ink-soft);max-width:620px;margin:0;}
  nav{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);}
  .navrow{max-width:820px;margin:0 auto;padding:10px 5vw;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none;}
  .navrow::-webkit-scrollbar{display:none;}
  .navrow a{flex:none;text-decoration:none;color:var(--ink-soft);font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:#fffdf6;}
  .navrow a:active{background:var(--gold-bg);}
  main{max-width:820px;margin:0 auto;padding:6px 5vw 60px;}
  section{padding-top:26px;}
  section h2{font-family:'Fraunces',serif;font-size:21px;margin:0 0 4px;}
  section h2 span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:2px;margin-right:8px;}
  .card{background:#fffdf6;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:10px;}
  .top{display:flex;align-items:flex-start;gap:8px;}
  .phrase{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:18px;color:var(--ink);flex:1;line-height:1.35;}
  .speak{border:none;background:none;cursor:pointer;font-size:14px;color:var(--gold);opacity:.8;padding:2px 4px;border-radius:4px;}
  .speak:active{background:var(--gold-bg);}
  .reg{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;background:var(--gold-bg);color:var(--gold);padding:3px 8px;border-radius:999px;margin:8px 0 6px;}
  .note{font-size:13px;line-height:1.5;color:var(--ink-soft);font-style:italic;margin:0 0 6px;}
  ol{margin:4px 0 0;padding-left:18px;font-size:14px;line-height:1.55;}
  ol li::marker{color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .vn-btn{margin-top:8px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:4px 10px;border-radius:20px;cursor:pointer;}
  .vn-btn:active{background:var(--gold);color:#fff;}
  .vn{display:none;font-size:12.5px;line-height:1.5;color:var(--crimson);background:#fbeee9;border-left:2px solid var(--crimson);padding:6px 9px;margin-top:6px;}
  .vn.open{display:block;}
  .todo{margin-top:34px;padding:14px 16px;border:1px dashed var(--line);border-radius:8px;font-size:13px;color:var(--ink-soft);}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Redemittel · B2 – C1</div>
  <h1>Redemittel für <em>Diskussionen</em></h1>
  <p class="sub">64 Redemittel in 8 Funktionen: eröffnen, Meinung äußern, zustimmen, einschränken, widersprechen, Argumente ordnen, begründen, Beispiele nennen. 🔊 spricht vor, „VN“ zeigt die Übersetzung.</p>
</header>
<nav><div class="navrow" id="nav"></div></nav>
<main id="main"></main>

<script src="js/c1-data-core.js"></script>
<script src="data/redemittel.js"></script>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function speak(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=0.95;speechSynthesis.speak(u);}catch(e){}}
const src=C1Data.get('redemittel');
const items=src?src.items:[];
const funcs=[];items.forEach(i=>{if(funcs.indexOf(i.func)<0)funcs.push(i.func);});
const nav=document.getElementById('nav');
const main=document.getElementById('main');
nav.innerHTML=funcs.map((f,i)=>`<a href="#f${i}">${esc(f)}</a>`).join('');
let uid=0;
main.innerHTML=funcs.map((f,i)=>{
  const cards=items.filter(x=>x.func===f).map(x=>{
    const id='vn'+(uid++);
    return `<div class="card">
      <div class="top"><div class="phrase">${esc(x.phrase)}</div><button class="speak" type="button" data-say="${esc(x.phrase)}" aria-label="Anhören">🔊</button></div>
      <span class="reg">${esc(x.register)}</span>
      <p class="note">${esc(x.note)}</p>
      <ol>${x.examples.map(e=>`<li>${esc(e)}</li>`).join('')}</ol>
      <button class="vn-btn" type="button" data-t="${id}">VN</button>
      <div class="vn" id="${id}">${esc(x.vn)}</div>
    </div>`;}).join('');
  return `<section id="f${i}"><h2><span>${String(i+1).padStart(2,'0')}</span>${esc(f)}</h2>${cards}</section>`;
}).join('')+'<div class="todo">Noch nicht in der Quelle: Abwägen (Vor- und Nachteile), Nachfragen, Lösungen vorschlagen, Fazit ziehen. Kommen mit der nächsten Quelle dazu.</div>';
main.addEventListener('click',e=>{
  const v=e.target.closest('.vn-btn');if(v){document.getElementById(v.dataset.t).classList.toggle('open');return;}
  const s=e.target.closest('.speak');if(s){speak(s.dataset.say);}
});
</script>
</body>
</html>
