<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Wortschatz C1 – Übersicht</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f7f5f0; --card-bg:#ffffff; --ink:#233333; --ink-soft:#5c6b6b;
    --line:#e2ded4; --teal:#1b5c5d; --indigo:#3b4a9e; --sage:#4c7a5a; --accent:#d5722c;
    --shadow:0 2px 10px rgba(15,61,62,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;}
  header{background:#e9f1ee;border-bottom:1px solid var(--line);color:var(--teal);padding:30px 20px 28px;text-align:center;}
  header h1{margin:0 0 8px;font-size:1.6rem;letter-spacing:.5px;}
  header p{margin:0;color:var(--ink-soft);font-size:.95rem;}
  .wrap{max-width:900px;margin:0 auto;padding:22px 16px 60px;}
  .search-box{margin:0 auto 10px;max-width:520px;position:relative;}
  .search-box input{width:100%;padding:13px 16px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card-bg);box-shadow:var(--shadow);font-size:1rem;color:var(--ink);}
  .search-box input:focus{outline:2px solid var(--indigo);outline-offset:1px;}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-soft);}

  .group{margin-top:28px;}
  .group-head{display:flex;align-items:center;gap:10px;width:100%;margin:0;padding:14px 16px;background:var(--card-bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);cursor:pointer;font:inherit;color:inherit;text-align:left;}
  .group-head:hover{box-shadow:0 4px 14px rgba(15,61,62,.14);}
  .group-head:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;}
  .group-head .gt{flex:1;min-width:0;}
  .group-head h2{margin:0;font-size:1.1rem;color:var(--teal);}
  .group-head .gs{display:block;font-size:.85rem;color:var(--ink-soft);margin-top:2px;}
  .group-head .count{flex:0 0 auto;font-size:.78rem;font-weight:700;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;}
  .group-head .chev{flex:0 0 auto;width:20px;height:20px;stroke:var(--ink-soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease;}
  .group.open .group-head .chev{transform:rotate(90deg);}
  .group-body{display:none;padding-top:14px;}
  .group.open .group-body{display:block;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{display:flex;align-items:center;gap:14px;background:var(--card-bg);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .15s ease,box-shadow .15s ease;}
  .card:hover{box-shadow:0 4px 14px rgba(15,61,62,.14);}
  .card:active{transform:scale(.98);}
  .card.placeholder{border-style:dashed;background:transparent;box-shadow:none;color:var(--ink-soft);cursor:default;}
  .card.placeholder:active{transform:none;}
  .card.placeholder .icon{background:#e2ded4 !important;}
  .icon{flex:0 0 auto;width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .icon svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .meta{flex:1;min-width:0;}
  .num{font-size:.72rem;font-weight:700;color:var(--ink-soft);letter-spacing:.5px;text-transform:uppercase;}
  .title{font-size:1.02rem;font-weight:600;line-height:1.25;margin-top:2px;}
  .card .arrow{flex:0 0 auto;width:20px;height:20px;stroke:var(--ink-soft);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  footer{text-align:center;color:var(--ink-soft);font-size:.82rem;padding:10px 20px 30px;}
  .no-result{display:none;text-align:center;color:var(--ink-soft);padding:30px 0;font-size:.95rem;}
</style>
</head>
<body>

<header>
  <h1>🇩🇪 Wortschatz C1</h1>
  <p>Alle Wortschatz-Module an einem Ort</p>
</header>

<div class="wrap">
  <div class="search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" placeholder="Suchen…" autocomplete="off">
  </div>

  <div id="groups"></div>
  <p class="no-result" id="noResult">Nichts gefunden.</p>
</div>

<footer>Sprachzentrum · C1 Wortschatz</footer>

<script>
/* ==========================================================
   KONFIGURATION – hier neue Module eintragen
   Jeder Eintrag: { num, title, href, color, icon, search }
   Platzhalter: { placeholder:true } → gestrichelte Karte ohne Link
   Pfade: alle Dateien liegen im selben Ordner (C1/Wortschatz/).
   ========================================================== */
var ICONS = {
  chat:   '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/>',
  home:   '<path d="m3 11 9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>',
  heart:  '<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10Z"/>',
  screen: '<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M2 20h20"/><path d="M9 20l1-4h4l1 4"/>',
  gov:    '<path d="M3 10 12 4l9 6"/><rect x="4" y="10" width="16" height="9" rx="0.5"/><path d="M7 10v9M11 10v9M15 10v9"/>',
  ladder: '<path d="M7 3v18M17 3v18M7 7h10M7 12h10M7 17h10"/>',
  swap:   '<path d="M7 7h12l-3-3M17 17H5l3 3"/>',
  talk:   '<path d="M4 5h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/><path d="M20 9h1a1 1 0 0 1 1 1v8l-3-2h-5"/>',
  plus:   '<path d="M12 5v14M5 12h14"/>'
};

var GROUPS = [
  {
    title: "Training Wortschatz C1",
    sub: "Teil 1 · Themen A–E",
    items: [
      { num:"Kapitel A", title:"Kommunikation und persönliche Beziehungen", href:"Kapitel-A-C1.html", color:"#3b4a9e", icon:"chat",
        search:"a kapitel kommunikation persönliche beziehungen gespräch freundschaft familie" },
      { num:"Kapitel B", title:"Wohnen", href:"Kapitel-B-C1.html", color:"#d5722c", icon:"home",
        search:"b kapitel wohnen wohnung haus miete umzug" },
      { num:"Kapitel C", title:"Ernährung und Gesundheit", href:"Kapitel-C-C1.html", color:"#4c7a5a", icon:"heart",
        search:"c kapitel ernährung gesundheit essen krankheit medizin" },
      { num:"Kapitel D", title:"Medien und Kultur", href:"Kapitel-D-C1.html", color:"#1b5c5d", icon:"screen",
        search:"d kapitel medien kultur zeitung film kunst literatur" },
      { num:"Kapitel E", title:"Politik und Gesellschaft", href:"Kapitel-E-C1.html", color:"#3b4a9e", icon:"gov",
        search:"e kapitel politik gesellschaft staat wahl demokratie" }
    ]
  },
  {
    title: "Gehobenes Deutsch & Redemittel",
    sub: "Ergänzende Module",
    items: [
      { num:"B1 → B2 → C1", title:"Wortschatz-Leiter", href:"wortschatz-leiter.html", color:"#4c7a5a", icon:"ladder",
        search:"wortschatz leiter b1 b2 c1 synonym gehoben stufen" },
      { num:"Register", title:"Umgangssprache vs. Gehobenes Deutsch", href:"umgangssprache.html", color:"#d5722c", icon:"swap",
        search:"umgangssprache gehobenes deutsch register locker formell" },
      { num:"Diskussion", title:"Redemittel für Diskussionen", href:"redemittel.html", color:"#3b4a9e", icon:"talk",
        search:"redemittel diskussionen meinung zustimmen widersprechen begründen debatte" },
      { placeholder:true, num:"Platzhalter", title:"Weiteres Modul folgt", icon:"plus", search:"platzhalter weiteres modul folgt" }
    ]
  }
];

/* ---------- Rendering ---------- */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var ARROW='<svg class="arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>';

document.getElementById('groups').innerHTML = GROUPS.map(function(g){
  var cards = g.items.map(function(it){
    var inner =
      '<div class="icon" style="background:'+(it.color||'#e2ded4')+';"><svg viewBox="0 0 24 24">'+ICONS[it.icon]+'</svg></div>'+
      '<div class="meta"><div class="num">'+esc(it.num)+'</div><div class="title">'+esc(it.title)+'</div></div>';
    if(it.placeholder){
      return '<div class="card placeholder" data-search="'+esc(it.search)+'">'+inner+'</div>';
    }
    return '<a class="card" href="'+esc(it.href)+'" data-search="'+esc(it.search)+'">'+inner+ARROW+'</a>';
  }).join('');
  return '<section class="group"><button type="button" class="group-head" aria-expanded="false"><span class="gt"><h2>'+esc(g.title)+'</h2><span class="gs">'+esc(g.sub)+'</span></span><span class="count">'+g.items.filter(function(i){return !i.placeholder;}).length+'</span><svg class="chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button><div class="group-body"><div class="grid">'+cards+'</div></div></section>';
}).join('');

/* ---------- Ein-/Ausklappen ---------- */
function setOpen(group,open){
  group.classList.toggle('open',open);
  group.querySelector('.group-head').setAttribute('aria-expanded',open?'true':'false');
}
document.getElementById('groups').addEventListener('click',function(e){
  var head=e.target.closest('.group-head');
  if(head){var g=head.parentNode;setOpen(g,!g.classList.contains('open'));}
});

/* ---------- Suche ---------- */
var input=document.getElementById('searchInput');
var noResult=document.getElementById('noResult');
var saved=null;
input.addEventListener('input',function(){
  var q=input.value.trim().toLowerCase(), total=0;
  var groups=Array.prototype.slice.call(document.querySelectorAll('.group'));
  if(q&&!saved){saved=groups.map(function(g){return g.classList.contains('open');});}
  groups.forEach(function(group,gi){
    var shown=0;
    Array.prototype.forEach.call(group.querySelectorAll('.card'),function(card){
      var match=(card.getAttribute('data-search')||'').indexOf(q)!==-1;
      card.style.display=match?'flex':'none';
      if(match)shown++;
    });
    group.style.display=shown?'block':'none';
    if(q){setOpen(group,shown>0);}
    else if(saved){setOpen(group,saved[gi]);}
    total+=shown;
  });
  if(!q)saved=null;
  noResult.style.display=total?'none':'block';
});
</script>
</body>
</html>
